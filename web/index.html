<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e13" />
    <meta name="description" content="半月 · 雷半斩的生活随笔与读书笔记，关于城市、阅读与慢下来的日常。" />
    <title>半月 · 生活随笔与读书笔记</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 首屏渲染前先定主题，避免亮色用户看到一闪而过的暗色 -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('banyue:theme')
          var mode = raw ? JSON.parse(raw) : 'dark'
          if (mode !== 'dark' && mode !== 'light' && mode !== 'auto') mode = 'dark'
          var palettes = ['teal', 'paper', 'night', 'forest', 'sakura']
          var rawPalette = localStorage.getItem('banyue:palette')
          var palette = rawPalette ? JSON.parse(rawPalette) : 'teal'
          if (palettes.indexOf(palette) === -1) palette = 'teal'
          var light =
            mode === 'light' ||
            (mode === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches)
          var root = document.documentElement
          root.dataset.theme = light ? 'light' : 'dark'
          root.dataset.palette = palette
          // 背景色要和 CSS 里的 --bg 一致，否则移动端地址栏会跳色
          var BG = {
            dark: { teal: '#0a0e13', paper: '#14110c', night: '#080b16', forest: '#08120d', sakura: '#120a10' },
            light: { teal: '#f7f9fc', paper: '#faf6ee', night: '#f5f7fd', forest: '#f6faf6', sakura: '#fdf6f9' },
          }
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', BG[light ? 'light' : 'dark'][palette])
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.dataset.palette = 'teal'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
