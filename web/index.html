<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e13" />
    <meta name="description" content="半月 · 雷半斩的生活随笔与读书笔记，关于城市、阅读与慢下来的日常。" />
    <title>半月 · 生活随笔与读书笔记</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 首屏渲染前先定主题，避免亮色用户看到一闪而过的暗色 -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('banyue:theme')
          var mode = raw ? JSON.parse(raw) : 'dark'
          if (mode !== 'dark' && mode !== 'light' && mode !== 'auto') mode = 'dark'
          var light =
            mode === 'light' ||
            (mode === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.dataset.theme = light ? 'light' : 'dark'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', light ? '#f6f8fb' : '#0a0e13')
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
