const CLOUD_OK_KEY = 'wb_halfpage_cloud_ok';

function cloudAuthed() {
  try { return localStorage.getItem(CLOUD_OK_KEY) === '1'; } catch (e) { return false; }
}

function markCloudOk() {
  try { localStorage.setItem(CLOUD_OK_KEY, '1'); } catch (e) { /* 忽略 */ }
}

async function fileHash(file) {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await file.arrayBuffer();
      const dig = await crypto.subtle.digest('SHA-256', buf);
      const arr = new Uint8Array(dig).slice(0, 8);
      let out = '';
      for (let i = 0; i < arr.length; i++) out += ('0' + arr[i].toString(16)).slice(-2);
      return out;
    }
  } catch (e) { /* 落到弱指纹 */ }
  return weakHash(file.name, file.size);
}

/* 内容指纹不可用时的兜底：名字 + 大小 */
function weakHash(name, size) {
  return 'w' + Number(size || 0).toString(36) + '-' + String(name || '').length.toString(36);
}

function baseName(n) {
  return String(n || '').replace(/\.[^.]+$/, '');
}

function sigOf(name, size) {
  return baseName(name).toLowerCase() + '|' + Number(size || 0);
}

function shortHash(h) {
  return h ? '#' + h.slice(0, 6) : '';
}

/* 播放队列：收藏 → 本地 → 云端 */
function queueList() {
  const q = [];
  favAll().forEach(function (f) {
    q.push({ kind: 'fav', key: f.key, title: f.title, artist: f.artist, url: f.url, viewUrl: f.viewUrl, hash: f.hash });
  });
  (musicState.local || []).forEach(function (t) {
    q.push({ kind: 'local', id: t.id, name: t.name, blob: t.blob, hash: t.hash });
  });
  (musicState.cloud || []).forEach(function (c) {
    q.push({ kind: 'cloud', id: c.id, name: c.name, attId: c.attId, attName: c.attName, hash: c.hash });
  });
  return q;
}

function queuePos() {
  const cur = musicState.current;
  if (!cur) return -1;
  return queueList().findIndex(function (it) {
    if (it.kind !== cur.kind) return false;
    return cur.kind === 'fav' ? it.key === cur.key : it.id === cur.id;
  });
}

async function playQueueItem(it) {
  if (!it) return;
  if (it.kind === 'fav') {
    await playStream(it.url, {
      kind: 'fav', title: it.title, artist: it.artist, h: hashCode(it.title + it.artist),
      url: it.url, viewUrl: it.viewUrl, key: it.key, hash: it.hash
    });
  } else if (it.kind === 'local') {
    await playLocalTrack({ id: it.id, name: it.name, blob: it.blob, hash: it.hash });
  } else if (it.kind === 'cloud') {
    await playCloudTrack(it);
  }
}

async function ensureQueueReady() {
  if (!(musicState.local && musicState.local.length)) {
    try {
      const list = await dbAllTracks();
      musicState.local = list || [];
    } catch (e) { /* 忽略 */ }
  }
  if (!(musicState.cloud && musicState.cloud.length) && document.getElementById('cloudMusicList')) {
    try {
      const list = await fetchCloudMusic();
      if (list) musicState.cloud = list;
    } catch (e) { /* 忽略 */ }
  }
}

async function advance(dir, auto) {
  const cur = musicState.current;
  if (!cur) return;
  if (cur.kind === 'preview') {
    const nx = musicState.index + dir;
    if (nx >= 0 && nx < musicState.results.length) { playPreview(nx); return; }
    await ensureQueueReady();
    const q = queueList();
    if (!q.length) { readerToast('试听结束，收藏或上传歌曲后可连续播放'); return; }
    await playQueueItem(dir > 0 ? q[0] : q[q.length - 1]);
    return;
  }
  await ensureQueueReady();
  const q = queueList();
  const i = queuePos();
  const nx = q[i + dir];
  if (!nx) {
    if (dir > 0) readerToast('已经是最后一首');
    return;
  }
  if (auto && nx.kind === 'cloud' && !cloudAuthed()) {
    readerToast('下一首在云端，点「下一首」继续（需登录）');
    return;
  }
  await playQueueItem(nx);
}

function stepTrack(dir) {

}

    : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>';

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const x = Math.floor(sec % 60);
  return m + ':' + (x < 10 ? '0' + x : x);
}

function audioDuration(a) {
  if (!a) return 0;
  const d = a.duration;
  if (isFinite(d) && d > 0) return d;
  try {
    if (a.seekable && a.seekable.length) {
      const e = a.seekable.end(a.seekable.length - 1);
      if (isFinite(e) && e > 0) return e;
    }
  } catch (e) { /* 忽略 */ }
  return 0;
}

function updateBar() {
  const bar = document.getElementById('pBar');
  if (!bar || !musicState.audio) return;
  const real = audioDuration(musicState.audio);
  const d = real || 30;
  const p = d ? Math.min(1, musicState.audio.currentTime / d) : 0;
  bar.style.width = (p * 100) + '%';
  const dot = document.getElementById('pDot');
  if (dot) dot.style.left = (p * 100) + '%';
}

/* 拖动进度条 */
let seeking = false;

function bindSeek() {
  const wrap = document.getElementById('pBarWrap');
  if (!wrap) return;

  function ratioOf(clientX) {
    const r = wrap.getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  }

  function paint(clientX) {
    const a = musicState.audio;
    const d = audioDuration(a) || 30;
    const ratio = ratioOf(clientX);
    const bar = document.getElementById('pBar');
    const dot = document.getElementById('pDot');
    const tm = document.getElementById('pTime');
    if (bar) bar.style.width = (ratio * 100) + '%';
    if (dot) dot.style.left = (ratio * 100) + '%';
    if (tm) tm.textContent = fmtTime(ratio * d) + ' / ' + fmtTime(d);
  }

  function seekTo(clientX) {
    const a = musicState.audio;
    if (!a) return;
    const d = audioDuration(a) || 30;
    try { a.currentTime = ratioOf(clientX) * d; } catch (err) { /* 忽略 */ }
  }

  wrap.addEventListener('pointerdown', function (e) {
    e.stopPropagation();
    e.preventDefault();
    if (!musicState.audio) return;
    seeking = true;
    wrap.classList.add('seeking');
    try { wrap.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    paint(e.clientX);
    seekTo(e.clientX);
  });

  wrap.addEventListener('pointermove', function (e) {
    if (!seeking) return;
    e.stopPropagation();
    paint(e.clientX);
    seekTo(e.clientX);
  });

  const end = function (e) {
    if (!seeking) return;
    seeking = false;
    wrap.classList.remove('seeking');
    if (e && typeof e.clientX === 'number') {
      paint(e.clientX);
      seekTo(e.clientX);
    }
    updateBar();
  };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
}

async function addLocalTracks(files) {
  const audio = Array.prototype.slice.call(files || []).filter(isAudioFile);
  if (!audio.length) { readerToast('没有可导入的音频文件'); return; }

  let list = [];
  try { list = await dbAllTracks(); } catch (e) { list = []; }
  const seen = {};
  const sigs = {};
  list.forEach(function (t) {
    if (t.hash) seen[t.hash] = 1;
    sigs[sigOf(t.name, t.size)] = 1;
  });

  let ok = 0, dup = 0, fail = 0;
  for (let i = 0; i < audio.length; i++) {
    const f = audio[i];
    batchUI('localBatch', '导入 ' + (i + 1) + '/' + audio.length + ' · ' + f.name, i / audio.length);
    const hash = await fileHash(f);
    const sig = sigOf(f.name, f.size);
    if ((hash && seen[hash]) || sigs[sig]) { dup++; continue; }
    if (hash) seen[hash] = 1;
    sigs[sig] = 1;
    try {
      await dbSaveTrack({
        id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name: f.name, size: f.size, blob: f, addedAt: Date.now() + i, hash: hash
      });
      ok++;
    } catch (e) { fail++; }
    await new Promise(function (r) { setTimeout(r, 0); });
  }

  batchUI('localBatch', null);
  renderLocalTracks();
  readerToast(batchSummary('导入', ok, dup, fail));
}

  const k = favKey(title, artist);

/* ---------- 频谱律动 ---------- */
const viz = { ac: null, analyser: null, raf: 0, data: null, ctx: null };

function attachAnalyser(audio) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!viz.ac) viz.ac = new AC();
    if (viz.ac.state === 'suspended') viz.ac.resume();
    const src = viz.ac.createMediaElementSource(audio);
    const an = viz.ac.createAnalyser();
    an.fftSize = 128;
    an.smoothingTimeConstant = 0.76;
    src.connect(an);
    an.connect(viz.ac.destination);
    viz.analyser = an;
    viz.data = new Uint8Array(an.frequencyBinCount);
    startViz();
  } catch (e) {
    viz.analyser = null;
    startViz();
  }
}

function startViz() {
  if (viz.raf) return;
  const loop = function () {
    viz.raf = requestAnimationFrame(loop);
    drawViz();
  };
  viz.raf = requestAnimationFrame(loop);
}

function stopViz() {
  if (viz.raf) cancelAnimationFrame(viz.raf);
  viz.raf = 0;
  viz.analyser = null;
  const c = document.getElementById('pViz');
  if (c) {
    const g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
  }
}

function drawViz() {
  const c = document.getElementById('pViz');
  if (!c) { if (viz.raf) cancelAnimationFrame(viz.raf); viz.raf = 0; return; }
  if (!viz.ctx) viz.ctx = c.getContext('2d');
  const g = viz.ctx;
  const w = c.width, h = c.height;
  g.clearRect(0, 0, w, h);

  const bins = 30;
  const vals = [];
  const an = viz.analyser;
  if (an && musicState.playing) {
    an.getByteFrequencyData(viz.data);
    const n = viz.data.length;
    for (let i = 0; i < bins; i++) {
      const idx = Math.min(n - 1, Math.floor(Math.pow(i / bins, 1.5) * n * 0.78));
      vals.push(viz.data[idx] / 255);
    }
  } else {
    for (let i = 0; i < bins; i++) vals.push(0.02 + 0.02 * Math.sin(Date.now() / 700 + i / 3));
  }

  const cx = w / 2, cy = h / 2;
  const r0 = w * 0.335;
  const maxLen = w * 0.155;
  const bass = vals.slice(0, 4).reduce(function (a, b) { return a + b; }, 0) / 4;

  g.save();
  g.strokeStyle = 'rgba(94,234,212,' + (0.12 + bass * 0.35).toFixed(3) + ')';
  g.lineWidth = w * 0.012;
  g.beginPath();
  g.arc(cx, cy, r0 * (0.94 + bass * 0.12), 0, Math.PI * 2);
  g.stroke();

  g.lineCap = 'round';
  for (let i = 0; i < bins; i++) {
    const a = (i / bins) * Math.PI * 2 - Math.PI / 2;
    const len = r0 * 0.05 + vals[i] * maxLen;
    const x1 = cx + Math.cos(a) * r0, y1 = cy + Math.sin(a) * r0;
    const x2 = cx + Math.cos(a) * (r0 + len), y2 = cy + Math.sin(a) * (r0 + len);
    g.strokeStyle = i % 3 === 0
      ? 'rgba(125,211,252,' + (0.35 + vals[i] * 0.6).toFixed(3) + ')'
      : 'rgba(94,234,212,' + (0.30 + vals[i] * 0.65).toFixed(3) + ')';
    g.lineWidth = w * 0.020;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
  }
  g.restore();

  const pl = document.getElementById('player');
  if (pl) pl.style.setProperty('--pulse', (0.18 + bass * 0.55).toFixed(3));
}

/* 播放器按钮（全局一次绑定） */
const PLAYER_POS_KEY = 'wb_halfpage_player_pos';
const COLLAPSE_KEY = 'wb_halfpage_player_collapsed';
let playerDragMoved = false;

function readPlayerPos() {
  try {
    const p = JSON.parse(localStorage.getItem(PLAYER_POS_KEY) || 'null');
    if (p && typeof p.x === 'number' && typeof p.y === 'number') return p;
  } catch (e) { /* 忽略 */ }
  return null;
}

function savePlayerPos(x, y) {
  try { localStorage.setItem(PLAYER_POS_KEY, JSON.stringify({ x: x, y: y })); } catch (e) { /* 忽略 */ }
}

function clampPlayerPos(x, y) {
  const p = document.getElementById('player');
  const w = p ? p.offsetWidth : 320;
  const h = p ? p.offsetHeight : 56;
  const maxX = Math.max(6, window.innerWidth - w - 6);
  const maxY = Math.max(6, window.innerHeight - h - 6);
  return [Math.max(6, Math.min(x, maxX)), Math.max(6, Math.min(y, maxY))];
}

function setPlayerPos(x, y) {
  const p = document.getElementById('player');
  if (!p) return;
  const xy = clampPlayerPos(x, y);
  p.classList.add('moved');
  p.style.left = xy[0] + 'px';
  p.style.top = xy[1] + 'px';
  p.style.bottom = 'auto';
  p.style.right = 'auto';
  p.style.transform = 'none';
  return xy;
}

function applyPlayerPos() {
  const p = document.getElementById('player');
  if (!p) return;
  const saved = readPlayerPos();
  if (saved) {
    setPlayerPos(saved.x, saved.y);
  } else {
    p.classList.remove('moved');
    p.style.left = '';
    p.style.top = '';
    p.style.bottom = '';
    p.style.right = '';
    p.style.transform = '';
  }
}

function applyPlayerChrome() {
  const p = document.getElementById('player');
  if (!p) return;
  const reading = document.body.classList.contains('reading');
  let saved = null;
  try { saved = localStorage.getItem(COLLAPSE_KEY); } catch (e) { saved = null; }
  const collapsed = saved === null ? reading : saved === '1';
  p.classList.toggle('collapsed', collapsed);
  applyPlayerPos();
}

function toggleCollapse() {
  const p = document.getElementById('player');
  if (!p) return;
  const next = !p.classList.contains('collapsed');
  p.classList.toggle('collapsed', next);
  try { localStorage.setItem(COLLAPSE_KEY, next ? '1' : '0'); } catch (e) { /* 忽略 */ }
  if (p.classList.contains('moved')) {
    const r = p.getBoundingClientRect();
    setPlayerPos(r.left, r.top);
  }
}

function bindPlayerOnce() {
  const toggle = document.getElementById('pToggle');
  if (toggle) toggle.addEventListener('click', togglePlay);
  const next = document.getElementById('pNext');
  if (next) next.addEventListener('click', function () { stepTrack(1); });
  const prev = document.getElementById('pPrev');
  if (prev) prev.addEventListener('click', function () { stepTrack(-1); });
  const fav = document.getElementById('pFav');
  if (fav) fav.addEventListener('click', function () {
    const cur = musicState.current;
    if (!cur || cur.kind !== 'preview') return;
    toggleFav(cur.title, cur.artist, cur.url, cur.viewUrl);
  });
  const close = document.getElementById('pClose');
  if (close) close.addEventListener('click', function () { stopMusic(); });
  bindPlayerDrag();
  bindSeek();
}

function bindPlayerDrag() {
  const p = document.getElementById('player');
  if (!p) return;
  let st = null;

  p.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    const r = p.getBoundingClientRect();
    st = {
      sx: e.clientX, sy: e.clientY, l: r.left, t: r.top, moved: false,
      onArt: !!e.target.closest('#pArt')
    };
    playerDragMoved = false;
    try { p.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  });

  p.addEventListener('pointermove', function (e) {
    if (!st) return;
    const dx = e.clientX - st.sx;
    const dy = e.clientY - st.sy;
    if (!st.moved) {
      if (Math.abs(dx) + Math.abs(dy) < 5) return;
      st.moved = true;
      p.classList.add('dragging');
    }
    playerDragMoved = true;
    setPlayerPos(st.l + dx, st.t + dy);
  });

  const end = function () {
    if (!st) return;
    const s0 = st;
    st = null;
    p.classList.remove('dragging');
    if (s0.moved) {
      const r = p.getBoundingClientRect();
      const xy = setPlayerPos(r.left, r.top);
      savePlayerPos(xy[0], xy[1]);
      setTimeout(function () { playerDragMoved = false; }, 80);
    } else if (s0.onArt) {
      toggleCollapse();
    }
  };
  p.addEventListener('pointerup', end);
  p.addEventListener('pointercancel', end);

  window.addEventListener('resize', function () {
    const saved = readPlayerPos();
    if (saved) {
      const xy = setPlayerPos(saved.x, saved.y);
      savePlayerPos(xy[0], xy[1]);
    }
  });
}

/* ---------- 云端音乐 ---------- *//* ---------- 云端音乐 ---------- */
function extOf(name, mime) {
  const m = /\.([a-z0-9]{2,5})$/i.exec(name || '');
  if (m) return '.' + m[1].toLowerCase();
  const t = mime || '';
  if (t.indexOf('wav') > -1) return '.wav';
  if (t.indexOf('mpeg') > -1 || t.indexOf('mp3') > -1) return '.mp3';
  if (t.indexOf('mp4') > -1 || t.indexOf('m4a') > -1) return '.m4a';
  if (t.indexOf('ogg') > -1) return '.ogg';
  if (t.indexOf('flac') > -1) return '.flac';
  return '.mp3';
}

function pvVal(v) {
  if (v && typeof v === 'object' && !Array.isArray(v)) {
    if (typeof v.text === 'string') return v.text;
    if (typeof v.number === 'number') return v.number;
    if (typeof v.date === 'string') return v.date;
    if (typeof v.select === 'string') return v.select;
  }
  return v;
}

function pvAtts(v) {
  if (Array.isArray(v)) return v;
  if (v && Array.isArray(v.attachment)) return v.attachment;
  return [];
}

const CLOUD_MUSIC_DB = 'fBXQYzusWcHdMK5PwybdgA';

function fmtSize(n) {
  if (!n) return '';
  return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
}

async function fetchCloudMusic() {
  const db = wpDB();
  if (!db) return null;
  const rows = [];
  let cursor;
  for (let i = 0; i < 10; i++) {
    const res = await db.query({
      databaseId: CLOUD_MUSIC_DB, pageSize: 100, startCursor: cursor,
      sorts: [{ property: '上传时间', direction: 'descending' }]
    });
    const batch = (res && res.results) || [];
    rows.push.apply(rows, batch);
    const next = res && res.nextCursor;
    if (!res || !res.hasMore || !next || next === cursor || !batch.length) break;
    cursor = next;
  }
  return rows.map(function (r) {
    const atts = pvAtts(r['文件']);
    const att = atts[0] || null;
    const nm = pvVal(r['歌名']);
    const sz = pvVal(r['大小']);
    let attId = att ? (att.attachmentId || att.id || '') : '';
    if (!attId && typeof r['文件'] === 'string') attId = r['文件'];
    return {
      id: r['_id'] || r['record_id'] || '',
      name: typeof nm === 'string' && nm ? nm : '未命名',
      size: typeof sz === 'number' ? sz : 0,
      attId: attId,
      attName: att ? (att.name || '') : '',
      at: pvVal(r['上传时间']) || '',
      hash: pvVal(r['指纹']) || ''
    };
  });
}

async function fetchCloudBlob(db, attId) {
  let url = attId;
  if (!/^https?:/i.test(attId)) {
    const r = await db.getDownloadUrl({ nodeId: CLOUD_MUSIC_DB, attachmentId: attId });
    url = r && r.downloadUrl;
  }
  if (!url) throw new Error('没有可用的下载地址');
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('http ' + resp.status);
  return resp.blob();
}

async function rebuildCloudHashes(btn) {
  const db = wpDB();

  const list = (musicState.cloud || []).slice();
  const todo = list.filter(function (c) { return !c.hash && c.attId; });
  if (!todo.length) { readerToast('都已带指纹，无需处理'); return; }
  let done = 0, fail = 0;
  for (let i = 0; i < todo.length; i++) {
    const c = todo[i];
    if (btn) btn.textContent = '整理中 ' + (i + 1) + '/' + todo.length;
    try {
      const blob = await fetchCloudBlob(db, c.attId);
      const hash = await fileHash(blob);
      await db.updateRecord({
        databaseId: CLOUD_MUSIC_DB, recordId: c.id,
        properties: { '指纹': { text: hash } }
      });
      c.hash = hash;
      done++;
    } catch (e) { fail++; }
  }
  await loadCloudMusic();
  if (btn) btn.textContent = '补全指纹';
  readerToast('已补全 ' + done + ' 首' + (fail ? '，' + fail + ' 首失败' : ''));
}

async function cloudUploadTracks(files) {
  const db = wpDB();
  if (!db) { window.alert('上传到云端需要登录：请在 WorkBuddy 内打开本页再试。'); return; }
  const count = document.getElementById('cloudMusicCount');
  const existing = {};
  const bySig = {};

  async function refreshIndex() {
    try {
      const list = await fetchCloudMusic();
      if (list) musicState.cloud = list;
    } catch (e) { /* 忽略，用内存里的 */ }
    (musicState.cloud || []).forEach(function (c) {
      if (c.hash) existing[c.hash] = c;
      bySig[sigOf(c.name, c.size)] = c;
    });
  }
  await refreshIndex();

  let ok = 0, fail = 0, dup = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (!isAudioFile(f)) { fail++; continue; }
    const hash = await fileHash(f);
    const name = f.name.replace(/\.[^.]+$/, '');
    const sig = sigOf(name, f.size);

    if (hash && existing[hash]) { dup++; continue; }
    const hit = bySig[sig];
    if (hit) {
      dup++;
      if (hash && !hit.hash && hit.id) {
        try {
          await db.updateRecord({ databaseId: CLOUD_MUSIC_DB, recordId: hit.id, properties: { '指纹': { text: hash } } });
          hit.hash = hash;
          existing[hash] = hit;
        } catch (e) { /* 忽略回写失败 */ }
      }
      continue;
    }

    batchUI('cloudBatch', '上传 ' + (i + 1) + '/' + files.length + ' · ' + f.name, i / files.length);
    try {
      const item = await db.uploadFile({ nodeId: CLOUD_MUSIC_DB, file: f });
      await db.addRecord({
        databaseId: CLOUD_MUSIC_DB,
        properties: {
          '歌名': { text: name },
          '文件': { attachment: [item] },
          '大小': { number: f.size },
          '上传时间': { date: new Date().toISOString() },
          '指纹': { text: hash || '' }
        }
      });
      if (hash) existing[hash] = 1;
      bySig[sig] = 1;
      ok++;
    } catch (e) { fail++; }
  }
  batchUI('cloudBatch', null);
  await loadCloudMusic();
  if (ok || dup || fail) {
    readerToast(batchSummary('上传', ok, dup, fail));
  }
  if (!ok && fail) {
    window.alert('上传失败。可能是未登录，或单个文件超过云端限制（建议单首 30MB 以内）。');
  } else if (fail) {
    window.alert('有 ' + fail + ' 个文件没传上去，其余已上传。');
  }
}

async function cloudDownloadTrack(id, btn) {
  const db = wpDB();
  if (!db) { window.alert('下载需要登录：请在 WorkBuddy 内打开本页。'); return; }
  const t = (musicState.cloud || []).filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  if (!t.attId) {
    window.alert('这条记录的附件读不到，可能是上传没完成。建议删掉后重新上传。');
    return;
  }
  if (!cloudAuthed()) {
    const go = window.confirm('云端文件需要登录 WorkBuddy 账号才能取到。\n继续会打开登录页，登录后回到本页再点一次下载。');
    if (!go) return;
  }

  const fileName = t.name + extOf(t.attName, '');
  const targetSig = sigOf(fileName, t.size);

  let local = [];
  try { local = await dbAllTracks(); } catch (e) { local = []; }
  const hit = local.filter(function (x) {
    return (t.hash && x.hash === t.hash) || sigOf(x.name, x.size) === targetSig;
  })[0];
  if (hit) {
    readerToast('本地曲库里已有《' + t.name + '》，没有重复下载');
    return;
  }

  if (btn) btn.style.opacity = '.35';
  try {
    let blob = musicState.cloudBlobs[t.id];
    if (!blob) {
      blob = await fetchCloudBlob(db, t.attId);
      musicState.cloudBlobs[t.id] = blob;
      markCloudOk();
    }
    await dbSaveTrack({
      id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: fileName, size: blob.size, blob: blob, addedAt: Date.now(),
      hash: t.hash || ''
    });
    renderLocalTracks();
    readerToast('已存入本地曲库');
  } catch (e) {
    const msg = String((e && (e.message || e)) || '');
    if (/40[13]|auth|login|未登录/i.test(msg)) {
      window.alert('下载需要登录：请在 WorkBuddy 内打开本页后再试。');
    } else {
      window.alert('下载失败：' + (msg || '网络异常') + '，请重试。');
    }
  } finally {
    if (btn) btn.style.opacity = '';
  }
}

function triggerDownload(blob, name) {
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name || 'audio';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 6000);
    readerToast('已保存到本机下载目录');
  } catch (e) {
    readerToast('保存失败，换浏览器再试');
  }
}

        databaseId: WRITE_DB_ID,
        pageSize: 200,
        startCursor: cursor,
        sorts: [{ property: '更新时间', direction: 'descending' }]
      });
      const batch = (res && res.results) || [];
      rows.push.apply(rows, batch);
      const next = res && res.nextCursor;
      if (!res || !res.hasMore || !next || next === cursor || !batch.length) break;
      cursor = next;
    }
    wpState.cloud = true;
    wpState.list = rows.map(wpFromRow);
  } catch (e) {
    wpState.cloud = false;
    wpState.list = wpLocalAll();
  }
}

function wpFmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const p = function (n) { return n < 10 ? '0' + n : '' + n; };
  if (sameDay) return '今天 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function renderWrite(recordId) {
  const cloud = !!wpDB();
  wpState.dirty = false;
  wpState.preview = false;

  app.innerHTML = '<div class="view">' +
    '<div class="shelf-head" style="padding-top:44px">' +
      '<div class="page-head" style="padding:0">' +
        '<div class="kicker">Writing</div>' +
        '<h1>写作台</h1>' +
        '<p>' + (cloud ? '笔记与文章存在云端，换设备打开会自动同步。公开链接为只读预览，编辑请在 WorkBuddy 内打开。' : '当前未连接云端，内容只保存在这台设备。') + '</p>' +
      '</div>' +
      '<div class="shelf-actions">' +
        '<button class="btn-upload" id="wpNew">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>' +
          '新建' +
        '</button>' +
      '</div>' +
    '</div>' +
    '<div class="write-wrap">' +
      '<aside class="wp-side">' +
        '<header><b>全部内容</b><span id="wpCount" style="font-size:11px;color:var(--dim)"></span></header>' +
        '<div class="wp-list" id="wpList"><div class="wp-empty">正在读取…</div></div>' +
      '</aside>' +
      '<section class="wp-main">' +
        '<div class="wp-bar">' +
          '<input class="wp-title" id="wpTitle" placeholder="无标题" autocomplete="off">' +
          '<div class="wp-seg" id="wpSeg">' +
            '<button data-type="笔记">笔记</button><button data-type="文章">文章</button>' +
          '</div>' +
          '<input class="wp-tag" id="wpTags" placeholder="标签，逗号分隔" autocomplete="off">' +
        '</div>' +
        '<div class="wp-body">' +
          '<textarea class="wp-editor" id="wpEditor" placeholder="在这里写。支持 Markdown：## 标题、**粗体**、> 引用、- 列表、`代码`…"></textarea>' +
          '<div class="wp-preview" id="wpPreview"><div class="prose" id="wpProse"></div></div>' +
        '</div>' +
        '<div class="wp-foot">' +
          '<span class="wp-sync" id="wpSync"><i></i><em style="font-style:normal">就绪</em></span>' +
          '<span id="wpStat">0 字</span>' +
          '<span class="sp"></span>' +
          '<button class="wp-btn" id="wpPreviewBtn">预览</button>' +
          '<button class="wp-btn danger" id="wpDel">删除</button>' +
          '<button class="wp-btn primary" id="wpSave">保存</button>' +
        '</div>' +
      '</section>' +
    '</div>' +
  '</div>';

  bindWriteEvents();
  wpLoadList().then(function () {
    wpUpdateCloudHint();
    wpRenderList();
    if (recordId) wpOpen(recordId);
    else if (wpState.list.length) wpOpen(wpState.list[0].id);
    else wpNew();
  });

  if (wpState.poll) clearInterval(wpState.poll);
  wpState.poll = setInterval(function () {
    if (document.hidden || location.hash.indexOf('#/write') !== 0 || wpState.saving) return;
    wpLoadList().then(function () {
      wpRenderList();
      wpSyncCurrent();
    });
  }, 15000);
}

function wpUpdateCloudHint() {
  const el = document.querySelector('.shelf-head p');
  if (!el) return;
  el.textContent = wpState.cloud
    ? '笔记与文章存在云端，换设备打开会自动同步。公开链接为只读预览，编辑请在 WorkBuddy 内打开。'
    : '云端暂时连不上（或未登录），内容先存在这台设备，联网后可再保存。';
}

function wpRenderList() {
  const box = document.getElementById('wpList');
  const count = document.getElementById('wpCount');
  if (!box) return;
  if (count) count.textContent = wpState.list.length ? wpState.list.length + ' 条' : '';
  if (!wpState.list.length) {
    box.innerHTML = '<div class="wp-empty">还没有内容。<br>点右上角「新建」开始写。</div>';
    return;
  }
  box.innerHTML = wpState.list.map(function (n) {
    return '<a class="wp-item' + (n.id === wpState.currentId ? ' on' : '') + '" data-id="' + escapeHtml(n.id) + '">' +
      '<b>' + escapeHtml(n.title || '未命名') + '</b>' +
      '<span><i>' + escapeHtml(n.type) + '</i>' + wpFmtTime(n.updated) + '</span>' +
    '</a>';
  }).join('');
}

function wpOpen(id) {
  const rec = wpState.list.filter(function (n) { return n.id === id; })[0];
  if (!rec) { wpNew(); return; }
  wpState.currentId = rec.id;
  wpState.type = rec.type || '笔记';
  wpState.updated = rec.updated || '';
  wpState.dirty = false;

  const title = document.getElementById('wpTitle');
  const editor = document.getElementById('wpEditor');
  const tags = document.getElementById('wpTags');
  if (title) title.value = rec.title || '';
  if (editor) editor.value = rec.content || '';
  if (tags) tags.value = rec.tags || '';

  wpApplyType();
  wpUpdateStat();
  wpSetStatus('ok', '已同步');
  wpRenderList();
  if (location.hash !== '#/write/' + rec.id) history.replaceState(null, '', '#/write/' + rec.id);
}

function wpNew() {
  wpState.currentId = '';
  wpState.type = '笔记';
  wpState.updated = '';
  wpState.dirty = true;
  const title = document.getElementById('wpTitle');
  const editor = document.getElementById('wpEditor');
  const tags = document.getElementById('wpTags');
  if (title) { title.value = ''; title.focus(); }
  if (editor) editor.value = '';
  if (tags) tags.value = '';
  wpApplyType();
  wpUpdateStat();
  wpSetStatus('ok', '新内容');
  wpRenderList();
  history.replaceState(null, '', '#/write');
}

function wpApplyType() {
  const seg = document.getElementById('wpSeg');
  if (!seg) return;
  const btns = seg.querySelectorAll('button');
  for (let i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('on', btns[i].getAttribute('data-type') === wpState.type);
  }
}

function wpUpdateStat() {
  const editor = document.getElementById('wpEditor');
  const stat = document.getElementById('wpStat');
  if (!editor || !stat) return;
  const n = editor.value.replace(/\s/g, '').length;
  stat.textContent = n + ' 字';
}

function wpSetStatus(kind, text) {
  const el = document.getElementById('wpSync');
  if (!el) return;
  el.className = 'wp-sync ' + (kind || '');
  const em = el.querySelector('em');
  if (em) em.textContent = text || '';
}

function wpTogglePreview() {
  wpState.preview = !wpState.preview;
  const editor = document.getElementById('wpEditor');
  const preview = document.getElementById('wpPreview');
  const prose = document.getElementById('wpProse');
  const btn = document.getElementById('wpPreviewBtn');
  if (!editor || !preview || !prose) return;
  if (wpState.preview) {
    prose.innerHTML = mdToHtml(editor.value || '');
    preview.classList.add('on');
    editor.style.display = 'none';
    if (btn) btn.textContent = '编辑';
  } else {
    preview.classList.remove('on');
    editor.style.display = 'block';
    if (btn) btn.textContent = '预览';
  }
}

async function wpSave(manual) {
  const title = document.getElementById('wpTitle');
  const editor = document.getElementById('wpEditor');
  const tags = document.getElementById('wpTags');
  if (!title || !editor) return;

  const name = title.value.trim() || '未命名';
  const content = editor.value;
  if (!content.trim() && !name.trim()) { wpSetStatus('off', '内容为空'); return; }
  if (wpState.saving) return;
  if (!wpState.dirty && !manual) return;

  wpState.saving = true;
  wpSetStatus('busy', '保存中…');
  const now = new Date().toISOString();
  const payload = {
    title: name, content: content, type: wpState.type,
    tags: tags ? tags.value.trim() : '', updated: now
  };

  try {
    const db = wpDB();
    if (db) {
      const props = {
        '标题': { text: payload.title },
        '内容': { text: payload.content },
        '类型': { select: payload.type },
        '标签': { text: payload.tags },
        '更新时间': { date: now }
      };
      if (wpState.currentId) {
        await db.updateRecord({ databaseId: WRITE_DB_ID, recordId: wpState.currentId, properties: props });
      } else {
        props['创建时间'] = { date: now };
        const res = await db.addRecord({ databaseId: WRITE_DB_ID, properties: props });
        const newId = res && (res.id || res._id || (res.result && res.result.id));
        if (newId) {
          wpState.currentId = newId;
          history.replaceState(null, '', '#/write/' + newId);
        }
      }
    } else {
      const list = wpLocalAll();
      const idx = list.findIndex(function (n) { return n.id === wpState.currentId; });
      const rec = {
        id: wpState.currentId || ('n' + Date.now().toString(36)),
        title: payload.title, content: payload.content,
        type: payload.type, tags: payload.tags,
        updated: now, created: now
      };
      if (idx > -1) rec.created = list[idx].created || now;
      if (idx > -1) list[idx] = rec; else list.unshift(rec);
      wpLocalSave(list);
      wpState.currentId = rec.id;
      history.replaceState(null, '', '#/write/' + rec.id);
    }

    wpState.dirty = false;
    cloudCache = null;
    cloudCacheAt = 0;
    wpSetStatus('ok', db ? '已保存 · 云端' : '已保存 · 本机');
    await wpLoadList();
    wpRenderList();
    const cur = wpState.list.filter(function (n) { return n.id === wpState.currentId; })[0];
    if (cur) wpState.updated = cur.updated;
  } catch (e) {
    const msg = String(e && (e.message || e.code) || '');
    wpSetStatus('off', /40[13]|login|auth/i.test(msg) ? '需要登录才能保存' : '保存失败，请重试');
  } finally {
    wpState.saving = false;
  }
}

function wpScheduleSave() {
  wpState.dirty = true;
  wpSetStatus('busy', '未保存');
  if (wpState.timer) clearTimeout(wpState.timer);
  wpState.timer = setTimeout(function () { wpSave(false); }, 2200);
}

function wpSyncCurrent() {
  const cur = wpState.list.filter(function (n) { return n.id === wpState.currentId; })[0];
  if (!cur || wpState.dirty || wpState.saving) return;
  if (cur.updated && cur.updated !== wpState.updated) {
    const editor = document.getElementById('wpEditor');
    const title = document.getElementById('wpTitle');
    const tags = document.getElementById('wpTags');
    const keep = editor ? editor.scrollTop : 0;
    if (title) title.value = cur.title || '';
    if (editor) { editor.value = cur.content || ''; editor.scrollTop = keep; }
    if (tags) tags.value = cur.tags || '';
    wpState.type = cur.type || '笔记';
    wpState.updated = cur.updated;
    wpApplyType();
    wpUpdateStat();
    wpSetStatus('ok', '已同步另一端修改');
  }
}

function bindWriteEvents() {
  const list = document.getElementById('wpList');
  if (list) list.addEventListener('click', function (e) {
    const item = e.target.closest('[data-id]');
    if (!item) return;
    if (wpState.dirty) wpSave(false).then(function () { wpOpen(item.getAttribute('data-id')); });
    else wpOpen(item.getAttribute('data-id'));
  });

  const newBtn = document.getElementById('wpNew');
  if (newBtn) newBtn.addEventListener('click', function () {
    if (wpState.dirty) wpSave(false).then(wpNew); else wpNew();
  });

  const seg = document.getElementById('wpSeg');
  if (seg) seg.addEventListener('click', function (e) {
    const b = e.target.closest('[data-type]');
    if (!b) return;
    wpState.type = b.getAttribute('data-type');
    wpApplyType();
    wpScheduleSave();
  });

  ['wpTitle', 'wpEditor', 'wpTags'].forEach(function (id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', function () {
      wpUpdateStat();
      if (wpState.preview && id === 'wpEditor') {
        const prose = document.getElementById('wpProse');
        if (prose) prose.innerHTML = mdToHtml(el.value);
      }
      wpScheduleSave();
    });
  });

  const saveBtn = document.getElementById('wpSave');
  if (saveBtn) saveBtn.addEventListener('click', function () { wpSave(true); });

  const prevBtn = document.getElementById('wpPreviewBtn');
  if (prevBtn) prevBtn.addEventListener('click', wpTogglePreview);

  const delBtn = document.getElementById('wpDel');
  if (delBtn) delBtn.addEventListener('click', async function () {
    if (!wpState.currentId) { wpNew(); return; }
    if (!window.confirm('删除这条内容？删除后其他设备也会消失。')) return;
    try {
      const db = wpDB();
      if (db) await db.deleteRecord({ databaseId: WRITE_DB_ID, recordId: wpState.currentId });
      else wpLocalSave(wpLocalAll().filter(function (n) { return n.id !== wpState.currentId; }));
      wpState.currentId = '';
      cloudCache = null;
      cloudCacheAt = 0;
      await wpLoadList();
      wpRenderList();
      if (wpState.list.length) wpOpen(wpState.list[0].id); else wpNew();
    } catch (e) { wpSetStatus('off', '删除失败'); }
  });

  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('wpEditor')) return;
    if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      wpSave(true);
    }
  });
}

/* ---------------- 9. 路由（统一调度，渲染函数互不调用） ---------------- */function setActiveNav(name) {
  const links = document.querySelectorAll('[data-nav]');
  for (let i = 0; i < links.length; i++) {
    links[i].classList.toggle('on', links[i].getAttribute('data-nav') === name);
  }
}

function route() {
  if (document.body.classList.contains('reading')) saveReaderPos();
  if (wpState.poll && location.hash.indexOf('#/write') !== 0) {
    clearInterval(wpState.poll);
    wpState.poll = null;
  }
  document.body.classList.remove('reading');
  const hash = location.hash.replace(/^#\/?/, '');
  const seg = hash.split('/').filter(Boolean);
  const view = seg[0] || 'home';
  state.filterTag = 'all';

  if (view === 'post' && seg[1]) {
    renderPost(decodeURIComponent(seg[1].split('?')[0]));
    setActiveNav('');
  } else if (view === 'tag' && seg[1]) {
    renderTagView(decodeURIComponent(seg[1]));
    setActiveNav('tags');
  } else if (view === 'tags') {
    renderTags();
    setActiveNav('tags');
  } else if (view === 'archive') {
    renderArchive();
    setActiveNav('archive');
  } else if (view === 'shelf') {
    renderShelf();
    setActiveNav('shelf');
  } else if (view === 'write') {
    renderWrite(seg[1] || '');
    setActiveNav('');
  } else if (view === 'music') {
    renderMusic();
    setActiveNav('');
  } else if (view === 'note' && seg[1]) {
    renderNote(decodeURIComponent(seg[1]));
    setActiveNav('home');
  } else if (view === 'read' && seg[1]) {
    renderReader(decodeURIComponent(seg[1]));
    setActiveNav('shelf');
  } else if (view === 'about') {
    renderAbout();
    setActiveNav('about');
  } else {
    renderHome();
    setActiveNav('home');
  }

  window.scrollTo({ top: 0, behavior: 'auto' });
  updateProgress();
  window.requestAnimationFrame(updateTocActive);
  applyPlayerChrome();
}

/* ---------------- 10. 阅读进度 ---------------- */
function updateProgress() {
  const bar = document.getElementById('progress');
  const prose = document.getElementById('prose');
  if (!bar) return;
  if (!prose) { bar.style.width = '0%'; return; }
  const rect = prose.getBoundingClientRect();
  const total = prose.offsetHeight - window.innerHeight * 0.6;
  const passed = Math.min(Math.max(-rect.top + 120, 0), Math.max(total, 1));
  bar.style.width = Math.min(passed / Math.max(total, 1) * 100, 100) + '%';
}

/* 滚动统一调度：进度条 + 目录高亮 + 位置记录（互不调用） */
let posTimer = null;
function onScroll() {
  updateProgress();
  updateTocActive();
  if (posTimer) clearTimeout(posTimer);
  posTimer = setTimeout(saveCurrentPos, 600);
}

/* ---------------- 11. 搜索 ---------------- */
function bindSearch() {
  const layer = document.getElementById('searchLayer');
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');

  function open() {
    layer.classList.add('open');
    setTimeout(function () { input.focus(); }, 60);
    render('');
  }
  function close() {
    layer.classList.remove('open');
    input.value = '';
  }
  function render(q) {
    const key = q.trim().toLowerCase();
    if (!key) {
      results.innerHTML = '<div class="search-hint">试试搜「书店」「读书」「注意力」，或直接点标签。</div>';
      return;
    }
    const hits = POSTS.filter(function (p) {
      return (p.title + p.excerpt + p.content + p.tags.join(' ')).toLowerCase().indexOf(key) > -1;
    });
    if (!hits.length) {
      results.innerHTML = '<div class="sr-empty">没有找到相关文章，换个词试试。</div>';
      return;
    }
    results.innerHTML = hits.map(function (p) {
      return '<a class="sr-item" href="#/post/' + p.slug + '">' +
        '<h4>' + escapeHtml(p.title) + '</h4>' +
        '<p>' + escapeHtml(p.excerpt) + '</p>' +
      '</a>';
    }).join('');
  }

  document.getElementById('searchBtn').addEventListener('click', open);
  layer.addEventListener('click', function (e) {
    if (e.target === layer) close();
  });
  input.addEventListener('input', function () { render(this.value); });
  results.addEventListener('click', function (e) {
    if (e.target.closest('.sr-item')) close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && layer.classList.contains('open')) close();
    if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) {
      e.preventDefault(); open();
    }
    if (e.key === '/' && !layer.classList.contains('open') && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault(); open();
    }
  });
}

/* ---------------- 12. 初始化 ---------------- */
function init() {
  bindSearch();
  bindPlayerOnce();
  const writeBtn = document.getElementById('writeBtn');
  if (writeBtn) writeBtn.addEventListener('click', function () { location.hash = '#/write'; });
  const musicBtn = document.getElementById('musicBtn');
  if (musicBtn) musicBtn.addEventListener('click', function () { location.hash = '#/music'; });
  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', function () {
    updateProgress();
    applyReading();
    if (reader.mode === 'page' && document.getElementById('bkStage')) {
      reader.pageCache = {};
      relayoutBook();
    }
  });
  document.addEventListener('keydown', onReaderKey);
  window.addEventListener('beforeunload', saveReaderPos);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || location.hash.indexOf('#/write') !== 0 || wpState.saving) return;
    wpLoadList().then(function () { wpRenderList(); wpSyncCurrent(); });
  });
  if (!location.hash) history.replaceState(null, '', '#/');
  route();
}

init();
