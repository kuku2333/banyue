<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="半页 · 林深的生活随笔与读书笔记，关于城市、阅读与慢下来的日常。">
<meta name="theme-color" content="#0a0e13">
<title>半页 · 生活随笔与读书笔记</title>
<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建、存储和部署 -->
<style>
:root{
  --bg:#0a0e13;
  --bg-soft:#0e141b;
  --card:#111922;
  --card-2:#151f2a;
  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.14);
  --text:#e9eff6;
  --text-2:#b9c6d4;
  --muted:#8b9aab;
  --dim:#65748a;
  --accent:#5eead4;
  --accent-2:#7dd3fc;
  --accent-soft:rgba(94,234,212,.10);
  --accent-line:rgba(94,234,212,.32);
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --radius:16px;
  --shadow:0 18px 44px rgba(0,0,0,.34);
  --max:1180px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(760px 460px at 12% -8%, rgba(94,234,212,.10), transparent 62%),
    radial-gradient(700px 460px at 92% 4%, rgba(125,211,252,.09), transparent 60%),
    radial-gradient(900px 700px at 50% 112%, rgba(129,140,248,.07), transparent 65%);
  pointer-events:none;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);
  -webkit-mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);
  pointer-events:none;
}

a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:rgba(94,234,212,.24);color:#fff}

/* ---------- 阅读进度 ---------- */
#progress{
  position:fixed;top:0;left:0;height:2px;width:0;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  z-index:90;transition:width .1s linear;box-shadow:0 0 12px rgba(94,234,212,.5);
}

/* ---------- 顶栏 ---------- */
header.site{
  position:sticky;top:0;z-index:60;
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  background:rgba(10,14,19,.72);
  border-bottom:1px solid var(--line);
}
.nav{
  max-width:var(--max);margin:0 auto;padding:0 24px;height:66px;
  display:flex;align-items:center;gap:28px;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mark{
  width:32px;height:32px;border-radius:9px;
  border:1px solid var(--accent-line);
  background:linear-gradient(145deg,rgba(94,234,212,.20),rgba(125,211,252,.06));
  display:grid;place-items:center;
  font-family:var(--serif);font-size:16px;color:var(--accent);
}
.brand b{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.06em}
.brand span{font-size:11px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;margin-left:2px}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-links a{
  padding:8px 14px;border-radius:9px;font-size:14px;color:var(--text-2);
  transition:.2s;position:relative;
}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav-links a.on{color:var(--accent);background:var(--accent-soft)}
.search-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--text-2);transition:.2s;flex-shrink:0;
}
.search-btn:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.search-btn svg{width:17px;height:17px}

/* 搜索层 */
.search-layer{
  position:fixed;inset:0;z-index:300;background:rgba(6,9,13,.78);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;padding:12vh 20px 20px;
}
.search-layer.open{display:block}
.search-box{max-width:640px;margin:0 auto}
.search-field{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line-strong);
  border-radius:14px;padding:0 18px;box-shadow:var(--shadow);
}
.search-field svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.search-field input{
  flex:1;height:56px;border:none;outline:none;background:none;
  color:var(--text);font-size:16px;font-family:var(--sans);
}
.search-field input::placeholder{color:var(--dim)}
.search-hint{font-size:12px;color:var(--dim);padding:10px 4px 0;letter-spacing:.02em}
.search-results{margin-top:14px;max-height:58vh;overflow:auto}
.sr-item{
  display:block;padding:14px 18px;border-radius:12px;border:1px solid transparent;
  transition:.18s;cursor:pointer;
}
.sr-item:hover{background:var(--card);border-color:var(--line)}
.sr-item h4{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--text)}
.sr-item p{margin:0;font-size:13px;color:var(--muted);line-height:1.6;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sr-empty{padding:28px 10px;text-align:center;color:var(--dim);font-size:14px}

/* ---------- 通用容器 ---------- */
main{max-width:var(--max);margin:0 auto;padding:0 24px 90px;min-height:70vh}
.view{animation:fade .42s cubic-bezier(.22,.61,.36,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- 首页 Hero ---------- */
.hero{padding:74px 0 54px;position:relative}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
  border:1px solid var(--accent-line);background:var(--accent-soft);
  padding:6px 13px;border-radius:999px;margin-bottom:26px;
}
.hero .eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.hero h1{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(34px,5.4vw,58px);line-height:1.24;
  letter-spacing:-.01em;margin:0 0 22px;max-width:15em;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(100deg,var(--accent) 8%,var(--accent-2) 88%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p.lede{
  font-size:16.5px;line-height:1.85;color:var(--muted);max-width:37em;margin:0 0 34px;
}
.stats{display:flex;gap:36px;flex-wrap:wrap;padding-top:4px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--text);line-height:1.2}
.stats span{font-size:11.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

/* Hero 装饰：轨道图 */
.hero{overflow:visible}
.hero-art{
  position:absolute;right:-14px;top:14px;width:372px;height:372px;
  pointer-events:none;opacity:.9;
}
.hero-art svg{width:100%;height:100%;overflow:visible}
.orbit-a{transform-origin:160px 160px;animation:spin 46s linear infinite}
.orbit-b{transform-origin:160px 160px;animation:spin 30s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:1180px){.hero-art{display:none}}

/* ---------- 区块标题 ---------- */
.sec-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;margin:0 0 22px;padding-bottom:12px;border-bottom:1px solid var(--line);
}
.sec-head h2{
  font-family:var(--serif);font-size:20px;font-weight:600;margin:0;letter-spacing:.02em;
  display:flex;align-items:center;gap:10px;
}
.sec-head h2::before{content:"";width:3px;height:16px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent-2))}
.sec-head span{font-size:12px;color:var(--dim);letter-spacing:.04em}

/* ---------- 首页布局 ---------- */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:48px;align-items:start}

/* 精选卡 */
.featured{
  position:relative;display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:26px;align-items:center;
  border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(135deg,rgba(94,234,212,.10),rgba(125,211,252,.03) 55%,transparent);
  padding:30px 32px;margin-bottom:40px;transition:.28s;isolation:isolate;
}
.featured .f-cover{
  border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.10);
  aspect-ratio:16/10;background:#0b1118;
}
.featured .f-cover svg{width:100%;height:100%;display:block}
.featured::after{
  content:"";position:absolute;right:-70px;top:-70px;width:250px;height:250px;border-radius:50%;
  background:radial-gradient(circle,rgba(94,234,212,.20),transparent 68%);filter:blur(8px);z-index:-1;
}
.featured:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:var(--shadow)}
.featured .tagline{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.featured h3{margin:0 0 12px;font-family:var(--serif);font-size:clamp(23px,3vw,31px);font-weight:600;line-height:1.4;letter-spacing:.01em}
.featured p{margin:0 0 20px;color:var(--muted);font-size:14.5px;line-height:1.8;max-width:44em}
.featured .arrow{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--accent)}
.featured .arrow svg{width:14px;height:14px;transition:transform .25s}
.featured:hover .arrow svg{transform:translateX(4px)}

/* 筛选条 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{
  padding:7px 14px;border-radius:999px;font-size:12.5px;
  border:1px solid var(--line);color:var(--text-2);background:rgba(255,255,255,.018);
  transition:.2s;white-space:nowrap;
}
.chip:hover{border-color:var(--line-strong);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip small{opacity:.55;margin-left:4px;font-size:11px}

/* 文章列表 */
.post-list{display:flex;flex-direction:column}
.post-item{
  display:grid;grid-template-columns:104px minmax(0,1fr);gap:18px;align-items:start;
  padding:22px 4px 22px 0;border-bottom:1px solid var(--line);
  transition:.22s;position:relative;
}
.pi-cover{
  display:block;border-radius:10px;overflow:hidden;aspect-ratio:4/3;
  border:1px solid var(--line);background:#0b1118;
}
.pi-cover svg{width:100%;height:100%;display:block}
.pi-cover text{display:none}
.pi-body{min-width:0}
.post-item::before{
  content:"";position:absolute;left:-18px;top:28px;bottom:28px;width:2px;border-radius:2px;
  background:linear-gradient(var(--accent),var(--accent-2));opacity:0;transition:.22s;
}
.post-item:hover::before{opacity:1}
.post-item:hover{transform:translateX(5px)}
.post-meta{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12px;color:var(--dim);margin-bottom:9px;letter-spacing:.02em;
}
.post-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--dim);opacity:.6}
.post-item h3{
  margin:0 0 9px;font-family:var(--serif);font-size:21px;font-weight:600;
  line-height:1.5;letter-spacing:.01em;transition:color .2s;
}
.post-item:hover h3{color:var(--accent)}
.post-item p{
  margin:0 0 13px;color:var(--muted);font-size:14px;line-height:1.78;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.mini-tags{display:flex;gap:7px;flex-wrap:wrap}
.mini-tags a{
  font-size:11.5px;color:var(--dim);border:1px solid var(--line);
  padding:2px 9px;border-radius:5px;transition:.18s;
}
.mini-tags a:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

/* 侧栏 */
.sidebar{position:sticky;top:90px;display:flex;flex-direction:column;gap:26px}
.side-card{border:1px solid var(--line);border-radius:14px;background:rgba(17,25,34,.55);padding:20px}
.side-card h4{
  margin:0 0 14px;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);font-weight:500;display:flex;align-items:center;gap:8px;
}
.side-card h4::after{content:"";flex:1;height:1px;background:var(--line)}
.about-mini{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.avatar{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(145deg,rgba(94,234,212,.22),rgba(125,211,252,.10));
  border:1px solid var(--accent-line);display:grid;place-items:center;
  font-family:var(--serif);font-size:18px;color:var(--accent);
}
.about-mini b{display:block;font-size:14px;font-weight:600}
.about-mini span{font-size:11.5px;color:var(--dim)}
.side-card p{margin:0;font-size:13px;line-height:1.8;color:var(--muted)}
.tag-cloud{display:flex;flex-wrap:wrap;gap:7px}
.tag-cloud a{
  font-size:12px;padding:4px 10px;border-radius:7px;color:var(--text-2);
  background:rgba(255,255,255,.025);border:1px solid transparent;transition:.18s;
}
.tag-cloud a:hover{color:var(--accent);background:var(--accent-soft)}
.tag-cloud a b{font-weight:500;color:var(--dim);margin-left:3px;font-size:11px}
.recent{display:flex;flex-direction:column;gap:13px}
.recent a{display:block;font-size:13px;line-height:1.6;color:var(--text-2);transition:.18s}
.recent a:hover{color:var(--accent)}
.recent a span{display:block;font-size:11px;color:var(--dim);margin-top:3px}

/* ---------- 文章详情 ---------- */
.post-wrap{display:grid;grid-template-columns:minmax(0,1fr) 216px;gap:60px;padding-top:44px;align-items:start}
.post-main{max-width:760px;min-width:0}
.back{
  display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);
  margin-bottom:26px;transition:.2s;
}
.back:hover{color:var(--accent);gap:10px}
.back svg{width:14px;height:14px}
.post-head{padding-bottom:28px;margin-bottom:34px;border-bottom:1px solid var(--line)}
.post-head h1{
  font-family:var(--serif);font-weight:600;font-size:clamp(27px,4.2vw,40px);
  line-height:1.36;margin:0 0 18px;letter-spacing:.01em;
}
.post-head .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin-bottom:16px}
.post-head .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--dim)}
.post-head .tags{display:flex;gap:8px;flex-wrap:wrap}
.post-head .tags a{
  font-size:12px;color:var(--accent);background:var(--accent-soft);
  border:1px solid var(--accent-line);padding:3px 11px;border-radius:999px;transition:.18s;
}
.post-head .tags a:hover{background:rgba(94,234,212,.18)}

/* Markdown 正文 */
.prose{font-size:16.5px;line-height:1.95;color:var(--text-2)}
.prose>*:first-child{margin-top:0}
.prose h2{
  font-family:var(--serif);font-size:25px;font-weight:600;color:var(--text);
  margin:52px 0 20px;line-height:1.45;padding-left:16px;position:relative;scroll-margin-top:90px;
}
.prose h2::before{
  content:"";position:absolute;left:0;top:.42em;width:3px;height:.92em;border-radius:2px;
  background:linear-gradient(var(--accent),var(--accent-2));
}
.prose h3{
  font-family:var(--serif);font-size:19.5px;font-weight:600;color:var(--text);
  margin:36px 0 14px;line-height:1.5;scroll-margin-top:90px;
}
.prose p{margin:0 0 22px}
.prose strong{color:var(--text);font-weight:600}
.prose em{font-style:italic;color:var(--text)}
.prose a{color:var(--accent);border-bottom:1px solid var(--accent-line)}
.prose a:hover{border-bottom-color:var(--accent)}
.prose blockquote{
  margin:28px 0;padding:18px 24px;border-left:2px solid var(--accent);
  background:linear-gradient(90deg,rgba(94,234,212,.07),transparent 92%);
  border-radius:0 10px 10px 0;color:var(--text-2);
}
.prose blockquote p:last-child{margin-bottom:0}
.prose blockquote p{font-family:var(--serif);font-size:16.5px;line-height:1.9}
.prose ul,.prose ol{margin:0 0 22px;padding-left:24px}
.prose li{margin-bottom:9px}
.prose li::marker{color:var(--accent)}
.prose hr{border:none;height:1px;background:var(--line);margin:44px 0}
.prose code{
  font-family:var(--mono);font-size:.87em;background:rgba(94,234,212,.10);
  color:var(--accent);padding:2px 6px;border-radius:5px;border:1px solid rgba(94,234,212,.14);
}
.prose pre{
  position:relative;margin:26px 0;padding:20px 22px;border-radius:12px;
  background:#080c11;border:1px solid var(--line);overflow-x:auto;
}
.prose pre code{
  background:none;border:none;padding:0;color:#c8d6e5;font-size:13.5px;line-height:1.85;
}
.prose pre .lang{
  position:absolute;top:10px;right:14px;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);
}
.prose table{width:100%;border-collapse:collapse;margin:26px 0;font-size:14.5px;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--line);padding:10px 14px;text-align:left;white-space:nowrap}
.prose th{background:rgba(255,255,255,.03);color:var(--text);font-weight:600}
.prose img{max-width:100%;border-radius:10px;border:1px solid var(--line)}

/* 文末 */
.post-end{margin-top:56px;padding-top:26px;border-top:1px solid var(--line)}
.post-end .end-note{
  font-family:var(--serif);font-size:14px;color:var(--dim);text-align:center;
  letter-spacing:.1em;margin-bottom:30px;
}
.end-note b{color:var(--accent);font-weight:400}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pager a,.pager .ph{
  border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:.22s;min-height:76px;
}
.pager a:hover{border-color:var(--accent-line);background:rgba(94,234,212,.04)}
.pager span{display:block;font-size:11px;color:var(--dim);letter-spacing:.14em;margin-bottom:5px;text-transform:uppercase}
.pager b{font-family:var(--serif);font-size:14.5px;font-weight:500;line-height:1.5;color:var(--text-2)}
.pager .next{text-align:right}

/* 目录 */
.toc{position:sticky;top:94px;font-size:12.5px}
.toc h5{
  margin:0 0 13px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);font-weight:500;
}
.toc a{
  display:block;padding:5px 0 5px 12px;color:var(--muted);line-height:1.6;
  border-left:1px solid var(--line);transition:.18s;
}
.toc a:hover{color:var(--accent);border-left-color:var(--accent)}
.toc a.lv3{padding-left:24px;font-size:12px;color:var(--dim)}

/* ---------- 标签页 ---------- */
.page-head{padding:58px 0 34px;max-width:46em}
.page-head .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.page-head h1{font-family:var(--serif);font-size:clamp(28px,4.4vw,42px);font-weight:600;margin:0 0 14px;line-height:1.35}
.page-head p{margin:0;color:var(--muted);font-size:15px;line-height:1.85}
.tag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:52px}
.tag-card{
  display:block;border:1px solid var(--line);border-radius:13px;padding:20px 20px 18px;
  background:rgba(17,25,34,.5);transition:.24s;position:relative;overflow:hidden;
}
.tag-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(var(--accent),var(--accent-2));opacity:0;transition:.24s;
}
.tag-card:hover{border-color:var(--accent-line);background:rgba(21,31,42,.85);transform:translateY(-2px)}
.tag-card:hover::before{opacity:1}
.tag-card .hash{font-family:var(--serif);font-size:19px;color:var(--accent);margin-right:4px}
.tag-card b{font-size:15.5px;font-weight:600}
.tag-card .cnt{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.tag-card .cnt small{font-size:11.5px;color:var(--dim)}
.tag-card .cnt em{font-style:normal;font-family:var(--serif);font-size:20px;color:var(--text-2)}

/* ---------- 关于页 ---------- */
.about-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:56px;align-items:start;padding-top:52px}
.about-body h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:44px 0 18px;display:flex;align-items:center;gap:10px}
.about-body h2:first-child{margin-top:0}
.about-body h2::before{content:"";width:3px;height:15px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent-2))}
.about-body p{color:var(--text-2);font-size:15.5px;line-height:1.95;margin:0 0 18px}
.about-body .lead{font-size:17px;color:var(--text);font-family:var(--serif);line-height:1.95}
.about-body strong{color:var(--text)}
.timeline{display:flex;flex-direction:column;gap:0;margin:8px 0 0}
.tl-item{display:grid;grid-template-columns:74px 1fr;gap:18px;padding-bottom:24px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:"";position:absolute;left:83px;top:7px;bottom:-3px;width:1px;background:var(--line);
}
.tl-item:last-child::before{display:none}
.tl-item .yr{font-family:var(--serif);font-size:14px;color:var(--accent);letter-spacing:.02em}
.tl-item .ct{position:relative;padding-left:16px}
.tl-item .ct::before{
  content:"";position:absolute;left:-2px;top:8px;width:7px;height:7px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--accent-line);
}
.tl-item .ct b{display:block;font-size:14.5px;font-weight:600;margin-bottom:3px;color:var(--text)}
.tl-item .ct span{font-size:13px;color:var(--muted);line-height:1.7}
.book-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.book-row{
  display:flex;align-items:baseline;gap:14px;padding:13px 2px;
  border-bottom:1px solid var(--line);font-size:14px;transition:.2s;
}
.book-row:hover{background:rgba(255,255,255,.018)}
.book-row b{font-family:var(--serif);font-weight:600;color:var(--text);flex-shrink:0}
.book-row span{color:var(--dim);font-size:12.5px}
.book-row em{margin-left:auto;font-style:normal;font-size:12px;color:var(--accent);flex-shrink:0}
.contact-list{display:flex;flex-direction:column;gap:10px}
.contact-list a{
  display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;
  border:1px solid var(--line);font-size:13.5px;color:var(--text-2);transition:.2s;
}
.contact-list a:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.contact-list svg{width:16px;height:16px;flex-shrink:0;color:var(--accent)}
.quote-card{
  border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 12px 12px 0;
  padding:18px 20px;background:rgba(17,25,34,.55);
}
.quote-card p{font-family:var(--serif);font-size:14.5px;line-height:1.9;color:var(--text-2);margin:0}
.quote-card small{display:block;margin-top:10px;font-size:11.5px;color:var(--dim);letter-spacing:.08em}

/* ---------- 阅读工具条 ---------- */
.reader-tools{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 0 0;margin-bottom:10px;
}
.rt-group{
  display:flex;align-items:center;gap:2px;border:1px solid var(--line);
  border-radius:9px;padding:2px;background:rgba(255,255,255,.02);
}
.rt-group button{
  min-width:34px;height:30px;border-radius:7px;font-size:12.5px;color:var(--muted);
  transition:.18s;font-family:var(--sans);
}
.rt-group button:hover{color:var(--accent);background:rgba(94,234,212,.08)}
.rt-group button:disabled{opacity:.3;cursor:not-allowed;background:none;color:var(--muted)}
.rt-group span{
  font-size:11px;color:var(--dim);padding:0 7px;border-left:1px solid var(--line);
  margin-left:2px;min-width:44px;text-align:center;
}
.rt-label{font-size:11px;color:var(--dim);letter-spacing:.1em;margin-right:2px}
.rt-spacer{flex:1}

/* 继续阅读提示 */
.resume-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--accent-line);border-radius:11px;
  background:linear-gradient(90deg,rgba(94,234,212,.09),rgba(94,234,212,.02));
  padding:11px 15px;margin-bottom:26px;font-size:13px;color:var(--text-2);
  animation:fade .4s ease both;
}
.resume-bar b{color:var(--accent);font-weight:600}
.resume-bar button{
  margin-left:auto;font-size:12.5px;color:var(--accent);border:1px solid var(--accent-line);
  padding:5px 13px;border-radius:7px;transition:.18s;
}
.resume-bar button:hover{background:rgba(94,234,212,.14)}
.resume-bar .rb-close{color:var(--dim);border-color:transparent;padding:5px 7px;margin-left:0}
.resume-bar .rb-close:hover{color:var(--text);background:rgba(255,255,255,.05)}

/* 代码块复制 */
.copy-btn{
  position:absolute;top:8px;right:8px;font-size:11px;letter-spacing:.06em;
  color:var(--muted);border:1px solid var(--line);border-radius:6px;
  padding:3px 9px;background:rgba(12,17,23,.9);transition:.18s;opacity:0;
}
.prose pre:hover .copy-btn{opacity:1}
.copy-btn:hover{color:var(--accent);border-color:var(--accent-line)}
.copy-btn.done{color:var(--accent);border-color:var(--accent-line);opacity:1}
@media (hover:none){.copy-btn{opacity:.75}}

/* 目录高亮 */
.toc a.active{
  color:var(--accent);border-left-color:var(--accent);
  background:linear-gradient(90deg,rgba(94,234,212,.09),transparent 90%);
}
.toc a.lv3.active{color:var(--accent)}

/* 相关阅读 */
.related{margin:34px 0 30px}
.related h4{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  font-weight:500;margin:0 0 14px;display:flex;align-items:center;gap:8px;
}
.related h4::after{content:"";flex:1;height:1px;background:var(--line)}
.related-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rel-card{
  display:block;border:1px solid var(--line);border-radius:11px;padding:14px 16px;
  transition:.2s;background:rgba(255,255,255,.016);min-height:46px;
}
.rel-card:hover{border-color:var(--accent-line);background:rgba(94,234,212,.04)}
.rel-card b{
  display:block;font-family:var(--serif);font-size:14.5px;font-weight:500;
  line-height:1.55;color:var(--text-2);margin-bottom:5px;
}
.rel-card:hover b{color:var(--accent)}
.rel-card span{font-size:11.5px;color:var(--dim);letter-spacing:.03em}

/* ---------- 归档页 ---------- */
.archive{padding-bottom:20px}
.ar-year{
  display:flex;align-items:baseline;gap:14px;padding:34px 0 18px;
  border-bottom:1px solid var(--line-strong);
}
.ar-year h2{
  font-family:var(--serif);font-size:34px;font-weight:600;margin:0;letter-spacing:.02em;
  background:linear-gradient(120deg,var(--text),var(--accent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.ar-year span{font-size:12px;color:var(--dim);letter-spacing:.1em}
.ar-month{
  display:grid;grid-template-columns:82px minmax(0,1fr);gap:24px;
  padding:22px 0 4px;border-bottom:1px solid var(--line);
}
.ar-month:last-child{border-bottom:none}
.ar-mlabel{
  font-family:var(--serif);font-size:14px;color:var(--dim);letter-spacing:.04em;
  padding-top:3px;
}
.ar-mlabel b{display:inline;font-size:21px;color:var(--text-2);font-weight:600;line-height:1.2;letter-spacing:.02em}
.ar-list{display:flex;flex-direction:column;gap:2px}
.ar-item{
  display:grid;grid-template-columns:56px minmax(0,1fr) 74px;gap:14px;align-items:baseline;
  padding:10px 10px 10px 0;border-radius:8px;transition:.18s;
}
.ar-item:hover{background:rgba(255,255,255,.022);padding-left:10px}
.ar-item time{font-size:11.5px;color:var(--dim);font-family:var(--mono);letter-spacing:.02em}
.ar-item b{
  font-family:var(--serif);font-size:15.5px;font-weight:500;color:var(--text-2);
  line-height:1.6;transition:.18s;
}
.ar-item:hover b{color:var(--accent)}
.ar-item span{font-size:11.5px;color:var(--dim);text-align:right}

/* ---------- 页脚 ---------- */
footer.site{
  border-top:1px solid var(--line);margin-top:40px;
  padding:34px 24px calc(30px + env(safe-area-inset-bottom));
}
.foot-inner{
  max-width:var(--max);margin:0 auto;display:flex;justify-content:space-between;
  gap:18px;flex-wrap:wrap;align-items:center;
}
.foot-inner p{margin:0;font-size:12.5px;color:var(--dim)}
.foot-inner .fnav{display:flex;gap:18px;font-size:12.5px;color:var(--muted)}
.foot-inner a:hover{color:var(--accent)}

/* 移动底栏 */
.mobile-tabs{display:none}

/* ---------- 响应式 ---------- */
@media (max-width:1080px){
  .post-wrap{grid-template-columns:1fr;gap:0}
  .toc{display:none}
}
@media (max-width:960px){
  .home-grid{grid-template-columns:1fr;gap:38px}
  .sidebar{position:static;flex-direction:row;flex-wrap:wrap;gap:14px}
  .side-card{flex:1 1 240px}
  .about-wrap{grid-template-columns:1fr;gap:36px}
  .about-side{display:grid;grid-template-columns:1fr 1fr;gap:14px}
}
@media (max-width:720px){
  .nav{padding:0 16px;height:58px;gap:12px}
  .nav-links{display:none}
  .search-btn{margin-left:auto}
  .brand span{display:none}
  main{padding:0 18px 96px}
  .hero{padding:46px 0 38px}
  .hero p.lede{font-size:15.5px}
  .stats{gap:26px}
  .featured{padding:24px 22px;border-radius:16px;margin-bottom:32px;grid-template-columns:1fr;gap:0}
  .featured .f-cover{display:none}
  .post-item{grid-template-columns:78px minmax(0,1fr);gap:13px;padding:18px 0}
  .post-item:hover{transform:none}
  .post-item::before{display:none}
  .post-item h3{font-size:17.5px;margin-bottom:7px}
  .post-item p{font-size:13px;margin-bottom:10px}
  .pi-cover{border-radius:8px}
  .reader-tools{gap:6px;padding-top:4px}
  .rt-group button{min-width:36px;height:32px}
  .resume-bar{padding:9px 12px;font-size:12.5px;gap:8px}
  .resume-bar button{padding:4px 10px;font-size:12px}
  .related-grid{grid-template-columns:1fr}
  .ar-year{padding:26px 0 14px}
  .ar-year h2{font-size:27px}
  .ar-month{grid-template-columns:54px minmax(0,1fr);gap:12px;padding:16px 0 4px}
  .ar-mlabel b{font-size:17px}
  .ar-item{grid-template-columns:1fr auto;gap:3px 10px;padding:9px 0}
  .ar-item time{grid-column:1;grid-row:1;font-size:11px}
  .ar-item span{grid-column:2;grid-row:1;font-size:11px}
  .ar-item b{grid-column:1 / -1;grid-row:2;font-size:14.5px;line-height:1.55}
  .ar-item:hover{padding-left:6px}
  .sidebar{flex-direction:column}
  .side-card{width:100%}
  .post-wrap{padding-top:26px}
  .post-head{padding-bottom:22px;margin-bottom:26px}
  .prose{font-size:16px;line-height:1.9}
  .prose h2{font-size:21px;margin:40px 0 16px}
  .pager{grid-template-columns:1fr}
  .pager .ph{display:none}
  .page-head{padding:38px 0 26px}
  .tag-grid{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:38px}
  .tag-card{padding:15px}
  .tag-card .hash{font-size:16px}
  .tag-card b{font-size:13.5px}
  .tag-card .cnt em{font-size:17px}
  .about-wrap{padding-top:34px}
  .about-side{grid-template-columns:1fr}
  .about-body .lead{font-size:16px}
  .tl-item{grid-template-columns:56px 1fr;gap:14px}
  .tl-item::before{left:65px}
  .foot-inner{flex-direction:column;align-items:flex-start;gap:12px}
  footer.site{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  /* 移动底栏 */
  .mobile-tabs{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:rgba(12,17,23,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .mobile-tabs a{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:48px;font-size:10.5px;color:var(--dim);border-radius:9px;transition:.2s;letter-spacing:.04em;
  }
  .mobile-tabs a svg{width:19px;height:19px}
  .mobile-tabs a.on{color:var(--accent);background:rgba(94,234,212,.07)}
  .search-layer{padding:8vh 16px 16px}
}
@media (max-width:400px){
  .tag-grid{grid-template-columns:1fr}
  .stats{gap:20px}
  .stats b{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
/* ==================== 书架 ==================== */
.shelf-head{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:20px;flex-wrap:wrap;padding:56px 0 28px;
}
.shelf-head .page-head{padding:0}
.shelf-actions{display:flex;gap:10px;align-items:center}
.btn-upload{
  display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;
  border-radius:10px;background:linear-gradient(135deg,rgba(94,234,212,.16),rgba(125,211,252,.10));
  border:1px solid var(--accent-line);color:var(--accent);font-size:13.5px;transition:.2s;
}
.btn-upload:hover{background:rgba(94,234,212,.20);transform:translateY(-1px)}
.btn-upload svg{width:16px;height:16px}
.btn-ghost{
  display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px;
  border-radius:10px;border:1px solid var(--line);color:var(--muted);font-size:13px;transition:.2s;
}
.btn-ghost:hover{color:var(--text);border-color:var(--line-strong)}

.upload-zone{
  border:1px dashed var(--line-strong);border-radius:18px;
  padding:52px 24px;text-align:center;transition:.22s;
  background:radial-gradient(circle at 50% 0%,rgba(94,234,212,.05),transparent 70%);
  margin-bottom:34px;
}
.upload-zone.drag{border-color:var(--accent);background:rgba(94,234,212,.07);transform:scale(1.005)}
.upload-zone .uz-icon{
  width:54px;height:54px;border-radius:14px;margin:0 auto 16px;
  display:grid;place-items:center;border:1px solid var(--accent-line);
  background:var(--accent-soft);color:var(--accent);
}
.upload-zone .uz-icon svg{width:24px;height:24px}
.upload-zone h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 8px}
.upload-zone p{margin:0;font-size:13px;color:var(--muted);line-height:1.8}
.upload-zone p b{color:var(--accent);font-weight:500}
.upload-zone .uz-note{font-size:11.5px;color:var(--dim);margin-top:10px}

.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:16px}
.book-card{
  border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(17,25,34,.55);
  transition:.24s;position:relative;display:flex;flex-direction:column;
}
.book-card:hover{border-color:var(--accent-line);transform:translateY(-3px);box-shadow:var(--shadow)}
.bc-cover{
  position:relative;aspect-ratio:16/9;padding:18px 18px 14px;display:flex;flex-direction:column;
  justify-content:space-between;overflow:hidden;cursor:pointer;
  background:linear-gradient(140deg,hsl(var(--h) 48% 18%),hsl(var(--h2) 52% 9%));
}
.bc-cover::after{
  content:"";position:absolute;right:-30%;top:-40%;width:80%;aspect-ratio:1;
  border-radius:50%;border:1px solid rgba(255,255,255,.14);
  box-shadow:0 0 0 26px rgba(255,255,255,.04),0 0 0 52px rgba(255,255,255,.02);
  pointer-events:none;
}
.bc-tag{
  font-size:9.5px;letter-spacing:.18em;color:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:1px 6px;align-self:flex-start;
}
.bc-title{
  font-family:var(--serif);font-size:19px;line-height:1.45;color:#f2f7fb;font-weight:600;
  max-height:2.9em;overflow:hidden;
}
.bc-body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.bc-info{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11.5px;color:var(--dim)}
.bc-info b{font-weight:500;color:var(--muted);font-size:12px}
.bc-progress{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:auto}
.bc-progress i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.bc-actions{display:flex;gap:8px;margin-top:2px}
.bc-actions button,.bc-actions a{
  flex:1;height:32px;border-radius:7px;font-size:12px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--text-2);transition:.18s;
}
.bc-actions a{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.bc-actions a:hover{background:rgba(94,234,212,.16)}
.bc-actions button:hover{color:#ff8a8a;border-color:rgba(255,120,120,.4)}
.shelf-empty{text-align:center;padding:20px 0 40px;color:var(--dim);font-size:13px}

/* 阅读模式下的迷你播放器：默认收起成小胶囊，点封面展开 */
body.reading .player:not(.moved){
  left:auto;right:16px;bottom:calc(112px + env(safe-area-inset-bottom));transform:none;
  background:rgba(12,17,23,.93);box-shadow:0 10px 22px rgba(0,0,0,.5);
}
body.reading .player.collapsed{width:auto}

/* ==================== 听歌 ==================== */
.music-head{padding:44px 0 20px}
.music-search{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px;
}
.music-field{
  flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
  height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
  background:rgba(17,25,34,.6);
}
.music-field svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.music-field input{
  flex:1;border:none;outline:none;background:none;color:var(--text);font-size:15px;
}
.music-field input::placeholder{color:var(--dim)}
.region-seg{
  display:flex;gap:8px;width:100%;overflow-x:auto;padding:2px 0 4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.region-seg::-webkit-scrollbar{display:none}
.region-seg button{
  flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:rgba(17,25,34,.55);
  font-size:12.5px;color:var(--muted);transition:.16s;
}
.region-seg button:hover{border-color:var(--line-strong);color:var(--text-2)}
.region-seg button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

.tr-rank{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-family:var(--serif);font-size:17px;color:var(--accent);
  background:rgba(94,234,212,.08);border:1px solid var(--accent-line);
}
.track.bili-row{grid-template-columns:56px minmax(0,1fr) 88px 40px}
.src-note{margin-top:14px;font-size:11.5px;color:var(--dim);line-height:1.9}
.dy-card{
  border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;
  background:rgba(17,25,34,.55);margin-top:24px;
}
.dy-card b{font-family:var(--serif);font-size:16px;color:var(--text)}
.dy-card p{font-size:12.5px;color:var(--muted);line-height:1.95;margin-top:10px}
.dy-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.dy-links a{
  height:34px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;
  border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:12.5px;
}
.dy-links a:hover{background:rgba(94,234,212,.18)}
.dy-tip{font-size:11.5px;color:var(--dim)}
.res-head{display:flex;align-items:baseline;gap:12px;margin-top:26px;flex-wrap:wrap}
.res-head b{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--text)}
.play-all{
  margin-left:auto;height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--accent-line);
  background:var(--accent-soft);color:var(--accent);font-size:11.5px;
}
.play-all:hover{background:rgba(94,234,212,.18)}
.play-all[hidden]{display:none}
.res-head span{font-size:11.5px;color:var(--dim)}
.res-head .back-hot{
  margin-left:auto;height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--line);
  font-size:11.5px;color:var(--text-2);display:inline-flex;align-items:center;
}
.res-head .back-hot:hover{border-color:var(--accent-line);color:var(--accent)}
.music-tip{font-size:11.5px;color:var(--dim);line-height:1.8;margin-top:12px}
.music-tip b{color:var(--text-2);font-weight:500}

.track-list{margin-top:26px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.track{
  display:grid;grid-template-columns:56px minmax(0,1fr) 90px 108px;gap:12px;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--line);transition:.16s;
}
.track:last-child{border-bottom:none}
.track:hover{background:rgba(255,255,255,.025)}
.track.on{background:var(--accent-soft)}
.tr-art{
  width:52px;height:52px;border-radius:8px;display:grid;place-items:center;
  font-family:var(--serif);font-size:18px;color:rgba(255,255,255,.9);
  background:linear-gradient(140deg,hsl(var(--h) 46% 30%),hsl(var(--h2) 50% 16%));
  flex-shrink:0;overflow:hidden;
}
.tr-meta{min-width:0}
.tr-meta b{
  display:block;font-size:14px;font-weight:500;color:var(--text);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tr-meta span{
  display:block;font-size:11.5px;color:var(--dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tr-play{
  height:32px;border-radius:8px;border:1px solid var(--line);color:var(--text-2);
  font-size:12px;transition:.18s;display:grid;place-items:center;
}
.tr-play:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.tr-play.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.tr-acts{display:flex;align-items:center;gap:2px;justify-content:flex-end}
.tr-star.on{color:var(--accent)}
.tr-open{
  width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--dim);
  transition:.18s;
}
.tr-open:hover{color:var(--accent);background:rgba(255,255,255,.04)}
.tr-open svg{width:15px;height:15px}

.music-empty{
  padding:40px 20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.9;
  border:1px dashed var(--line);border-radius:14px;margin-top:26px;
}

.player{
  position:fixed;left:50%;bottom:86px;transform:translateX(-50%);
  width:min(680px,calc(100% - 32px));z-index:260;
  background:rgba(14,20,27,.97);border:1px solid var(--line);
  border-radius:14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:9px 14px 11px;transition:opacity .22s ease;
  display:flex;align-items:center;gap:10px;box-shadow:0 14px 34px rgba(0,0,0,.45);
  visibility:hidden;opacity:0;pointer-events:none;touch-action:none;
}
.player.moved{transform:none}
.player.dragging{transition:none;cursor:grabbing;box-shadow:0 20px 44px rgba(0,0,0,.55)}
.player.up{visibility:visible;opacity:1;pointer-events:auto}
.player.collapsed{width:auto;padding:6px;border-radius:999px;gap:6px}
.player.collapsed .p-info,
.player.collapsed #pPrev,
.player.collapsed #pNext,
.player.collapsed .p-fav,
.player.collapsed .p-close{display:none}
.player.collapsed .p-art{width:40px;height:40px}
.player.collapsed .p-art #pArtTxt{font-size:13px}
.player.collapsed .p-btn{width:32px;height:32px;border-radius:50%}
.player .p-art{touch-action:none}
.player .p-info{cursor:grab}
.player::before{
  content:"";position:absolute;inset:-16px -12px -14px;border-radius:24px;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 34% 62%,rgba(94,234,212,.42),rgba(125,211,252,.12) 46%,transparent 70%);
  opacity:var(--pulse,.18);filter:blur(7px);transition:opacity .1s linear;
}

.player .p-art{
  position:relative;width:50px;height:50px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:radial-gradient(circle at 42% 36%,hsl(var(--ph,170) 48% 30%),hsl(var(--ph2,200) 52% 12%));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}
.player .p-art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.player .p-art #pArtTxt{
  position:relative;z-index:2;font-family:var(--serif);font-size:14px;line-height:1;color:#fff;
  opacity:.94;text-shadow:0 1px 8px rgba(0,0,0,.7);
}
.player .p-info{flex:1;min-width:0}
.player .p-info b{display:block;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .p-info span{display:block;font-size:11px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .p-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);flex-shrink:0}
.player .p-btn:hover{background:rgba(255,255,255,.06);color:var(--accent)}
.player .p-btn svg{width:17px;height:17px}
.player .p-btn.on{color:var(--accent);background:var(--accent-soft)}
.player .p-btn.hide{display:none}
.player .p-close{color:var(--dim)}
.player .p-close:hover{color:#ff8a8a;background:rgba(255,120,120,.08)}
.player .p-bar{
  position:absolute;left:12px;right:12px;bottom:3px;height:3px;background:rgba(255,255,255,.10);
  border-radius:3px;cursor:pointer;touch-action:none;
}
.player .p-bar::after{
  content:"";position:absolute;left:-8px;right:-8px;top:-9px;bottom:-9px;
}
.player .p-bar i{
  display:block;height:100%;width:0;border-radius:3px;pointer-events:none;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .2s linear;
}
.player .p-bar b{
  position:absolute;top:50%;left:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 2px rgba(10,14,19,.85),0 0 8px rgba(94,234,212,.6);
  pointer-events:none;opacity:0;transition:opacity .16s;
}
.player .p-bar:hover b,.player .p-bar.seeking b{opacity:1}
.player .p-bar.seeking i{transition:none}
.player .p-time{
  position:absolute;left:50%;top:-30px;transform:translateX(-50%);
  padding:3px 8px;border-radius:6px;background:rgba(8,12,17,.94);border:1px solid var(--line);
  font-family:var(--sans);font-size:11px;color:var(--text-2);white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .16s;
}
.player .p-bar.seeking .p-time{opacity:1}

.local-box{margin-top:36px;padding-bottom:120px}
.local-drop{
  display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px dashed var(--line-strong);
  border-radius:12px;font-size:12.5px;color:var(--muted);cursor:pointer;transition:.2s;
}
.local-drop:hover{border-color:var(--accent-line);background:rgba(94,234,212,.04)}
.local-drop.drag{border-color:var(--accent);background:rgba(94,234,212,.10);border-style:solid}
.local-drop .drop-text{flex:1;min-width:0;line-height:1.6}
.drop-dir{
  flex:0 0 auto;height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line);
  font-size:11.5px;color:var(--text-2);background:rgba(255,255,255,.04);
}
.drop-dir:hover{border-color:var(--accent-line);color:var(--accent)}
.batch-bar{display:none;align-items:center;gap:10px;margin-top:10px;padding:0 2px}
.batch-bar.on{display:flex}
.bp-track{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.bp-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .18s ease}
.batch-bar span{font-size:11.5px;color:var(--dim);white-space:nowrap;max-width:65%;overflow:hidden;text-overflow:ellipsis}
.local-drop b{color:var(--accent);font-weight:500}

@media (max-width:720px){
  .music-head{padding:26px 0 12px}
  .music-search{gap:8px}
  .music-field{min-width:100%;height:42px}
  .region-seg button{height:32px;padding:0 12px;font-size:12px}
  .tr-rank{width:40px;height:40px;border-radius:10px;font-size:15px}
  .track.bili-row{grid-template-columns:42px minmax(0,1fr) 56px 30px;gap:8px}
  .dy-card{padding:16px}
  .track{grid-template-columns:44px minmax(0,1fr) 54px 84px;gap:7px;padding:9px 10px}
  .tr-art{width:44px;height:44px;border-radius:7px;font-size:15px}
  .tr-acts{gap:0}
  .tr-open{width:28px;height:28px}
  .tr-open svg{width:13px;height:13px}
  .tr-star svg{width:14px;height:14px}
  .tr-play{height:30px;font-size:11.5px}
  .player{width:calc(100% - 20px);bottom:104px;padding:8px 12px 12px;border-radius:12px;border-bottom:1px solid var(--line)}
  
  .player .p-art{width:36px;height:36px}
}

/* ==================== 云端笔记卡片 ==================== */
.cloud-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.cloud-card{
  display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:12px;
  border:1px solid var(--line);background:rgba(17,25,34,.5);transition:.2s;min-width:0;
}
.cloud-card:hover{border-color:var(--accent-line);background:rgba(21,31,42,.85);transform:translateY(-2px)}
.cc-kind{
  align-self:flex-start;font-size:10px;padding:1px 7px;border-radius:4px;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);
}
.cloud-card b{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.5;color:var(--text)}
.cloud-card:hover b{color:var(--accent)}
.cc-ex{
  font-size:12.5px;color:var(--muted);line-height:1.7;

}
.cc-meta{font-size:11px;color:var(--dim);margin-top:2px}
.post-head .tags span{

}
@media (max-width:720px){.cloud-grid{grid-template-columns:1fr}}

/* ==================== 写作台 ==================== */
.write-wrap{
  display:grid;grid-template-columns:264px minmax(0,1fr);gap:0;
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:rgba(15,21,28,.6);min-height:calc(100vh - 190px);margin-bottom:40px;
}
.wp-side{border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(12,17,23,.45)}
.wp-side header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 16px 12px;border-bottom:1px solid var(--line);
}
.wp-side header b{font-size:13px;letter-spacing:.06em;color:var(--text-2);font-weight:600}
.wp-new{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:7px;
  background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);font-size:12px;
}
.wp-new:hover{background:rgba(94,234,212,.16)}
.wp-list{flex:1;overflow-y:auto;padding:8px}
.wp-item{
  display:block;padding:11px 12px;border-radius:9px;transition:.16s;cursor:pointer;
  border:1px solid transparent;
}
.wp-item:hover{background:rgba(255,255,255,.03)}
.wp-item.on{background:var(--accent-soft);border-color:var(--accent-line)}
.wp-item b{
  display:block;font-size:13.5px;font-weight:500;color:var(--text);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wp-item span{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:11px;color:var(--dim)}
.wp-item i{font-style:normal;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.05);font-size:10px}
.wp-item.on i{background:rgba(94,234,212,.14);color:var(--accent)}
.wp-empty{padding:26px 14px;text-align:center;font-size:12.5px;color:var(--dim);line-height:1.8}

.wp-main{display:flex;flex-direction:column;min-width:0}
.wp-bar{
  display:flex;align-items:center;gap:10px;padding:12px 18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.wp-title{
  flex:1;min-width:160px;border:none;outline:none;background:none;
  font-family:var(--serif);font-size:19px;color:var(--text);font-weight:600;
}
.wp-title::placeholder{color:var(--dim);font-weight:400}
.wp-seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.wp-seg button{height:30px;padding:0 11px;font-size:12px;color:var(--dim)}
.wp-seg button.on{background:rgba(94,234,212,.12);color:var(--accent)}
.wp-body{flex:1;display:flex;min-height:0;position:relative}
.wp-editor{
  flex:1;width:100%;resize:none;border:none;outline:none;background:none;
  padding:20px 22px 80px;color:var(--text-2);font-family:var(--mono);
  font-size:14px;line-height:1.95;tab-size:2;
}
.wp-editor::placeholder{color:var(--dim)}
.wp-preview{
  flex:1;overflow-y:auto;padding:8px 26px 80px;display:none;
}
.wp-preview.on{display:block}
.wp-preview .prose{font-size:15.5px}
.wp-foot{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 18px calc(56px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);
  background:rgba(10,14,19,.6);
}
.wp-foot .sp{flex:1}
.wp-btn{
  height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);
  color:var(--text-2);font-size:12.5px;transition:.18s;
}
.wp-btn:hover{border-color:var(--line-strong);color:var(--text)}
.wp-btn.primary{

}
.wp-btn.primary:hover{background:rgba(94,234,212,.18)}
.wp-btn.danger:hover{color:#ff8a8a;border-color:rgba(255,120,120,.4)}
.wp-sync{display:inline-flex;align-items:center;gap:6px}
.wp-sync i{width:6px;height:6px;border-radius:50%;background:var(--dim);display:inline-block}
.wp-sync.ok i{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.wp-sync.busy i{background:#f5c451}
.wp-sync.off i{background:#e08a5a}
.wp-note{
  font-size:11.5px;color:var(--dim);line-height:1.8;padding:0 2px;
}
.wp-tag{

@media (max-width:720px){

  .wp-item{min-width:148px;height:46px;flex-shrink:0;border:1px solid var(--line);padding:7px 10px;overflow:hidden}

  .wp-bar{padding:8px 12px;gap:8px}
  .wp-title{font-size:16px;min-width:110px;flex-basis:100%}
  .wp-tag{width:96px;flex:1}
  .wp-editor{padding:14px 12px 60px;font-size:13.5px;min-height:280px}

  .wp-editor{min-height:220px}

/* ==================== 阅读器 ==================== */
.reader{
  position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  background:var(--r-bg);color:var(--r-fg);
  --r-bg:#0a0e13;--r-fg:#d9e2ec;--r-dim:#8b9aab;--r-accent:#5eead4;
  --r-line:rgba(255,255,255,.10);--r-panel:rgba(12,17,23,.96);--r-shadow:0 8px 30px rgba(0,0,0,.45);
  --r-size:19px;--r-lh:2;--r-width:720px;
  --r-serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  font-family:var(--r-serif);
  transition:background .3s,color .3s;
}
.reader[data-theme="paper"]{--r-bg:#f4ecdd;--r-fg:#2c2721;--r-dim:#8b7f6e;--r-accent:#9a6a3c;--r-line:rgba(44,39,33,.14);--r-panel:rgba(244,236,221,.97);--r-shadow:0 8px 26px rgba(90,70,40,.13)}
.reader[data-theme="green"]{--r-bg:#cfe2cd;--r-fg:#22301f;--r-dim:#67765f;--r-accent:#3f7a4a;--r-line:rgba(34,48,31,.14);--r-panel:rgba(207,226,205,.97);--r-shadow:0 8px 26px rgba(40,60,35,.13)}
.reader[data-theme="black"]{--r-bg:#000;--r-fg:#a9b2bc;--r-dim:#5c656f;--r-accent:#7f95ad;--r-line:rgba(255,255,255,.09);--r-panel:rgba(0,0,0,.95);--r-shadow:0 8px 30px rgba(0,0,0,.7)}

.r-stage{position:relative;z-index:1;flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden;padding:58px 0 128px;isolation:isolate}
.r-scroll{
  width:100%;max-width:var(--r-width);height:100%;overflow-y:auto;overflow-x:hidden;
  padding:0 32px 56px;scrollbar-width:thin;
}
.r-scroll::-webkit-scrollbar{width:6px}
.r-scroll::-webkit-scrollbar-thumb{background:var(--r-line);border-radius:3px}
.r-pagewrap{
  width:100%;max-width:var(--r-width);height:100%;overflow:hidden;position:relative;
  padding:0 32px;display:flex;justify-content:center;
}
.r-clip{flex:1;min-width:0;height:100%;overflow:hidden;position:relative}
.r-page{
  height:100%;column-fill:auto;column-gap:0;
  transition:transform .32s cubic-bezier(.22,.61,.36,1);
  will-change:transform;
}
.r-text{
  font-family:var(--r-serif);font-size:var(--r-size);line-height:var(--r-lh);
  letter-spacing:.012em;color:var(--r-fg);
}
.r-text .ch-title{
  display:block;text-align:center;font-size:1.35em;font-weight:600;
  margin:1.8em 0 1.6em;line-height:1.6;text-indent:0;color:var(--r-fg);
  break-after:avoid;
}
.r-text .ch-title:first-child{margin-top:.8em}
.r-text p{margin:0 0 .82em;text-indent:2em;word-break:break-word;overflow-wrap:break-word}
.r-text .ch-end{text-align:center;color:var(--r-dim);font-size:.86em;margin:2.4em 0 1.4em;text-indent:0;letter-spacing:.1em}

.r-bar{
  position:absolute;left:0;right:0;z-index:30;background:var(--r-panel);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:opacity .26s,transform .26s;border-color:var(--r-line);
}
.r-top{
  top:0;height:54px;display:flex;align-items:center;gap:6px;padding:0 12px;
  border-bottom:1px solid var(--r-line);box-shadow:var(--r-shadow);
}
.r-top .r-back{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;color:var(--r-fg)}
.r-top .r-back:hover{background:rgba(128,140,155,.14)}
.r-top .r-name{
  flex:1;min-width:0;text-align:center;font-family:var(--sans);font-size:13px;
  color:var(--r-fg);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.r-top .r-name small{display:block;font-size:10.5px;color:var(--r-dim);margin-top:1px;font-family:var(--sans)}
.r-icon{
  width:38px;height:38px;display:grid;place-items:center;border-radius:9px;color:var(--r-fg);
  opacity:.85;transition:.18s;flex-shrink:0;
}
.r-icon:hover{background:rgba(128,140,155,.14);opacity:1}
.r-icon svg{width:18px;height:18px}
.r-bottom{
  bottom:0;padding:10px 20px calc(74px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--r-line);
  font-family:var(--sans);box-shadow:var(--r-shadow);
}
.r-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--r-dim);gap:10px}
.r-slider{
  -webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;
}
.r-slider::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--r-line)}
.r-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;margin-top:-5px;
  background:var(--r-accent);box-shadow:0 0 0 4px rgba(94,234,212,.15);
}
.r-slider::-moz-range-track{height:3px;border-radius:2px;background:var(--r-line)}
.r-slider::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--r-accent)}

.reader.ui-hidden .r-bar{opacity:0;pointer-events:none;transform:translateY(-6px)}
.reader.ui-hidden .r-bottom{transform:translateY(6px)}

/* ---------- 仿真翻页（书本） ---------- */
.bk-stage{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  perspective:2600px;perspective-origin:48% 46%;
}
.bk-book{position:relative;transform-style:preserve-3d;margin:0 auto}
.bk-page{position:absolute;top:0;left:0}
.bk-book::before,.bk-book::after{
  content:"";position:absolute;top:7px;bottom:7px;width:6px;border-radius:2px;
  background:repeating-linear-gradient(90deg,rgba(150,168,185,.22) 0 1px,transparent 1px 2.5px);
  opacity:.7;
}
.bk-book::before{left:-7px}
.bk-book::after{right:-7px}
.bk-page{
  transform-style:preserve-3d;transform-origin:left center;
}
.bk-page.bk-noanim{transition:none}
.bk-face{
  position:absolute;inset:0;border-radius:3px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background-color:var(--r-bg);
  background-image:radial-gradient(rgba(120,130,140,.045) 1px,transparent 1px);
  background-size:3px 3px;
  border:1px solid var(--r-line);
}
.bk-front{
  box-shadow:
    inset 22px 0 34px -26px rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(255,255,255,.015),
    0 18px 40px rgba(0,0,0,.30);
}
.bk-book.bk-dual .bk-left .bk-front{
  box-shadow:
    inset -22px 0 34px -26px rgba(0,0,0,.62),
    inset 22px 0 30px -30px rgba(255,255,255,.10),
    0 18px 40px rgba(0,0,0,.30);
}
.bk-book.bk-dual .bk-right .bk-front{
  box-shadow:
    inset 22px 0 34px -26px rgba(0,0,0,.62),
    inset 0 0 0 1px rgba(255,255,255,.015),
    0 18px 40px rgba(0,0,0,.30);
}
.bk-back-sheet{
  position:absolute;inset:0;transform:rotateY(180deg);overflow:hidden;border-radius:3px;opacity:.88;
}
.bk-spine{display:none}
.bk-book.bk-dual .bk-spine{
  display:block;position:absolute;left:50%;top:0;bottom:0;width:42px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.16) 38%,rgba(0,0,0,.34) 50%,rgba(0,0,0,.16) 62%,transparent);
  z-index:7;pointer-events:none;border-radius:2px;
}
.reader[data-theme="paper"] .bk-spine{background:linear-gradient(90deg,transparent,rgba(120,95,60,.07) 38%,rgba(120,95,60,.16) 50%,rgba(120,95,60,.07) 62%,transparent)}
.reader[data-theme="green"] .bk-spine{background:linear-gradient(90deg,transparent,rgba(40,60,35,.10) 38%,rgba(40,60,35,.22) 50%,rgba(40,60,35,.10) 62%,transparent)}
.bk-cover-page{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;padding:40px 20px;text-align:center;
}
.bc-brand{
  font-family:var(--sans);font-size:9.5px;letter-spacing:.42em;color:var(--r-dim);
  opacity:.55;margin-bottom:34px;
}
.bc-book{
  font-family:var(--serif);font-size:clamp(22px,2.4vw,30px);font-weight:600;
  color:var(--r-fg);letter-spacing:.04em;line-height:1.5;max-width:11em;
}
.bc-by{font-family:var(--serif);font-size:13px;color:var(--r-dim);margin-top:14px;letter-spacing:.12em}
.bc-line{width:34px;height:1px;background:var(--r-line);margin:26px 0 18px}
.bc-meta{font-family:var(--sans);font-size:10.5px;color:var(--r-dim);opacity:.75;letter-spacing:.1em}
.bc-tip{
  position:absolute;bottom:56px;left:0;right:0;text-align:center;
  font-family:var(--sans);font-size:10.5px;color:var(--r-dim);opacity:.45;letter-spacing:.14em;
}
.bk-blank{
  display:flex;align-items:center;justify-content:center;height:100%;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.3em;color:var(--r-dim);opacity:.35;
}
.bk-front::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.06) 34%,rgba(255,255,255,.05) 72%,rgba(0,0,0,.10));
  opacity:var(--shade,0);
}
.bk-back{
  transform:rotateY(180deg);
  background-image:
    linear-gradient(90deg,rgba(255,255,255,.02),rgba(255,255,255,.055)),
    repeating-linear-gradient(90deg,transparent 0 34px,rgba(128,140,155,.04) 34px 35px),
    radial-gradient(rgba(120,130,140,.05) 1px,transparent 1px);
  background-size:auto,auto,3px 3px;
  box-shadow:
    inset -22px 0 34px -26px rgba(0,0,0,.40),
    0 18px 40px rgba(0,0,0,.22);
}
.bk-back::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(270deg,rgba(0,0,0,.30),rgba(0,0,0,.04) 40%,rgba(255,255,255,.03));
  opacity:var(--bshade,0);
}
.bk-sheet{position:absolute;inset:0;padding:24px 40px 18px;display:flex;flex-direction:column;overflow:hidden;border-radius:3px}
.bk-head{
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;
  color:var(--r-dim);opacity:.75;margin-bottom:14px;
}
.bk-head span{max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-head::after{content:"";flex:1;height:1px;background:var(--r-line);opacity:.7}
.bk-body{flex:1;min-height:0;overflow:hidden;position:relative}
.bk-body p{margin:0 0 .78em;text-indent:2em}
.bk-body p:last-child{margin-bottom:0}
.bk-body .ch-title{margin-top:.2em;margin-bottom:.95em}
.bk-foot{
  flex-shrink:0;margin-top:10px;text-align:center;
  font-family:var(--sans);font-size:10.5px;color:var(--r-dim);opacity:.62;letter-spacing:.12em;
}
.bk-measure{position:absolute;inset:0;visibility:hidden;pointer-events:none;z-index:-1}
.bk-hint{
  position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
  font-family:var(--sans);font-size:10.5px;color:var(--r-dim);opacity:.45;
  letter-spacing:.14em;pointer-events:none;
}
@media (max-width:720px){
  .bk-sheet{padding:18px 24px 14px}
  .bk-head{margin-bottom:10px;font-size:10px}
  .bk-body p{margin-bottom:.78em}
  .bk-face{border-radius:2px}
}

/* 章节末尾按钮 */
.r-next{
  display:flex;justify-content:center;gap:12px;margin:2.6em 0 .6em;
}
.r-next button{
  font-family:var(--sans);font-size:13px;color:var(--r-accent);
  border:1px solid var(--r-line);border-radius:9px;padding:9px 20px;transition:.2s;
}
.r-next button:hover{background:rgba(128,140,155,.10)}

/* 抽屉 / 设置 */
.r-drawer{
  position:absolute;top:0;bottom:0;right:0;width:340px;max-width:88%;z-index:320;
  background:var(--r-panel);border-left:1px solid var(--r-line);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.61,.36,1);
  display:flex;flex-direction:column;backdrop-filter:blur(18px);
}
.r-drawer.open{transform:none}
.r-drawer header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 12px;border-bottom:1px solid var(--r-line);
  font-family:var(--sans);font-size:13px;color:var(--r-dim);letter-spacing:.06em;
}
.r-drawer header b{color:var(--r-fg);font-size:14px;letter-spacing:0;font-weight:600}
.r-toc-list{flex:1;overflow-y:auto;padding:6px 8px 20px}
.r-toc-list a{
  display:block;padding:11px 12px;border-radius:8px;font-family:var(--sans);
  font-size:13.5px;color:var(--r-fg);opacity:.76;line-height:1.5;transition:.16s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.r-toc-list a:hover{background:rgba(128,140,155,.12);opacity:1}
.r-toc-list a.on{background:rgba(128,140,155,.14);opacity:1;color:var(--r-accent)}
.r-toc-list a small{display:block;font-size:10.5px;opacity:.55;margin-top:2px}

/* 设置面板内容 */
.r-set{padding:18px 20px 24px;display:flex;flex-direction:column;gap:22px;font-family:var(--sans);overflow-y:auto}
.r-set .group>label{
  display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--r-dim);margin-bottom:10px;
}
.theme-row{display:flex;gap:10px}
.theme-dot{
  width:44px;height:44px;border-radius:10px;border:1.5px solid var(--r-line);
  position:relative;transition:.18s;
}
.theme-dot span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-family:var(--sans)}
.theme-dot[data-t="ink"]{background:#0a0e13;color:#d9e2ec}
.theme-dot[data-t="paper"]{background:#f4ecdd;color:#2c2721}
.theme-dot[data-t="green"]{background:#cfe2cd;color:#22301f}
.theme-dot[data-t="black"]{background:#000;color:#a9b2bc}
.theme-dot.on{border-color:var(--r-accent);box-shadow:0 0 0 3px rgba(94,234,212,.14)}
.seg{display:flex;border:1px solid var(--r-line);border-radius:9px;overflow:hidden}
.seg button{
  flex:1;height:36px;font-size:12.5px;font-family:var(--sans);color:var(--r-dim);transition:.18s;
}
.seg button.on{background:rgba(128,140,155,.16);color:var(--r-fg)}
.size-row{display:flex;align-items:center;gap:12px}
.size-row button{
  width:40px;height:36px;border:1px solid var(--r-line);border-radius:8px;
  font-size:14px;color:var(--r-fg);transition:.18s;
}
.size-row button:hover:not(:disabled){background:rgba(128,140,155,.12)}
.size-row button:disabled{opacity:.3}
.size-row .val{flex:1;text-align:center;font-size:12.5px;color:var(--r-dim)}
.r-hint{font-size:11px;color:var(--r-dim);line-height:1.7;font-family:var(--sans)}

/* 全局提示（阅读器外） */
.g-toast{
  position:fixed;left:50%;bottom:calc(126px + env(safe-area-inset-bottom));
  transform:translate(-50%,10px);z-index:400;
  max-width:82vw;padding:9px 16px;border-radius:20px;text-align:center;
  background:rgba(8,12,17,.95);border:1px solid var(--line);color:var(--text);
  font-family:var(--sans);font-size:12.5px;line-height:1.5;
  opacity:0;pointer-events:none;transition:.22s;backdrop-filter:blur(10px);
}
.g-toast.show{opacity:1;transform:translate(-50%,0)}

/* 阅读器内提示 */
.r-toast{
  position:absolute;left:50%;bottom:88px;transform:translate(-50%,10px);
  background:rgba(0,0,0,.72);color:#fff;font-family:var(--sans);font-size:12.5px;
  padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s;z-index:9;
}
.r-toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:720px){
  .shelf-head{padding:38px 0 20px}
  .shelf-grid{grid-template-columns:1fr 1fr;gap:10px}
  .bc-cover{aspect-ratio:4/3;padding:12px 12px 10px}
  .bc-title{font-size:14.5px}
  .bc-tag{font-size:8.5px}

  .bc-info{font-size:10px;flex-direction:column;gap:2px;align-items:flex-start}
  .bc-actions{gap:6px}
  .bc-actions button,.bc-actions a{height:30px;font-size:11px}
  .upload-zone{padding:36px 18px}
  .upload-zone h3{font-size:16px}
  .r-stage{padding:52px 0 118px}
  .r-scroll{padding:0 20px 48px}
  .r-text{font-size:var(--r-size)}
  .r-pagewrap{padding:0 20px}
  .r-text{letter-spacing:0}
  .r-drawer{width:100%;max-width:100%}
  .r-top{height:50px}
  .r-bottom{padding:8px 16px calc(68px + env(safe-area-inset-bottom))}
}
@media (max-width:400px){
  .shelf-grid{grid-template-columns:1fr}
  .bc-cover{aspect-ratio:16/9}
}

  tags: ['城市漫游', '生活观察'],
  featured: true,
  content: `周六下午三点，我从地铁站出来，沿着一条种满梧桐的路往北走。导航上说，那家书店在 600 米外的一个老小区底商，门口没有招牌，只有一块手写的木牌。

我找了二十分钟。

## 一、书店正在变成别的东西

这几年进书店，我越来越常遇到一种场景：书是背景，咖啡是主角，拍照的人是顾客。书架做得很高，灯光打得很暖，但真正能坐下来读的书，一本都没有拆封。

我不反对书店卖咖啡。在这个时代，靠卖书活不下去是常识。只是当一家书店的选品开始服从于「拍照好看」，它就不再是一个选书的地方，而是一个布景。

> 一家好书店的标志，不是它有多少书，而是它敢不敢让你把书拿到角落里，坐着读完一章。

## 二、那家没有招牌的店

木牌上写着「旧页」，下面一行小字：周二闭店。

推门进去，风铃响了一声。屋里大概三十平米，四面都是顶到天花板的书架，中间一张长桌，坐着三个人，各自低头看书，没有人抬头。

我在靠窗的位置站了很久。窗台上放着一排旧版的诗集，书脊被晒得发白。抽出一本，扉页上有前一个主人的铅笔字：「1998 年冬，于南京」。

那一下午我读完了半本《夜航西飞》。没有人来问我需不需要点什么，也没有人提醒我这里是消费区。

## 三、安静是一种被设计出来的东西

后来我办了这家店的借阅卡，一年三百块。老板姓周，五十多岁，以前做出版。他说这家店开了七年，最难的两年靠卖旧书和朋友接济撑过来。

我问他，为什么不做咖啡。

他说做了，但只做手冲，一天限量二十杯。「做多了，店里就吵了。」

这句话我记了很久。**安静不是自然而然发生的，它是被选择、被设计、被守住的东西。** 少放两张桌子，少接二十个客人，少赚一点钱，才换来一个可以读完一章的下午。

## 四、我后来常去的地方

现在这家店成了我周末的固定去处。我通常带一台电脑、一个本子，坐最里面那张桌子，点一杯手冲，写到下午五点。

临走时周老板会说一句：「下次来早一点，靠窗的光好。」

城市里这样的地方不多，但确实还有。它们通常没有招牌，不开在商场里，在大众点评上只有七条评价，其中三条还是走错了门的。

如果你也有一间这样的店，别告诉太多人。

*—— 写于一个不想被找到的下午*`

  featured: false,
  content: `读这本书花了三个星期，比预想中慢得多。不是因为难读，而是因为每读十几页，我就得停下来，把书里讲的东西和这些年见过的事对一遍。

## 一、它讲的不是经济学，是「怎么运转」

兰小欢在开篇就说得很清楚：这本书不是教科书，它讲的是中国政府和经济的关系——地方政府如何融资、如何招商、如何做事，以及这些做法带来了什么。

对我这种非经济学背景的读者来说，最有价值的不是那些数据，而是**一套解释框架**。

比如书里讲土地财政：地方政府把土地出让给开发商，拿到一次性的巨额收入，用来修路、建新区、做基建。这套模式在特定阶段极其有效，也埋下了后来的债务问题。

以前我只知道「房价高」，读完才知道，房价背后站着的是一整套地方财政的运转逻辑。

## 二、几个让我停下来的段落

### 关于「事权与财权不匹配」

地方要承担大量的公共服务支出，但税收的大头在中央。缺口怎么补？靠土地、靠举债、靠转移支付。

这不是谁的阴谋，而是制度设计留下的结构性张力。

> 很多我们觉得「不合理」的现象，不是有人故意做坏事，而是激励结构把人推到了那个位置。

### 关于「招商引资」

书里写地方政府为了拉企业落地，能做到什么程度：帮企业跑审批、配土地、修配套、甚至垫资建厂房。

读这段时我想起以前采访过的一个县级招商局干部。他说他一年有 200 天在外面跑，手机里存了三千个老板的号码。

当时我觉得夸张，现在理解了：在他的考核体系里，这就是全部。

## 三、读完之后的三个变化

- **少一点道德判断，多一点结构追问。** 遇到不合理的现象，先问「谁在这个位置上、他面对什么激励」，而不是先骂人。
- **理解「阶段性」。** 很多模式不是对或错，而是只在某个阶段有效。土地财政如此，我自己的工作方式也如此。
- **对宏大叙事保持警惕，也对简单的愤怒保持警惕。** 两者都容易让人停止思考。

## 四、适合谁读

如果你对「为什么是这样的」有过持续的好奇，这本书值得读。它不轻松，但不晦涩。

| 维度 | 评价 |
| --- | --- |
| 阅读难度 | 中等，需要一点耐心 |
| 信息密度 | 很高，建议做笔记 |
| 情绪价值 | 低，但认知价值很高 |
| 适合场景 | 安静的整块时间，不适合通勤碎片 |

最后记一句书里的话，大意是：**了解现实，是为了在里面做出更好的选择，而不是为了变得犬儒。**

这句话我抄在了本子的第一页。`

  tags: ['生活实验', '效率', '自我管理'],
  featured: false,
  content: `实验持续了 90 天。起点很朴素：某天晚上我打开手机屏幕使用时间，发现自己日均 6 小时 47 分。

那天我什么正经事也没干。

## 一、先搞清楚钱花在哪

我做了三件事，按顺序：

1. 连续记录 7 天的屏幕时间，不做任何改变，只观察。
2. 把 App 按「我主动打开」和「它推给我」分成两类。
3. 统计每个 App 的打开次数，而不是时长。

结果有点刺眼：打开次数最多的前三个 App，占据了我 62% 的解锁次数，而我一次都没有主动想过要打开它们。

**问题不在于我用手机太久，而在于我的每一次解锁，几乎都是被别人设计的。**

## 二、我做的四件事

### 1. 把「入口」全部搬走

首页只留四个图标：电话、地图、备忘录、相机。其余全部收进资源库，且关闭所有红点。

这一步的效果最明显。当打开微信需要滑动两屏、输入搜索词，那 80% 的「无意识打开」就消失了。

### 2. 关闭全部非人际通知

只保留电话、短信、日历、以及家人的消息提醒。新闻推送、电商促销、App 更新提示，一律关闭。

判断标准很简单：**这条通知，是不是一个具体的人在等我回应？**

### 3. 给「刷」设一个物理门槛

我把所有信息流类 App 都设了 15 分钟限额，并且把密码交给家人保管。

不是为了自律，是为了让「刷」这件事从默认动作变成一个需要付出代价的决定。

### 4. 用「替代」而不是「戒断」

空出来的时间必须有东西填，否则一定会反弹。我填了三样：纸质书、晚饭后散步、一个只写给自己看的手写本。

## 三、一些具体的数据

90 天后，日均屏幕时间从 6 小时 47 分降到 2 小时 12 分。最直接的变化是：

- 完整读完的书：从一年 4 本，到 90 天 7 本
- 睡前刷手机：从每天，到一周两次
- 早上醒来第一件事看手机：从 100%，到大概 30%

也有没变好的：我的消息回复变慢了，有两次错过了工作群里的临时通知。

所以我做了一个折中：工作日 9 点到 19 点，允许通知；其余时间，只留人际通道。

## 四、一个意外的发现

实验到第二个月，我发现自己不再有「无聊」这个状态了。

以前排队、等电梯、红灯的三十秒，我都会下意识掏手机。现在这些缝隙被空出来了，我开始注意路边新开的店、注意到同事换了发型、注意到自己今天有点累。

**注意力不是一种资源，它其实是你和世界的关系。**

## 五、一个小工具

我用一段脚本每天把 RSS 抓下来，早上一次性读完，而不是每隔十分钟刷新一次信息流：

\`\`\`bash
# 每天早上 7:30 抓取订阅，合并成一个文件
for feed in $(cat ~/feeds.txt); do
  curl -s "$feed" >> ~/daily.xml
done

# 转成纯文本，去掉广告和推荐位
python3 ~/scripts/rss2text.py ~/daily.xml > ~/today.txt
\`\`\`

主动去取，而不是等着被推。这个区别，比任何自律技巧都重要。

## 六、写在最后

我不认为所有人都该做这个实验，也不认为手机是坏的。

我只是想把这 90 天的记录放在这里，作为一个证据：**那种「一天过去了，但不知道自己在干什么」的感觉，是可以被改变的，而且不需要多大的意志力，只需要重新设计几个入口。**

真正难的不是放下手机，是想清楚放下之后，你要拿回什么。`

  excerpt: '十八岁读它是爱情，二十八岁读它是失去，现在读它，是一份关于「什么值得花时间」的清单。',

  featured: false,
  content: `这本书我读过四次。第一次是初中，当成童话；第二次是大学，当成爱情故事；第三次是工作第三年，读出了疲惫；这次是第四次。

同一本书，四次读出了四个不同的东西。这大概就是经典的意思。

## 一、关于「驯养」

狐狸说的那段话，几乎被引用到烂俗：

> 你要是驯养了我，我们就会彼此需要。你对我来说就是世界上独一无二的，我对你来说也是世界上独一无二的。

十八岁读到这句，觉得是告白。现在读到，觉得是成本说明。

**驯养的本质，是愿意为一段关系付出时间，并接受由此产生的责任和脆弱。** 它不浪漫，它很重。

## 二、关于「大人」

书里对大人的讽刺，小时候读着好笑，现在读着有点冒汗。

- 大人喜欢数字。你跟他们说认识一个新朋友，他们从不问你「他的声音怎么样」，只问你「他几岁、有几个兄弟、父亲挣多少钱」。
- 大人喜欢「正事」。你跟他们说看见一栋漂亮的房子，他们想象不出来；你说那房子值十万法郎，他们立刻说：真漂亮。

我以前觉得这是讽刺。现在觉得这是描述。

我确实更关心一个项目的估值，而不是它有没有意思。我确实会用「有没有用」来判断一本书值不值得读。

## 三、关于「三座火山和一朵花」

小王子每天给花浇水、清理火山口、拔掉猴面包树的幼苗。这些事很小，很重复，没有任何产出。

但它们构成了他的星球。

我想了很久这句话对我的意义。我的「星球」是什么？大概就是那些每天重复、看起来毫无成就感的事：做一顿饭、读二十页书、给孩子讲一个故事、给父母打一个电话。

> 真正的生活，可能就藏在这些不会被写进简历的事情里。

## 四、这次读，记住的是结尾

小王子离开的方式，小时候读不懂，觉得是死了。现在读，觉得是一种主动的选择：他要回去照顾他的花。

而飞行员记住的，是那片星空里某一颗星星上的笑声。

**我们失去的东西，并不会消失，它只是变成了我们看世界的方式。**

## 五、给未来的一份清单

如果以后有孩子，我想在他十岁的时候把这本书给他，然后不解释。等他二十岁、三十岁再读，我们或许可以聊一聊，各自读到了什么。

这大概就是我理解的「传承」：不是把答案给他，是把问题留下来。`

## 一

咖啡馆很小，六张桌子，三张有人。靠窗的位置坐着一个写东西的女生，戴着耳机，偶尔抬头看雨。

我点了杯美式，翻开带来的书。看了三页，抬头看雨。又看了两页，又抬头。

雨把整条街洗得很干净。外卖员穿着雨衣在门口等单，电动车后座的箱子用塑料布裹着。有个老人撑一把黑伞慢慢走过，伞骨有一根断了，一直往下塌。

我看了很久。

## 二

效率这件事，在我三十岁之后变得有点压迫。

每天早上列清单，晚上复盘，周末做周计划。我把自己管理得很好，好到有时候会怀疑：我是为了让生活更好，还是为了让「管理生活」这件事本身看起来体面。

今天下午，我什么都没完成。书读了不到二十页，稿子一个字没写。

但我记得那个断了一根伞骨的老人，记得雨打在遮阳棚上的声音，记得咖啡凉掉之后那种发涩的味道。

## 三

> 有些下午的存在意义，就是什么也不完成。

这句话是我自己在笔记本上写的，写完觉得有点矫情，但没划掉。

三十岁之后我慢慢接受一件事：生命里大部分时间是不会产生结果的。那些看起来「浪费」掉的时间，其实是把我们从任务列表里捞出来，重新变成一个能感知的人。

## 四

五点半雨小了，我合上书，书签还是夹在第二十一页。

走出咖啡馆的时候，空气里有那种雨后特有的、泥土和柏油混在一起的味道。

我决定走回家，四十分钟的路。路上买了两个刚出锅的糖糕，烫手。

那天晚上我没有补上那篇稿子。第二天早上写的，写得比预想中顺。

我猜是因为，那个下午虽然什么也没做，但把脑子里的水，倒干净了。`

  content: `2025 年读完 31 本，放弃 9 本。比前一年少，但记得住的多了。

下面这 12 本，是合上书之后还会想起、并且真的改变了我某些做法或想法的。按读完的顺序排列，不分优劣。

## 非虚构

1. **《置身事内》兰小欢** —— 年度最重要的一本。理解了很多以前只会抱怨的事，笔记记了 14 页。
2. **《我们仨》杨绛** —— 在通勤地铁上读完的，最后几页没忍住。写失去，写得极克制。
3. **《扫地出门》马修·德斯蒙德** —— 关于贫困与房租的民族志。读完对「努力就能改变命运」这句话谨慎了很多。
4. **《时间的秩序》卡洛·罗韦利** —— 物理书，但读起来像散文。让我第一次认真想「时间不是一条线」是什么意思。
5. **《万历十五年》黄仁宇** —— 重读。二十岁读是历史，现在读是组织行为学。

## 文学

6. **《百年孤独》马尔克斯** —— 第三次读，这次终于读完了。魔幻的部分不再奇怪，现实的部分开始可怕。
7. **《逃离》艾丽丝·门罗** —— 短篇集。每一篇都在写同一种东西：一个人如何在某个瞬间决定离开。
8. **《平原上的摩西》双雪涛** —— 语言很冷，情绪很烫。东北叙事里我最喜欢的一本。
9. **《小王子》圣埃克苏佩里** —— 第四次重读，为它单独写过一篇。
10. **《海边的卡夫卡》村上春树** —— 三十岁读村上，和二十岁读完全不是一回事。

## 实用类

11. **《深度工作》卡尔·纽波特** —— 方法不新，但论证很扎实。我照着改了工作节奏，效果肉眼可见。
12. **《非暴力沟通》马歇尔·卢森堡** —— 本来很抗拒这类书，读完发现里面讲的是「如何把情绪翻译成需求」，很有用。

## 放弃的 9 本

也记一下，因为放弃同样重要：

- 3 本畅销商业书，读到第三章发现是一个观点反复讲
- 2 本哲学入门，翻译太差，换版本再说
- 2 本小说，文笔好但不关心人物命运
- 1 本自助类，通篇「你可以的」
- 1 本学术专著，超出我目前的知识储备，标记为「三年后再读」

## 明年的三个小目标

- 少读一点新书，多读一点旧书。重读的收益被严重低估。
- 每读完一本，写 300 字，不写长评，只写「它改变了我哪个具体做法」。
- 晚上十点后不读非虚构，留给小说。脑子累的时候读不进去道理，但能读进去故事。

---

书单这件事，最大的用处不是给别人看，是给自己留一个坐标：**这一年，我的注意力落在哪里。**`
