/* ---------------- 2. 工具函数 ---------------- */
const app = document.getElementById('app');
const state = { filterTag: 'all' };

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function sortedPosts() {
  return POSTS.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
}

function fmtDate(d) {
  const p = d.split('-');
  return p[0] + ' 年 ' + parseInt(p[1], 10) + ' 月 ' + parseInt(p[2], 10) + ' 日';
}

function wordCount(md) {
  return md.replace(/[#>*`|\-\n]/g, '').length;
}

function tagStats() {
  const map = {};
  POSTS.forEach(function (p) {
    p.tags.forEach(function (t) { map[t] = (map[t] || 0) + 1; });
  });
  return Object.keys(map)
    .map(function (t) { return { name: t, count: map[t] }; })
    .sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name, 'zh'); });
}

function findPost(slug) {
  for (let i = 0; i < POSTS.length; i++) {
    if (POSTS[i].slug === slug) return POSTS[i];
  }
  return null;
}

/* 程序化封面：按 slug 哈希生成几何图形，零图片资源 */
function hashCode(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function coverSvg(post) {
  const h = hashCode(post.slug);
  const hue = 158 + (h % 58);
  const hue2 = 196 + ((h >>> 6) % 56);
  const variant = h % 3;
  const uid = 'cv' + h.toString(36);
  const c1 = 'hsla(' + hue + ',72%,58%,';
  const c2 = 'hsla(' + hue2 + ',78%,64%,';
  let art = '';

  if (variant === 0) {
    art = '<circle cx="200" cy="62" r="64" fill="' + c1 + '.16)"></circle>' +
      '<circle cx="200" cy="62" r="64" fill="none" stroke="' + c1 + '.46)" stroke-width="1"></circle>' +
      '<circle cx="200" cy="62" r="94" fill="none" stroke="' + c1 + '.20)" stroke-dasharray="3 8"></circle>' +
      '<circle cx="200" cy="62" r="124" fill="none" stroke="' + c2 + '.14)"></circle>' +
      '<circle cx="128" cy="140" r="3" fill="' + c1 + '.9)"></circle>' +
      '<circle cx="128" cy="140" r="13" fill="' + c1 + '.18)"></circle>';
  } else if (variant === 1) {
    let lines = '';
    for (let i = -4; i < 12; i++) {
      lines += '<line x1="' + i * 34 + '" y1="0" x2="' + (i * 34 + 74) + '" y2="200" stroke="' + c1 + '.11)" stroke-width="1"></line>';
    }
    art = lines +
      '<circle cx="186" cy="120" r="46" fill="' + c2 + '.18)" stroke="' + c2 + '.40)"></circle>' +
      '<circle cx="186" cy="120" r="21" fill="none" stroke="' + c1 + '.66)" stroke-width="1.4"></circle>';
  } else {
    let bars = '';
    for (let i = 0; i < 9; i++) {
      const bh = 22 + ((h >>> (i + 2)) % 88);
      bars += '<rect x="' + (112 + i * 16) + '" y="' + (168 - bh) + '" width="5" height="' + bh +
        '" rx="2.5" fill="' + c1 + (0.24 + i * 0.05) + ')"></rect>';
    }
    art = bars +
      '<circle cx="150" cy="74" r="46" fill="none" stroke="' + c2 + '.30)" stroke-dasharray="2 7"></circle>' +
      '<circle cx="150" cy="74" r="46" fill="' + c2 + '.10)"></circle>';
  }

  return '<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<defs>' +
      '<linearGradient id="' + uid + '" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="hsla(' + hue + ',48%,24%,1)"></stop>' +
        '<stop offset="1" stop-color="hsla(' + hue2 + ',52%,12%,1)"></stop>' +
      '</linearGradient>' +
      '<pattern id="' + uid + 'p" width="20" height="20" patternUnits="userSpaceOnUse">' +
        '<path d="M20 0H0v20" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"></path>' +
      '</pattern>' +
    '</defs>' +
    '<rect width="320" height="200" fill="url(#' + uid + ')"></rect>' +
    '<rect width="320" height="200" fill="url(#' + uid + 'p)"></rect>' +
    art +
    '<path d="M18 30h10M23 25v10" stroke="rgba(233,239,246,.18)" stroke-width="1"></path>' +
    '<text x="18" y="182" fill="rgba(233,239,246,.28)" font-family="sans-serif" font-size="9" letter-spacing="2.6">' +
      post.date.replace(/-/g, ' / ') + '</text>' +
  '</svg>';
}

/* 阅读偏好与阅读位置（localStorage 持久化） */
const PREF_KEY = 'wb_halfpage_pref';
const POS_KEY = 'wb_halfpage_pos';

function getPref() {
  try {
    const raw = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    return {
      size: typeof raw.size === 'number' ? Math.max(0, Math.min(2, raw.size)) : 1,
      lh: typeof raw.lh === 'number' ? Math.max(0, Math.min(1, raw.lh)) : 0
    };
  } catch (e) { return { size: 1, lh: 0 }; }
}

function savePref(pref) {
  try { localStorage.setItem(PREF_KEY, JSON.stringify(pref)); } catch (e) { /* 静默降级 */ }
}

function getStoredPos(slug) {
  try {
    const map = JSON.parse(localStorage.getItem(POS_KEY) || '{}');
    const v = map[slug];
    return typeof v === 'number' ? v : 0;
  } catch (e) { return 0; }
}

function saveStoredPos(slug, ratio) {
  try {
    const map = JSON.parse(localStorage.getItem(POS_KEY) || '{}');
    map[slug] = Math.round(ratio * 1000) / 1000;
    localStorage.setItem(POS_KEY, JSON.stringify(map));
  } catch (e) { /* 静默降级 */ }
}

function relatedPosts(post, n) {
  return POSTS.filter(function (p) { return p.slug !== post.slug; })
    .map(function (p) {
      let score = 0;
      p.tags.forEach(function (t) { if (post.tags.indexOf(t) > -1) score++; });
      return { post: p, score: score };
    })
    .filter(function (x) { return x.score > 0; })
    .sort(function (a, b) { return b.score - a.score || (a.post.date < b.post.date ? 1 : -1); })
    .slice(0, n)
    .map(function (x) { return x.post; });
}

/* 最近阅读：localStorage 持久化（离线缓存层） */
const RECENT_KEY = 'wb_halfpage_recent';

function getRecent() {
  try {
    const raw = localStorage.getItem(RECENT_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function markRead(slug) {
  try {
    const list = getRecent().filter(function (s) { return s !== slug; });
    list.unshift(slug);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5)));
  } catch (e) { /* 隐私模式下静默降级 */ }
}

/* ---------------- 3. Markdown 渲染（内联实现，零依赖） ---------------- */
function inlineMd(text) {
  let s = escapeHtml(text);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s;
}

function mdToHtml(md) {
  const codes = [];
  let src = md.replace(/```([a-zA-Z0-9+#-]*)\n([\s\S]*?)```/g, function (m, lang, code) {
    const idx = codes.length;
    codes.push(
      '<pre>' + (lang ? '<span class="lang">' + escapeHtml(lang) + '</span>' : '') +
      '<code>' + escapeHtml(code.replace(/\n+$/, '')) + '</code></pre>'
    );
    return '@@CODE' + idx + '@@';
  });

  const lines = src.split('\n');
  const out = [];
  let listOpen = null;
  let quoteBuf = [];
  let tableBuf = [];

  function closeList() {
    if (listOpen) { out.push('</' + listOpen + '>'); listOpen = null; }
  }
  function flushQuote() {
    if (!quoteBuf.length) return;
    out.push('<blockquote>' + quoteBuf.map(function (l) { return '<p>' + inlineMd(l) + '</p>'; }).join('') + '</blockquote>');
    quoteBuf = [];
  }
  function flushTable() {
    if (!tableBuf.length) return;
    const rows = tableBuf.map(function (r) {
      return r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim(); });
    });
    let sepIdx = -1;
    for (let i = 0; i < rows.length; i++) {
      if (rows[i].length && rows[i].every(function (c) { return /^:?-{2,}:?$/.test(c); })) { sepIdx = i; break; }
    }
    let html = '';
    if (sepIdx === 1) {
      html += '<thead><tr>' + rows[0].map(function (c) { return '<th>' + inlineMd(c) + '</th>'; }).join('') + '</tr></thead>';
      html += '<tbody>' + rows.slice(2).map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + inlineMd(c) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody>';
    } else {
      html += '<tbody>' + rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + inlineMd(c) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody>';
    }
    out.push('<table>' + html + '</table>');
    tableBuf = [];
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();

    if (/^@@CODE\d+@@$/.test(line)) {
      closeList(); flushQuote(); flushTable();
      out.push(codes[parseInt(line.slice(6, -2), 10)]);
      continue;
    }
    if (!line) { closeList(); flushQuote(); flushTable(); continue; }

    if (/^\|.*\|$/.test(line)) {
      closeList(); flushQuote(); tableBuf.push(line); continue;
    } else if (tableBuf.length) {
      flushTable();
    }

    if (/^(-{3,}|\*{3,})$/.test(line)) {
      closeList(); flushQuote(); out.push('<hr>'); continue;
    }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      closeList(); flushQuote();
      const lv = Math.max(2, Math.min(h[1].length, 4));
      out.push('<h' + lv + '>' + inlineMd(h[2]) + '</h' + lv + '>');
      continue;
    }

    if (/^>\s?/.test(line)) {
      closeList(); quoteBuf.push(line.replace(/^>\s?/, '')); continue;
    }

    const ul = line.match(/^[-*+]\s+(.*)$/);
    const ol = line.match(/^\d+\.\s+(.*)$/);
    if (ul || ol) {
      flushQuote();
      const type = ul ? 'ul' : 'ol';
      if (listOpen !== type) { closeList(); out.push('<' + type + '>'); listOpen = type; }
      out.push('<li>' + inlineMd((ul || ol)[1]) + '</li>');
      continue;
    }

    closeList(); flushQuote();
    out.push('<p>' + inlineMd(line) + '</p>');
  }

  closeList(); flushQuote(); flushTable();
  return out.join('');
}

/* ---------------- 5.5 云端笔记（写作台内容） ---------------- */
let cloudCache = null;
let cloudCacheAt = 0;

async function fetchCloudPosts(force) {
  const fresh = Date.now() - cloudCacheAt < 20000;
  if (cloudCache && fresh && !force) return cloudCache;
  const db = wpDB();
  if (!db) { cloudCache = []; cloudCacheAt = Date.now(); return cloudCache; }
  try {
    const rows = [];
    let cursor;
    for (let i = 0; i < 20; i++) {
      const res = await db.query({
        databaseId: WRITE_DB_ID, pageSize: 200, startCursor: cursor,
        sorts: [{ property: '更新时间', direction: 'descending' }]
      });
      const batch = (res && res.results) || [];
      rows.push.apply(rows, batch);
      const next = res && res.nextCursor;
      if (!res || !res.hasMore || !next || next === cursor || !batch.length) break;
      cursor = next;
    }
    cloudCache = rows.map(function (row) {
      const rec = wpFromRow(row);
      const text = rec.content || '';
      const plain = text.replace(/[#>*`\-\[\]()]/g, '').replace(/\s+/g, ' ').trim();
      const tags = (rec.tags || '').split(/[,，\s]+/).filter(Boolean);
      return {
        id: rec.id,
        title: rec.title || '未命名',
        excerpt: plain.slice(0, 96) || '（还没有内容）',
        date: rec.updated || rec.created || '',
        read: Math.max(1, Math.round(text.replace(/\s/g, '').length / 400)),
        tags: tags.length ? tags : [rec.type],
        content: text,
        kind: rec.type
      };
    });
    cloudCacheAt = Date.now();
    return cloudCache;
  } catch (e) {
    cloudCache = [];
    cloudCacheAt = Date.now();
    return cloudCache;
  }
}

function cloudCardHtml(n) {
  return '<a class="cloud-card" href="#/note/' + escapeHtml(n.id) + '">' +
    '<span class="cc-kind">' + escapeHtml(n.kind) + '</span>' +
    '<b>' + escapeHtml(n.title) + '</b>' +
    '<span class="cc-ex">' + escapeHtml(n.excerpt) + '</span>' +
    '<span class="cc-meta">' + (n.date ? fmtDate(n.date.slice(0, 10)) : '') + ' · ' + n.read + ' 分钟</span>' +
  '</a>';
}

function loadCloudNotes() {
  const box = document.getElementById('cloudNotes');
  if (!box) return;
  fetchCloudPosts(true).then(function (list) {
    const el = document.getElementById('cloudNotes');
    if (!el) return;
    if (!list.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="sec-head" style="margin-top:44px">' +
        '<h2>最近写的</h2><span>' + list.length + ' 条 · 来自写作台</span></div>' +
      '<div class="cloud-grid">' + list.slice(0, 6).map(cloudCardHtml).join('') + '</div>';
  });
}

/* ---------------- 6. 文章详情 ---------------- */
function renderPost(slug) {
  const post = findPost(slug);
  if (!post) { renderNotFound(); return; }
  markRead(slug);

  const list = sortedPosts();
  const idx = list.findIndex(function (p) { return p.slug === slug; });
  const newer = idx > 0 ? list[idx - 1] : null;
  const older = idx < list.length - 1 ? list[idx + 1] : null;

  let rel = relatedPosts(post, 2);
  if (rel.length < 2) {

function buildToc() {
  const prose = document.getElementById('prose');
  const toc = document.getElementById('toc');
  if (!prose || !toc) return;
  const heads = prose.querySelectorAll('h2, h3');
  if (heads.length < 2) { toc.style.display = 'none'; return; }

  let html = '<h5>目录</h5>';
  for (let i = 0; i < heads.length; i++) {
    const el = heads[i];
    const id = 'sec-' + i;
    el.id = id;
    const isH3 = el.tagName === 'H3';
    html += '<a class="' + (isH3 ? 'lv3' : '') + '" href="#/post/' + currentSlug() + '?s=' + id +
      '" data-target="' + id + '">' + escapeHtml(el.textContent) + '</a>';
  }
  toc.innerHTML = html;

  toc.addEventListener('click', function (e) {
    const a = e.target.closest('a[data-target]');
    if (!a) return;
    e.preventDefault();
    const target = document.getElementById(a.getAttribute('data-target'));
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

/* 阅读偏好应用 */
function applyReading() {
  const prose = document.getElementById('prose');
  if (!prose) return;
  const pref = getPref();
  const mobile = window.innerWidth <= 720;
  const sizes = mobile ? [15.5, 16.5, 18] : [15.5, 16.5, 18.5];
  prose.style.fontSize = sizes[pref.size] + 'px';
  prose.style.lineHeight = String(pref.lh === 0 ? 1.92 : 2.16);

  const sizeLabel = document.getElementById('rtSize');
  if (sizeLabel) sizeLabel.textContent = ['小', '标准', '大'][pref.size];
  const lhBtn = document.getElementById('rtLh');
  if (lhBtn) lhBtn.textContent = '行距 · ' + (pref.lh === 0 ? '标准' : '宽松');
  const down = document.querySelector('[data-act="size-down"]');
  const up = document.querySelector('[data-act="size-up"]');
  if (down) down.disabled = pref.size === 0;
  if (up) up.disabled = pref.size === 2;
}

function bindReaderTools() {
  const box = document.getElementById('readerTools');
  if (!box) return;
  box.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-act]');
    if (!btn || btn.disabled) return;
    const pref = getPref();
    const act = btn.getAttribute('data-act');
    if (act === 'size-down') pref.size = Math.max(0, pref.size - 1);
    else if (act === 'size-up') pref.size = Math.min(2, pref.size + 1);
    else if (act === 'lh-toggle') pref.lh = pref.lh === 0 ? 1 : 0;
    savePref(pref);
    applyReading();
  });
}

function bindResumeBar(post, ratio) {
  const bar = document.getElementById('resumeBar');
  if (!bar) return;
  bar.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    if (btn.getAttribute('data-act') === 'resume') {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo({ top: Math.max(0, ratio * max), behavior: 'smooth' });
    } else {
      bar.remove();
    }
  });
}

function saveCurrentPos() {
  const prose = document.getElementById('prose');
  if (!prose) return;
  const slug = currentSlug();
  if (!slug) return;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  if (max <= 0) return;
  const ratio = Math.min(Math.max(window.scrollY / max, 0), 1);
  if (ratio < 0.02) return;
  saveStoredPos(slug, ratio);
}

/* 代码块复制 */
function bindCopyButtons() {
  const pres = document.querySelectorAll('.prose pre');
  for (let i = 0; i < pres.length; i++) {
    const pre = pres[i];
    if (pre.querySelector('.copy-btn')) continue;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    btn.addEventListener('click', function () {
      const code = pre.querySelector('code');
      copyText(code ? code.innerText : '', btn);
    });
    pre.appendChild(btn);
  }
}

function copyText(text, btn) {
  const done = function () {
    btn.textContent = '已复制';
    btn.classList.add('done');
    setTimeout(function () { btn.textContent = '复制'; btn.classList.remove('done'); }, 1800);
  };
  const fail = function () {
    btn.textContent = '请手动选择';
    setTimeout(function () { btn.textContent = '复制'; }, 2200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done)['catch'](function () { legacyCopy(text, done, fail); });
  } else {
    legacyCopy(text, done, fail);
  }
}

function legacyCopy(text, done, fail) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) done(); else fail();
  } catch (e) { fail(); }
}

  }

/* ---------------- 7.5 归档页 ---------------- */
function monthsSpan(posts) {
  if (!posts.length) return 0;
  const times = posts.map(function (p) { return new Date(p.date + 'T00:00:00').getTime(); });
  const min = new Date(Math.min.apply(null, times));
  const max = new Date(Math.max.apply(null, times));
  return (max.getFullYear() - min.getFullYear()) * 12 + (max.getMonth() - min.getMonth()) + 1;
}

function renderArchive() {
  const posts = sortedPosts();
  const groups = {};
  posts.forEach(function (p) {
    const y = p.date.slice(0, 4);
    const m = p.date.slice(5, 7);
    if (!groups[y]) groups[y] = {};
    if (!groups[y][m]) groups[y][m] = [];
    groups[y][m].push(p);
  });
  const years = Object.keys(groups).sort().reverse();

  let body = '';
  years.forEach(function (y) {
    const months = Object.keys(groups[y]).sort().reverse();
    let count = 0;
    months.forEach(function (m) { count += groups[y][m].length; });
    body += '<div class="ar-year"><h2>' + y + '</h2><span>' + count + ' 篇</span></div>';
    months.forEach(function (m) {
      body += '<div class="ar-month"><div class="ar-mlabel"><b>' + m + '</b>月</div><div class="ar-list">';
      groups[y][m].forEach(function (p) {
        body += '<a class="ar-item" href="#/post/' + p.slug + '">' +
          '<time>' + p.date.slice(5).replace('-', ' / ') + '</time>' +
          '<b>' + escapeHtml(p.title) + '</b>' +
          '<span>' + p.read + ' 分钟</span></a>';
      });
      body += '</div></div>';
    });
  });

  app.innerHTML = '<div class="view">' +
    '<div class="page-head"><div class="kicker">Archive</div><h1>全部文章</h1>' +
    '<p>共 ' + posts.length + ' 篇，跨度 ' + monthsSpan(posts) + ' 个月。按时间倒序，慢慢往下翻。</p></div>' +
    '<div class="archive">' + body + '</div>' +
  '</div>';
}

/* ---------------- 8.5 书架：本地书库（IndexedDB） ---------------- */
const BOOK_DB = 'halfpage_reader_db';
const POS_BOOK_KEY = 'wb_halfpage_book_pos';
const READER_PREF_KEY = 'wb_halfpage_reader_pref';
let bookDBPromise = null;

function openBookDB() {
  if (bookDBPromise) return bookDBPromise;
  bookDBPromise = new Promise(function (resolve, reject) {
    if (!window.indexedDB) { reject(new Error('no-idb')); return; }
    const req = indexedDB.open(BOOK_DB, 2);
    req.onupgradeneeded = function (e) {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('texts')) db.createObjectStore('texts', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('tracks')) db.createObjectStore('tracks', { keyPath: 'id' });
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error || new Error('idb-open-failed')); };
  });
  return bookDBPromise;
}

function txStore(db, names, mode) {
  const tx = db.transaction(names, mode);
  return { tx: tx, stores: names.map(function (n) { return tx.objectStore(n); }) };
}

async function dbSaveBook(meta, text) {
  const db = await openBookDB();
  return new Promise(function (resolve, reject) {
    const t = txStore(db, ['meta', 'texts'], 'readwrite');
    t.stores[0].put(meta);
    t.stores[1].put({ id: meta.id, content: text });
    t.tx.oncomplete = function () { resolve(true); };
    t.tx.onerror = function () { reject(t.tx.error); };
  });
}

async function dbAllMeta() {
  const db = await openBookDB();
  return new Promise(function (resolve, reject) {
    const t = txStore(db, ['meta'], 'readonly');
    const req = t.stores[0].getAll();
    req.onsuccess = function () {
      const list = req.result || [];
      list.sort(function (a, b) { return (b.lastOpenAt || b.createdAt) - (a.lastOpenAt || a.createdAt); });
      resolve(list);
    };
    req.onerror = function () { reject(req.error); };
  });
}

async function dbGetBook(id) {
  const db = await openBookDB();
  const meta = await new Promise(function (resolve, reject) {
    const t = txStore(db, ['meta'], 'readonly');
    const req = t.stores[0].get(id);
    req.onsuccess = function () { resolve(req.result || null); };
    req.onerror = function () { reject(req.error); };
  });
  if (!meta) return null;
  const text = await new Promise(function (resolve, reject) {
    const t = txStore(db, ['texts'], 'readonly');
    const req = t.stores[0].get(id);
    req.onsuccess = function () { resolve(req.result ? req.result.content : ''); };
    req.onerror = function () { reject(req.error); };
  });
  return { meta: meta, content: text };
}

async function dbDeleteBook(id) {
  const db = await openBookDB();
  return new Promise(function (resolve, reject) {
    const t = txStore(db, ['meta', 'texts'], 'readwrite');
    t.stores[0]['delete'](id);
    t.stores[1]['delete'](id);
    t.tx.oncomplete = function () { resolve(true); };
    t.tx.onerror = function () { reject(t.tx.error); };
  });
}

/* ---------- 文本解码与分章 ---------- */
function decodeText(buf) {
  let text = new TextDecoder('utf-8', { fatal: false }).decode(buf);
  const bad = (text.match(/\uFFFD/g) || []).length;
  if (bad > 8) {
    try { text = new TextDecoder('gb18030').decode(buf); } catch (e) { /* 保留 utf-8 结果 */ }
  }
  return text.replace(/^\uFEFF/, '');
}

function normalizeText(text) {
  return text
    .replace(/\r\n?/g, '\n')
    .replace(/\u3000/g, ' ')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{4,}/g, '\n\n\n')
    .trim();
}

function countWords(text) {
  return text.replace(/\s/g, '').length;
}

function splitChapters(text) {
  const re = /^[ \t]*((?:第[0-9０-９零〇一二三四五六七八九十百千万两]{1,9}[章回节卷篇集部]|序章|序言|楔子|引子|前言|后记|尾声|番外)[^\n]{0,40})[ \t]*$/gm;
  const marks = [];
  let m;
  while ((m = re.exec(text)) !== null) {
    marks.push({ title: m[1].trim(), start: m.index });
  }

  if (!marks.length) {
    const size = 3000;
    for (let i = 0; i < text.length; i += size) {
      marks.push({ title: '第 ' + (marks.length + 1) + ' 节', start: i });
    }
    if (!marks.length) marks.push({ title: '正文', start: 0 });
  } else if (marks[0].start > 0) {
    const pre = text.slice(0, marks[0].start).trim();
    if (pre.length > 30) marks.unshift({ title: '开始', start: 0 });
    else marks[0].start = 0;
  }

  const chapters = marks.map(function (mk, i) {
    const end = i + 1 < marks.length ? marks[i + 1].start : text.length;
    return { title: mk.title, start: mk.start, end: end, words: countWords(text.slice(mk.start, end)) };
  });
  return chapters;
}

function guessMetaFromFile(name, text) {
  const title = name.replace(/\.(txt|md|text)$/i, '').replace(/[【\[（(].*?[】\]）)]/g, '').trim() || '未命名';
  let author = '';
  const m = text.slice(0, 600).match(/作\s*者[：:]\s*([^\n，,]{1,20})/);
  if (m) author = m[1].trim();
  return { title: title.slice(0, 40), author: author };
}

function fmtWords(n) {
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万';
  return String(n);
}

/* ---------- 阅读进度（按书存本地） ---------- */
function getAllBookPos() {
  try {
    const raw = JSON.parse(localStorage.getItem(POS_BOOK_KEY) || '{}');
    return raw && typeof raw === 'object' ? raw : {};
  } catch (e) { return {}; }
}

function getBookPos(id) {
  const all = getAllBookPos();
  const p = all[id];
  return p && typeof p === 'object' ? p : { chapter: 0, page: 0, scroll: 0 };
}

function setBookPos(id, pos) {
  try {
    const all = getAllBookPos();
    all[id] = pos;
    localStorage.setItem(POS_BOOK_KEY, JSON.stringify(all));
  } catch (e) { /* 静默降级 */ }
}

function bindShelfEvents() {
  const input = document.getElementById('fileInput');
  const zone = document.getElementById('uploadZone');
  const pick = document.getElementById('btnPick');
  if (pick && input) pick.addEventListener('click', function () { input.click(); });
  if (input) input.addEventListener('change', function () {
    const files = Array.prototype.slice.call(this.files || []);
    this.value = '';
    if (files.length) importBooks(files);
  });
  if (zone) {
    ['dragenter', 'dragover'].forEach(function (ev) {
      zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.add('drag'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.remove('drag'); });
    });
    zone.addEventListener('drop', function (e) {
      const files = Array.prototype.slice.call(e.dataTransfer.files || []);
      if (files.length) importBooks(files);
    });
    zone.addEventListener('click', function (e) {
      if (e.target.closest('button')) return;
      if (input) input.click();
    });
  }
  const cloudBtn = document.getElementById('btnCloudUp');
  const cloudInput = document.getElementById('cloudInput');
  if (cloudBtn && cloudInput) {
    cloudBtn.addEventListener('click', function () { cloudInput.click(); });
    cloudInput.addEventListener('change', function () {
      const files = Array.prototype.slice.call(this.files || []);
      this.value = '';
      if (files.length) cloudUploadFiles(files);
    });
  }
  const cloudShelf = document.getElementById('cloudShelf');
  if (cloudShelf) cloudShelf.addEventListener('click', function (e) {
    const dl = e.target.closest('[data-dl]');
    if (dl) {
      e.preventDefault();
      cloudDownloadBook(dl.getAttribute('data-dl'), dl);
      return;
    }
    const del = e.target.closest('[data-cdel]');
    if (del) {
      e.preventDefault();
      if (window.confirm('从云端删除这本书？其他设备也将无法下载。')) {
        cloudDeleteBook(del.getAttribute('data-cdel'));
      }
    }
  });

  const grid = document.getElementById('shelfGrid');
  if (grid) grid.addEventListener('click', function (e) {
    const up = e.target.closest('button[data-up]');
    if (up) {
      e.preventDefault();
      cloudUploadLocal(up.getAttribute('data-up'), up);
      return;
    }
    const del = e.target.closest('button[data-del]');
    if (!del) return;
    e.preventDefault();
    const card = del.closest('.book-card');
    const name = card ? card.getAttribute('data-title') : '这本书';
    if (window.confirm('确定从书架移除《' + name + '》吗？原文会一并删除，无法恢复。')) {
      dbDeleteBook(del.getAttribute('data-del')).then(function () { loadShelfBooks(); });
    }
  });
}

async function loadShelfBooks() {
  const grid = document.getElementById('shelfGrid');
  const count = document.getElementById('shelfCount');
  if (!grid) return;
  try {
    const books = await dbAllMeta();
    if (count) count.textContent = books.length ? books.length + ' 本 · 本地存储' : '还没有书';
    if (!books.length) {
      grid.innerHTML = '';
      return;
    }
    const posMap = getAllBookPos();
    grid.innerHTML = books.map(function (b) { return bookCardHtml(b, posMap[b.id]); }).join('');
  } catch (e) {
    grid.innerHTML = '<div class="shelf-empty">当前环境不支持本地书库（可能处于隐私模式或 file:// 直接打开）。<br>请通过在线链接访问后再上传。</div>';
  }
}

function bookCardHtml(b, pos) {
  const h = hashCode(b.title || b.id);
  const hue = 158 + (h % 62);
  const hue2 = 196 + ((h >>> 5) % 56);
  const pct = pos && typeof pos.pct === 'number' ? Math.round(pos.pct * 100) : 0;
  const id = b.id;
  return '<div class="book-card" data-title="' + escapeHtml(b.title) + '">' +
    '<a class="bc-cover" href="#/read/' + id + '" style="--h:' + hue + ';--h2:' + hue2 + '">' +
      '<span class="bc-tag">TXT</span>' +
      '<div class="bc-title">' + escapeHtml(b.title) + '</div>' +
    '</a>' +
    '<div class="bc-body">' +
      '<div class="bc-info"><b>' + fmtWords(b.words) + ' 字</b><span>' + (b.chapters ? b.chapters.length : 0) + ' 章</span></div>' +
      '<div class="bc-progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="bc-info"><span>' + escapeHtml(b.author || '未知作者') + '</span><span>' + (pct > 0 ? '已读 ' + pct + '%' : '未开始') + '</span></div>' +
      '<div class="bc-actions">' +
        '<a href="#/read/' + id + '">' + (pct > 0 ? '继续阅读' : '开始阅读') + '</a>' +
        '<button data-up="' + id + '" title="传到云端" style="flex:0 0 38px">↑云</button>' +
        '<button data-del="' + id + '">移除</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

async function importBooks(files) {
  const grid = document.getElementById('shelfGrid');
  if (grid) grid.innerHTML = '<div class="shelf-empty">正在解析 ' + files.length + ' 个文件，请稍候…</div>';
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (!/\.(txt|md|text)$/i.test(f.name) && f.type.indexOf('text') === -1) continue;
    try {
      const buf = await f.arrayBuffer();
      const text = normalizeText(decodeText(buf));
      if (text.length < 20) continue;
      await saveBookFromText(f.name, text, i);
      ok++;
    } catch (e) { /* 跳过失败文件 */ }
  }
  if (ok === 0) window.alert('没有读到可用的文本文件，请确认是 TXT 或 Markdown。');
  loadShelfBooks();
}

async function saveBookFromText(name, text, seq) {
  const chapters = splitChapters(text);
  const meta = guessMetaFromFile(name, text);
  const book = {
    id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    seq: seq || 0,
    title: meta.title,
    author: meta.author,
    words: countWords(text),
    chars: text.length,
    chapters: chapters,
    createdAt: Date.now() + (seq || 0),
    lastOpenAt: Date.now() + (seq || 0)
  };
  await dbSaveBook(book, text);
  return book;
}

/* ---------- 云端书库 ---------- */
const CLOUD_BOOK_DB = 'IIFXDsvodFAbgS2APYyWP9';

async function loadCloudShelf() {
  const grid = document.getElementById('cloudShelf');
  const count = document.getElementById('cloudShelfCount');
  if (!grid) return;
  const db = wpDB();
  if (!db) {
    grid.innerHTML = '<div class="shelf-empty">云端书库需要登录后使用。在 WorkBuddy 内打开本页即可上传与下载；公开链接为只读。</div>';
    if (count) count.textContent = '未连接';
    return;
  }
  try {
    const rows = [];
    let cursor;
    for (let i = 0; i < 10; i++) {
      const res = await db.query({
        databaseId: CLOUD_BOOK_DB, pageSize: 100, startCursor: cursor,
        sorts: [{ property: '更新时间', direction: 'descending' }]
      });
      const batch = (res && res.results) || [];
      rows.push.apply(rows, batch);
      const next = res && res.nextCursor;
      if (!res || !res.hasMore || !next || next === cursor || !batch.length) break;
      cursor = next;
    }
    if (count) count.textContent = rows.length ? rows.length + ' 本 · 云端' : '还没有云端书';
    if (!rows.length) {
      grid.innerHTML = '<div class="shelf-empty">还没有传到云端的书。本地书卡片上的「↑云」可以上传，上传后其他设备打开就能下载。</div>';
      return;
    }
    grid.innerHTML = rows.map(cloudBookCardHtml).join('');
  } catch (e) {
    grid.innerHTML = '<div class="shelf-empty">云端书库读取失败，请确认已登录后刷新。</div>';
    if (count) count.textContent = '';
  }
}

function cloudBookCardHtml(row) {
  const title = row['书名'] || '未命名';
  const author = row['作者'] || '';
  const words = row['字数'] || 0;
  const chapters = row['章节数'] || 0;
  const att = (row['文件'] && row['文件'][0]) || null;
  const h = hashCode(title);
  const hue = 158 + (h % 62);
  const hue2 = 196 + ((h >>> 5) % 56);
  const size = att && att.fileSize ? (att.fileSize > 1048576
    ? (att.fileSize / 1048576).toFixed(1) + ' MB'
    : Math.max(1, Math.round(att.fileSize / 1024)) + ' KB') : '';
  return '<div class="book-card">' +
    '<div class="bc-cover" style="--h:' + hue + ';--h2:' + hue2 + '">' +
      '<span class="bc-tag">云端</span>' +
      '<div class="bc-title">' + escapeHtml(title) + '</div>' +
    '</div>' +
    '<div class="bc-body">' +
      '<div class="bc-info"><b>' + fmtWords(words) + ' 字</b><span>' + chapters + ' 章</span></div>' +
      '<div class="bc-info"><span>' + escapeHtml(author || '未知作者') + '</span><span>' + size + '</span></div>' +
      '<div class="bc-actions">' +
        '<a href="#" data-dl="' + escapeHtml(row['record_id'] || '') + '" data-att="' + escapeHtml(att ? att.attachmentId : '') + '" data-title="' + escapeHtml(title) + '">下载阅读</a>' +
        '<button data-cdel="' + escapeHtml(row['record_id'] || '') + '">删除</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

async function cloudUploadOne(db, file) {
  const buf = await file.arrayBuffer();
  const text = normalizeText(decodeText(buf));
  const chapters = splitChapters(text);
  const meta = guessMetaFromFile(file.name, text);
  const item = await db.uploadFile({ nodeId: CLOUD_BOOK_DB, file: file });
  await db.addRecord({
    databaseId: CLOUD_BOOK_DB,
    properties: {
      '书名': { text: meta.title },
      '作者': { text: meta.author },
      '文件': { attachment: [item] },
      '字数': { number: countWords(text) },
      '章节数': { number: chapters.length },
      '更新时间': { date: new Date().toISOString() }
    }
  });
}

async function cloudUploadFiles(files) {
  const db = wpDB();
  if (!db) { window.alert('云端上传需要登录：请在 WorkBuddy 内打开本页再试。'); return; }
  const count = document.getElementById('cloudShelfCount');
  let ok = 0;
  let fail = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (!/\.(txt|md|text)$/i.test(f.name) && f.type.indexOf('text') === -1) { fail++; continue; }
    batchUI('cloudBatch', '上传 ' + (i + 1) + '/' + files.length + ' · ' + f.name, i / files.length);
    try {
      await cloudUploadOne(db, f);
      ok++;
    } catch (e) { fail++; }
  }
  await loadCloudShelf();
  if (fail && !ok) window.alert('上传失败，请确认已登录，且文件不超过云端限制。');
}

async function cloudUploadLocal(bookId, btn) {
  const db = wpDB();
  if (!db) { window.alert('云端上传需要登录：请在 WorkBuddy 内打开本页再试。'); return; }
  const data = await dbGetBook(bookId);
  if (!data) return;
  const old = btn.textContent;
  btn.textContent = '上传中';
  btn.disabled = true;
  try {
    const file = new File([data.content], (data.meta.title || 'book') + '.txt', { type: 'text/plain' });
    await cloudUploadOne(db, file);
    btn.textContent = '已上传';
    loadCloudShelf();
    setTimeout(function () { btn.textContent = old; btn.disabled = false; }, 1800);
  } catch (e) {
    btn.textContent = old;
    btn.disabled = false;
    window.alert('上传失败，请确认已登录，且文件不超过云端限制。');
  }
}

async function cloudDownloadBook(recordId, btn) {
  const db = wpDB();
  if (!db) { window.alert('下载需要登录：请在 WorkBuddy 内打开本页。'); return; }
  const attId = btn.getAttribute('data-att');
  const title = btn.getAttribute('data-title') || 'book';
  if (!attId) { window.alert('这个附件读不到，可能已损坏。'); return; }
  const old = btn.textContent;
  btn.textContent = '下载中…';
  try {
    const r = await db.getDownloadUrl({ nodeId: CLOUD_BOOK_DB, attachmentId: attId });
    const resp = await fetch(r.downloadUrl);
    const buf = await resp.arrayBuffer();
    const text = normalizeText(decodeText(buf));
    if (text.length < 20) throw new Error('empty');
    const book = await saveBookFromText(title + '.txt', text, 0);
    btn.textContent = old;
    location.hash = '#/read/' + book.id;
  } catch (e) {
    btn.textContent = old;
    window.alert('下载失败，请重试。');
  }
}

async function cloudDeleteBook(id) {
  const db = wpDB();
  if (!db) return;
  try {
    await db.deleteRecord({ databaseId: CLOUD_BOOK_DB, recordId: id });
    loadCloudShelf();
  } catch (e) { window.alert('删除失败'); }
}

function getReaderPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(READER_PREF_KEY) || '{}');
    return {
      theme: ['ink', 'paper', 'green', 'black'].indexOf(p.theme) > -1 ? p.theme : 'ink',
      size: typeof p.size === 'number' ? Math.max(15, Math.min(26, p.size)) : 19,
      lh: typeof p.lh === 'number' ? Math.max(1.5, Math.min(2.6, p.lh)) : 2,
      mode: p.mode === 'page' ? 'page' : 'scroll',
      width: p.width === 620 ? 620 : (p.width === 860 ? 860 : 720)
    };
  } catch (e) {
    return { theme: 'ink', size: 19, lh: 2, mode: 'scroll', width: 720 };
  }
}

function saveReaderPrefs() {
  try { localStorage.setItem(READER_PREF_KEY, JSON.stringify(reader.prefs)); } catch (e) { /* 静默降级 */ }

async function renderReader(id) {
  document.body.classList.add('reading');

    '<div style="font-family:var(--sans);font-size:13px;color:#8b9aab">正在打开书页…</div></div>';

      '<a href="#/shelf" style="display:inline-block;padding:10px 22px;border-radius:9px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);font-size:13.5px">回到书架</a>' +

  reader.pageCache = {};
  reader.pagesData = [];
  reader.prefix = [];
  let acc = 0;
  data.meta.chapters.forEach(function (c) { reader.prefix.push(acc); acc += c.words; });

  const pos = getBookPos(id);
  reader.chapter = Math.min(pos.chapter || 0, data.meta.chapters.length - 1);

function applyReaderPrefs(reflow) {
  const root = document.getElementById('reader');
  if (!root) return;
  const p = reader.prefs;
  root.setAttribute('data-theme', p.theme);
  root.style.setProperty('--r-size', p.size + 'px');
  root.style.setProperty('--r-lh', String(p.lh));
  root.style.setProperty('--r-width', p.width + 'px');

  const themeDots = root.querySelectorAll('.theme-dot');
  for (let i = 0; i < themeDots.length; i++) {
    themeDots[i].classList.toggle('on', themeDots[i].getAttribute('data-theme') === p.theme);
  }
  const sizeVal = document.getElementById('sizeVal');
  if (sizeVal) sizeVal.textContent = p.size + ' px';
  const lhBtns = root.querySelectorAll('[data-lh]');
  for (let i = 0; i < lhBtns.length; i++) {
    const v = parseFloat(lhBtns[i].getAttribute('data-lh'));
    lhBtns[i].classList.toggle('on', (v < 1.85 && p.lh < 1.85) || (v >= 1.85 && v < 2.15 && p.lh >= 1.85 && p.lh < 2.15) || (v >= 2.15 && p.lh >= 2.15));
  }
  const modeBtns = root.querySelectorAll('[data-mode]');
  for (let i = 0; i < modeBtns.length; i++) {
    modeBtns[i].classList.toggle('on', modeBtns[i].getAttribute('data-mode') === reader.mode);
  }
  const widthBtns = root.querySelectorAll('[data-width]');
  for (let i = 0; i < widthBtns.length; i++) {
    widthBtns[i].classList.toggle('on', parseInt(widthBtns[i].getAttribute('data-width'), 10) === p.width);
  }

  if (reflow) {
    reader.pageCache = {};
    if (reader.mode === 'page') relayoutBook();
  }
}

function relayoutBook() {
  if (reader.mode !== 'page' || !reader.book) return;
  const oldPages = reader.pagesData || [];
  let before = 0;
  for (let i = 0; i < reader.page; i++) before += (oldPages[i] ? oldPages[i].chars : 0);
  const cw = reader.book.chapters[reader.chapter].words || 1;
  const ratio = Math.min(1, before / cw);

  reader.pageCache = {};
  sizeBook();
  const pages = ensurePages(reader.chapter);
  let acc = 0;
  let target = 0;
  for (let i = 0; i < pages.length; i++) {
    if (acc >= ratio * cw - 1) { target = i; break; }
    acc += pages[i].chars;
    target = i;
  }
  showBookPage(reader.chapter, target);
}

function stripMetaLines(text, title) {
  const lines = text.split('\n');
  let removedTitle = false;
  let started = false;
  for (let i = 0; i < Math.min(lines.length, 8); i++) {
    const t = lines[i].trim();
    if (!t) continue;
    if (/^(书\s*名|作\s*者|简\s*介|内容简介|声\s*明|标\s*签|出\s*处|来\s*源)[：:]/.test(t)) {
      lines[i] = '';
      continue;
    }
    const compact = t.replace(/\s/g, '');
    const ct = title.replace(/\s/g, '');
    if (!removedTitle && compact === ct) {
      lines[i] = '';
      removedTitle = true;
      continue;
    }
    if (!removedTitle && compact.length < 36 && (compact.indexOf(ct) > -1 || ct.indexOf(compact) > -1)) {
      lines[i] = '';
      removedTitle = true;
      continue;
    }
    started = true;
    break;
  }
  return lines.join('\n');
}

function stripTitleLine(raw, title) {
  const lines = raw.split('\n');
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if (i < lines.length) {
    const first = lines[i].trim().replace(/\s/g, '');
    const t = title.replace(/\s/g, '');
    if (first === t || (first.length < 30 && (first.indexOf(t) > -1 || t.indexOf(first) > -1))) i++;
  }
  return lines.slice(i).join('\n');
}

function bodyToParagraphs(text) {
  const lines = text.split('\n').map(function (l) { return l.replace(/^[\s]+|[\s]+$/g, ''); });
  const nonEmpty = lines.filter(function (l) { return l.length > 0; });
  if (!nonEmpty.length) return [];
  const avg = nonEmpty.join('').length / nonEmpty.length;
  if (avg < 26 && nonEmpty.length > 6) {
    return text.split(/\n\s*\n/).map(function (block) {
      return block.replace(/\n/g, '').replace(/\s+/g, ' ').trim();
    }).filter(function (s) { return s.length > 0; });
  }
  return nonEmpty;
}

function loadChapter(idx, opt) {
  opt = opt || {};
  const b = reader.book;
  if (!b) return;
  idx = Math.max(0, Math.min(b.chapters.length - 1, idx));
  reader.chapter = idx;

  const scrollEl = document.getElementById('rScroll');
  const wrapEl = document.getElementById('rPageWrap');
  if (!scrollEl || !wrapEl) return;
  const isPage = reader.mode === 'page';
  scrollEl.style.display = isPage ? 'none' : 'block';
  wrapEl.style.display = isPage ? 'block' : 'none';

  const chapName = document.getElementById('rChapName');
  if (chapName) chapName.textContent = b.chapters[idx].title;

  if (isPage) {
    sizeBook();
    const pages = ensurePages(idx);
    reader.pagesData = pages;
    reader.pages = pages.length;
    let targetPage = 0;
    if (opt.pageLast) targetPage = pages.length - 1;
    else if (typeof opt.page === 'number' && opt.page > 0) targetPage = opt.page;
    else if (typeof opt.ratio === 'number') targetPage = Math.floor(opt.ratio * pages.length);
    showBookPage(idx, targetPage);
    updateTocActive();
    return;
  }

  const ch = b.chapters[idx];
  const bodyText = stripMetaLines(stripTitleLine(reader.content.slice(ch.start, ch.end), ch.title), ch.title);
  const paras = bodyToParagraphs(bodyText);
  let html = '<span class="ch-title">' + escapeHtml(ch.title) + '</span>';
  html += paras.map(function (t) { return '<p>' + escapeHtml(t) + '</p>'; }).join('');
  html += '<div class="r-next"><button data-act="next-ch">' +
    (idx < b.chapters.length - 1 ? '下一章' : '读完了，回书架') + '</button></div>';

  const target = document.getElementById('rText');
  if (target) target.innerHTML = html;
  const sc = document.getElementById('rScroll');
  if (sc) sc.scrollTop = 0;
  updateTocActive();
  updateProgressUI();
  scheduleSavePos();

  const ratio = typeof opt.scroll === 'number' ? opt.scroll : 0;
  requestAnimationFrame(function () {
    if (!sc) return;
    const max = sc.scrollHeight - sc.clientHeight;
    sc.scrollTop = Math.max(0, ratio * max);
    updateProgressUI();
  });
}

/* ---------- 书本分页 ---------- */
function sizeBook() {
  const stage = document.getElementById('bkStage');
  const book = document.getElementById('bkBook');
  const wrap = document.getElementById('rPageWrap');
  if (!stage || !book) return;

  const wide = window.innerWidth >= 1024;
  const pw = (reader.prefs && reader.prefs.width) || 720;
  const wantMax = wide ? (pw === 620 ? 1140 : (pw === 860 ? 1440 : 1300)) : 760;
  if (wrap && wrap.style.maxWidth !== wantMax + 'px') wrap.style.maxWidth = wantMax + 'px';

  const availW = stage.clientWidth;
  const dual = wide && availW >= 860;
  reader.dual = dual;
  const W = dual
    ? Math.max(230, Math.floor((availW - 26) / 2))
    : Math.max(260, Math.min(availW - 8, 680));
  const H = Math.max(240, stage.clientHeight - 6);

  book.style.width = (dual ? W * 2 : W) + 'px';
  book.style.height = H + 'px';
  book.classList.toggle('bk-dual', dual);

  ['bkLeft', 'bkRight', 'bkFlip'].forEach(function (id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.width = W + 'px';
    el.style.height = H + 'px';
    el.style.left = (id === 'bkLeft' ? 0 : (dual ? W : 0)) + 'px';
  });
  const leftEl = document.getElementById('bkLeft');
  if (leftEl) leftEl.style.display = dual ? 'block' : 'none';

  const measure = document.getElementById('bkMeasure');
  if (measure) {
    measure.style.width = W + 'px';
    measure.style.height = H + 'px';
    measure.style.inset = '0 auto auto 0';
  }

  if (reader.pageW && (Math.abs(reader.pageW - W) > 1 || Math.abs(reader.pageH - H) > 1)) {
    reader.pageCache = {};
  }
  reader.pageW = W;
  reader.pageH = H;
}

function ensurePages(chIdx) {
  if (!reader.pageCache) reader.pageCache = {};
  if (reader.pageCache[chIdx]) return reader.pageCache[chIdx];

  const b = reader.book;
  const ch = b.chapters[chIdx];
  const raw = reader.content.slice(ch.start, ch.end);
  const text = stripMetaLines(stripTitleLine(raw, ch.title), ch.title);
  const paras = bodyToParagraphs(text);

  const m = document.getElementById('bkMeasure');
  const body = m ? m.querySelector('.bk-body') : null;
  if (!body) {
    return [{ paras: paras, chars: paras.join('').length, first: true, title: ch.title }];
  }

  const pages = [];
  const rest = paras.slice();
  let first = true;

  while (rest.length) {
    body.innerHTML = '';
    if (first) {
      const t = document.createElement('span');
      t.className = 'ch-title';
      t.textContent = ch.title;
      body.appendChild(t);
    }

    let fit = 0;
    for (let i = 0; i < rest.length; i++) {
      const pEl = document.createElement('p');
      pEl.textContent = rest[i];
      body.appendChild(pEl);
      if (body.scrollHeight > body.clientHeight + 1) {
        body.removeChild(pEl);
        break;
      }
      fit = i + 1;
    }

    if (fit === 0) {
      const pEl = document.createElement('p');
      body.appendChild(pEl);
      let lo = 1, hi = rest[0].length, best = 0;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        pEl.textContent = rest[0].slice(0, mid);
        if (body.scrollHeight <= body.clientHeight + 1) { best = mid; lo = mid + 1; }
        else hi = mid - 1;
      }
      const take = Math.max(1, best);
      const chunk = rest[0].slice(0, take);
      rest[0] = rest[0].slice(take);
      if (!rest[0]) rest.shift();
      pages.push({ paras: [chunk], chars: chunk.length, first: first, title: ch.title });
      first = false;
      continue;
    }

    const slice = rest.slice(0, fit);
    pages.push({ paras: slice, chars: slice.join('').length, first: first, title: ch.title });
    rest.splice(0, fit);
    first = false;
  }

  if (!pages.length) pages.push({ paras: [], chars: 0, first: true, title: ch.title });
  reader.pageCache[chIdx] = pages;
  return pages;
}

function sheetHtml(page, no, total) {
  return '<div class="bk-sheet">' +
    '<div class="bk-head"><span>' + escapeHtml(page.title) + '</span></div>' +
    '<div class="bk-body r-text">' +
      (page.first ? '<span class="ch-title">' + escapeHtml(page.title) + '</span>' : '') +
      page.paras.map(function (t) { return '<p>' + escapeHtml(t) + '</p>'; }).join('') +
    '</div>' +
    '<div class="bk-foot">' + no + ' / ' + total + '</div>' +
  '</div>';
}

function fillPage(el, page, no, total, backPage, backNo) {
  if (!el) return;
  const backHtml = backPage
    ? '<div class="bk-back-sheet">' + sheetHtml(backPage, backNo || no, total) + '</div>'
    : '';
  el.innerHTML = '<div class="bk-face bk-front">' + sheetHtml(page, no, total) + '</div>' +
    '<div class="bk-face bk-back"' + (backPage ? '' : ' style="display:none"') + '>' + backHtml + '</div>';
  el.style.transform = 'rotateY(0deg)';
  el.style.setProperty('--shade', '0');
  el.style.setProperty('--bshade', '0');
}

function fillCover(el) {
  if (!el) return;
  const b = reader.book || { title: '', author: '', chapters: [], words: 0 };
  el.innerHTML = '<div class="bk-face bk-front"><div class="bk-cover-page">' +
      '<div class="bc-brand">半 页</div>' +
      '<div class="bc-book">' + escapeHtml(b.title || '未命名') + '</div>' +
      '<div class="bc-by">' + escapeHtml(b.author || '佚名') + '</div>' +
      '<div class="bc-line"></div>' +
      '<div class="bc-meta">' + (b.chapters ? b.chapters.length : 0) + ' 章 · 约 ' + fmtWords(b.words || 0) + ' 字</div>' +
      '<div class="bc-tip">点击右页或按 → 开始阅读</div>' +
    '</div></div>' +
    '<div class="bk-face bk-back" style="display:none"></div>';
  el.style.transform = 'rotateY(0deg)';
  el.style.setProperty('--shade', '0');
  el.style.setProperty('--bshade', '0');
}

function setFlipAngle(el, deg) {
  if (!el) return;
  el.style.transform = 'rotateY(' + deg.toFixed(2) + 'deg)';
  const back = Math.abs(deg) > 78;
  const front = el.querySelector('.bk-front');
  const backEl = el.querySelector('.bk-back');
  if (front) front.style.display = back ? 'none' : 'block';
  if (backEl) backEl.style.display = back ? 'block' : 'none';
  const p = Math.min(1, Math.abs(deg) / 180);
  el.style.setProperty('--shade', (p * 0.95).toFixed(3));
  el.style.setProperty('--bshade', (Math.max(0, 0.42 - p * 0.42)).toFixed(3));
}

function animateFlip(el, from, to, dur, done) {
  const t0 = performance.now();
  function step(t) {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    setFlipAngle(el, from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
    else if (done) done();
  }
  requestAnimationFrame(step);
}

function showBookPage(chIdx, pageIdx) {
  sizeBook();
  const pages = ensurePages(chIdx);
  reader.chapter = chIdx;
  reader.pagesData = pages;
  reader.pages = pages.length;
  reader.page = Math.max(0, Math.min(pageIdx, pages.length - 1));

  const leftEl = document.getElementById('bkLeft');
  const rightEl = document.getElementById('bkRight');
  const flip = document.getElementById('bkFlip');
  if (!rightEl || !flip) return;

  fillPage(rightEl, pages[reader.page], reader.page + 1, pages.length);
  if (reader.dual && leftEl) {
    const li = reader.page - 1;
    if (li >= 0) fillPage(leftEl, pages[li], li + 1, pages.length);
    else fillCover(leftEl);
  }

  flip.style.display = 'none';
  flip.style.transition = 'none';
  flip.style.transform = 'rotateY(0deg)';
  flip.style.opacity = '1';
  requestAnimationFrame(function () { if (flip) flip.style.transition = ''; });

  updateChapterMeta();
  updateProgressUI();
  scheduleSavePos();
}

function resolvePage(dir) {
  const b = reader.book;
  if (!b) return null;
  if (dir > 0) {
    if (reader.page < reader.pages - 1) return { chapter: reader.chapter, page: reader.page + 1 };
    if (reader.chapter < b.chapters.length - 1) return { chapter: reader.chapter + 1, page: 0 };
    return null;
  }
  if (reader.page > 0) return { chapter: reader.chapter, page: reader.page - 1 };
  if (reader.chapter > 0) {
    const prev = ensurePages(reader.chapter - 1);
    return { chapter: reader.chapter - 1, page: prev.length - 1 };
  }
  return null;
}

/* 翻页完成后整理左右页 */
function settleSpread(dir, target, tPages, prevPages, prevIdx, prevTotal) {
  const leftEl = document.getElementById('bkLeft');
  if (!reader.dual || !leftEl) return;
  if (dir > 0) {
    if (prevPages && prevPages[prevIdx]) fillPage(leftEl, prevPages[prevIdx], prevIdx + 1, prevTotal);
    else fillCover(leftEl);
  } else {
    const li = target.page - 1;
    if (li >= 0) fillPage(leftEl, tPages[li], li + 1, tPages.length);
    else fillCover(leftEl);
  }
}

let flipping = false;

function flipPage(dir) {
  if (reader.mode !== 'page') return;
  if (flipping) return;
  const target = resolvePage(dir);
  if (!target) { readerToast(dir > 0 ? '已经是最后一页了' : '已经是开头了'); return; }

  const leftEl = document.getElementById('bkLeft');
  const rightEl = document.getElementById('bkRight');
  const flip = document.getElementById('bkFlip');
  if (!rightEl || !flip) return;

  const tPages = ensurePages(target.chapter);
  const tPage = tPages[target.page];
  const prevPages = reader.pagesData;
  const prevIdx = reader.page;
  const prevTotal = reader.pages;
  const curPage = prevPages[prevIdx];

  flipping = true;
  flip.style.display = 'block';

  if (dir > 0) {
    fillPage(rightEl, tPage, target.page + 1, tPages.length);
    fillPage(flip, curPage, prevIdx + 1, prevTotal, curPage, prevIdx + 1);
    setFlipAngle(flip, 0);
    animateFlip(flip, 0, -180, 680, finish);
  } else {
    if (reader.dual && leftEl) {
      const li = target.page - 1;
      if (li >= 0) fillPage(leftEl, tPages[li], li + 1, tPages.length);
      else fillCover(leftEl);
    }
    fillPage(rightEl, tPage, target.page + 1, tPages.length);
    fillPage(flip, tPage, target.page + 1, tPages.length, tPage, target.page + 1);
    setFlipAngle(flip, -180);
    animateFlip(flip, -180, 0, 680, finish);
  }

  function finish() {
    flipping = false;
    reader.chapter = target.chapter;
    reader.pagesData = tPages;
    reader.pages = tPages.length;
    reader.page = target.page;

    fillPage(rightEl, tPage, target.page + 1, tPages.length);
    settleSpread(dir, target, tPages, prevPages, prevIdx, prevTotal);

    flip.style.display = 'none';
    setFlipAngle(flip, 0);
    flip.style.display = 'none';

    updateChapterMeta();
    updateTocActive();
    updateProgressUI();
    scheduleSavePos();
  }
}

/* ---------- 跟手拖拽 ---------- */
let dragState = null;

function bindPageDrag() {
  const stage = document.getElementById('bkStage');
  if (!stage) return;

  stage.addEventListener('pointerdown', function (e) {
    if (reader.mode !== 'page' || flipping) return;
    if (e.pointerType === 'mouse') {
      if (e.button !== 0) return;
      const r = stage.getBoundingClientRect();
      const x = e.clientX - r.left;
      if (x > r.width * 0.3 && x < r.width * 0.7) return;
    }
    dragState = { x0: e.clientX, p: 0, dir: 0, ready: false, target: null, dx: 0, angle: 0 };
    reader.suppressClick = false;
    if (stage.setPointerCapture) {
      try { stage.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    }
  });

  stage.addEventListener('pointermove', function (e) {
    const d = dragState;
    if (!d) return;
    const flip = document.getElementById('bkFlip');
    const rightEl = document.getElementById('bkRight');
    const leftEl = document.getElementById('bkLeft');
    if (!flip || !rightEl) return;
    const dx = e.clientX - d.x0;
    d.dx = dx;

    if (!d.ready) {
      if (Math.abs(dx) < 16) return;
      d.dir = dx < 0 ? 1 : -1;
      const t = resolvePage(d.dir);
      if (!t) { dragState = null; return; }
      d.target = t;
      const tPages = ensurePages(t.chapter);
      d.tPages = tPages;
      d.prevPages = reader.pagesData;
      d.prevIdx = reader.page;
      d.prevTotal = reader.pages;

      if (d.dir > 0) {
        fillPage(rightEl, tPages[t.page], t.page + 1, tPages.length);
        fillPage(flip, reader.pagesData[reader.page], reader.page + 1, reader.pages,
          reader.pagesData[reader.page], reader.page + 1);
        setFlipAngle(flip, 0);
      } else {
        if (reader.dual && leftEl) {
          const li = t.page - 1;
          if (li >= 0) fillPage(leftEl, tPages[li], li + 1, tPages.length);
          else fillCover(leftEl);
        }
        fillPage(rightEl, tPages[t.page], t.page + 1, tPages.length);
        fillPage(flip, tPages[t.page], t.page + 1, tPages.length, tPages[t.page], t.page + 1);
        setFlipAngle(flip, -180);
      }
      flip.style.display = 'block';
      d.ready = true;
    }

    const w = reader.pageW || 620;
    d.p = Math.min(1, Math.abs(dx) / w);
    d.angle = d.dir > 0 ? -180 * d.p : -180 + 180 * d.p;
    setFlipAngle(flip, d.angle);
  });

  const endDrag = function () {
    const d = dragState;
    dragState = null;
    if (!d || !d.ready) return;

    const flip = document.getElementById('bkFlip');
    const rightEl = document.getElementById('bkRight');
    if (!flip || !rightEl) return;

    const complete = d.p > 0.3;
    if (d.p > 0.02) {
      reader.suppressClick = true;
      setTimeout(function () { reader.suppressClick = false; }, 160);
    }

    flipping = true;
    const endAngle = complete ? (d.dir > 0 ? -180 : 0) : (d.dir > 0 ? 0 : -180);
    const dur = 420;

    animateFlip(flip, d.angle, endAngle, dur, function () {
      flipping = false;
      if (complete) {
        reader.chapter = d.target.chapter;
        reader.pagesData = d.tPages;
        reader.pages = d.tPages.length;
        reader.page = d.target.page;
        fillPage(rightEl, d.tPages[d.target.page], d.target.page + 1, d.tPages.length);
        settleSpread(d.dir, d.target, d.tPages, d.prevPages, d.prevIdx, d.prevTotal);
        updateChapterMeta();
        updateTocActive();
      } else {
        fillPage(rightEl, reader.pagesData[reader.page], reader.page + 1, reader.pages);
        const leftEl = document.getElementById('bkLeft');
        const li = reader.page - 1;
        if (reader.dual && leftEl) {
          if (li >= 0) fillPage(leftEl, reader.pagesData[li], li + 1, reader.pages);
          else fillCover(leftEl);
        }
      }
      setFlipAngle(flip, 0);
      flip.style.display = 'none';
      updateProgressUI();
      scheduleSavePos();
    });
  };

  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('pointerleave', function (e) {
    if (dragState && e.pointerType === 'mouse') endDrag();
  });
}

function layoutPages() {
  sizeBook();
}

function goPage(i, animate) {
  if (reader.mode !== 'page') return;
  showBookPage(reader.chapter, i);
}

function nextPage() {
  if (reader.mode !== 'page') { nextChapter(); return; }
  flipPage(1);
}

function prevPage() {
  if (reader.mode !== 'page') { prevChapter(); return; }
  flipPage(-1);
}

function nextChapter() {
  if (reader.chapter < reader.book.chapters.length - 1) loadChapter(reader.chapter + 1, { page: 0 });
  else readerToast('已经是最后一章');
}

function prevChapter() {
  if (reader.chapter > 0) loadChapter(reader.chapter - 1, { page: 0 });
  else readerToast('已经是第一章');
}

function updateChapterMeta() {
  if (!reader.book) return;
  const ch = reader.book.chapters[reader.chapter];
  const nameEl = document.getElementById('rChapName');
  if (nameEl && ch) nameEl.textContent = ch.title;
}

function scrollRatio() {
  const sc = document.getElementById('rScroll');
  if (!sc) return 0;
  const max = sc.scrollHeight - sc.clientHeight;
  return max > 0 ? Math.min(1, Math.max(0, sc.scrollTop / max)) : 0;
}

function overallRatio() {
  const b = reader.book;
  if (!b) return 0;
  const total = b.words || 1;
  const before = reader.prefix[reader.chapter] || 0;
  const cw = b.chapters[reader.chapter].words || 1;
  let inner = 0;
  if (reader.mode === 'page') {
    const pages = reader.pagesData || [];
    let chBefore = 0;
    for (let i = 0; i < reader.page; i++) chBefore += (pages[i] ? pages[i].chars : 0);
    const curChars = pages[reader.page] ? pages[reader.page].chars : 0;
    inner = Math.min(1, (chBefore + curChars * 0.5) / cw);
  } else {
    inner = scrollRatio();
  }
  return Math.min(1, Math.max(0, (before + inner * cw) / total));
}

function fmtRemain(mins) {
  if (mins <= 1) return '快读完了';
  if (mins < 60) return '剩 ' + Math.round(mins) + ' 分钟';
  const h = Math.floor(mins / 60);
  const m = Math.round(mins % 60);
  return '剩 ' + h + ' 小时' + (m ? ' ' + m + ' 分' : '');
}

function updateProgressUI() {
  if (!reader.book) return;
  const r = overallRatio();
  const slider = document.getElementById('rSlider');
  if (slider && document.activeElement !== slider) slider.value = String(Math.round(r * 1000));
  const pct = document.getElementById('rPctMeta');
  if (pct) pct.textContent = Math.round(r * 100) + '%';
  const chapMeta = document.getElementById('rChapMeta');
  if (chapMeta) {
    chapMeta.textContent = '第 ' + (reader.chapter + 1) + ' / ' + reader.book.chapters.length + ' 章' +
      (reader.mode === 'page' ? ' · ' + (reader.page + 1) + '/' + reader.pages + ' 页' : '');
  }
  const left = document.getElementById('rLeftMeta');
  if (left) left.textContent = fmtRemain((1 - r) * (reader.book.words || 0) / 400);
}

function updateTocActive() {
  const list = document.getElementById('rTocList');
  if (!list) return;
  const links = list.querySelectorAll('[data-ch]');
  for (let i = 0; i < links.length; i++) {
    const on = parseInt(links[i].getAttribute('data-ch'), 10) === reader.chapter;
    links[i].classList.toggle('on', on);
    if (on && list.scrollHeight > list.clientHeight) {
      const top = links[i].offsetTop - list.clientHeight / 2 + links[i].offsetHeight / 2;
      list.scrollTop = Math.max(0, top);
    }
  }
}

function scheduleSavePos() {
  if (reader.saveTimer) clearTimeout(reader.saveTimer);
  reader.saveTimer = setTimeout(saveReaderPos, 500);
}

function saveReaderPos() {
  if (!reader.book) return;
  setBookPos(reader.book.id, {
    chapter: reader.chapter,
    page: reader.page,
    scroll: scrollRatio(),
    pct: overallRatio(),
    ts: Date.now()
  });
}

function jumpToRatio(r) {
  const b = reader.book;
  if (!b) return;
  const total = b.words || 1;
  const target = Math.min(0.999, Math.max(0, r)) * total;
  let idx = 0;
  let acc = 0;
  for (let i = 0; i < b.chapters.length; i++) {
    if (acc + b.chapters[i].words >= target) { idx = i; break; }
    acc += b.chapters[i].words;
    idx = i;
  }
  const cw = b.chapters[idx].words || 1;
  const inner = Math.min(1, Math.max(0, (target - acc) / cw));
  if (reader.mode === 'page') loadChapter(idx, { ratio: inner });
  else loadChapter(idx, { scroll: inner });
}

function readerToast(msg) {
  let t = document.querySelector('#reader .r-toast');
  if (!t) t = document.getElementById('gToast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(reader.toastTimer);
  reader.toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1900);
}

function toggleReaderUI() {
  const root = document.getElementById('reader');
  if (!root) return;
  root.classList.toggle('ui-hidden');
}

function openDrawer(id) {
  closeDrawers();
  const d = document.getElementById(id);
  if (d) d.classList.add('open');
}
function closeDrawers() {
  const ds = document.querySelectorAll('.r-drawer');
  for (let i = 0; i < ds.length; i++) ds[i].classList.remove('open');
}
function anyDrawerOpen() {
  return document.querySelectorAll('.r-drawer.open').length > 0;
}

function bindReaderEvents() {
  const root = document.getElementById('reader');
  if (!root) return;
  root.addEventListener('click', onReaderClick);

  const sc = document.getElementById('rScroll');
  if (sc) {
    sc.addEventListener('scroll', function () {
      if (reader.raf) return;
      reader.raf = requestAnimationFrame(function () {
        reader.raf = 0;
        updateProgressUI();
        scheduleSavePos();
      });
    }, { passive: true });
  }

  const slider = document.getElementById('rSlider');
  if (slider) {
    slider.addEventListener('change', function () {
      jumpToRatio(parseInt(this.value, 10) / 1000);
      readerToast('已跳到 ' + Math.round(parseInt(this.value, 10) / 10) + '%');
    });
  }

  bindPageDrag();
}

function onReaderClick(e) {
  if (reader.suppressClick) { reader.suppressClick = false; return; }
  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    const act = actEl.getAttribute('data-act');
    if (act === 'back') { location.hash = '#/shelf'; return; }
    if (act === 'toc') { openDrawer('rTocDrawer'); return; }
    if (act === 'set') { openDrawer('rSetDrawer'); return; }
    if (act === 'close-toc' || act === 'close-set') { closeDrawers(); return; }
    if (act === 'next-ch') {
      if (reader.chapter < reader.book.chapters.length - 1) loadChapter(reader.chapter + 1, { page: 0 });
      else location.hash = '#/shelf';
      return;
    }
    if (act === 'size-up' || act === 'size-down') {
      const step = act === 'size-up' ? 1 : -1;
      reader.prefs.size = Math.max(15, Math.min(26, reader.prefs.size + step));
      saveReaderPrefs();
      applyReaderPrefs(true);
      return;
    }
    return;
  }

  const chEl = e.target.closest('[data-ch]');
  if (chEl) {
    e.preventDefault();
    loadChapter(parseInt(chEl.getAttribute('data-ch'), 10), { page: 0 });
    closeDrawers();
    return;
  }

  const themeEl = e.target.closest('[data-theme]');
  if (themeEl && themeEl.classList.contains('theme-dot')) {
    reader.prefs.theme = themeEl.getAttribute('data-theme');
    saveReaderPrefs();
    applyReaderPrefs(false);
    return;
  }

  const lhEl = e.target.closest('[data-lh]');
  if (lhEl) {
    reader.prefs.lh = parseFloat(lhEl.getAttribute('data-lh'));
    saveReaderPrefs();
    applyReaderPrefs(true);
    return;
  }

  const modeEl = e.target.closest('[data-mode]');
  if (modeEl) {
    const nextMode = modeEl.getAttribute('data-mode');
    if (nextMode !== reader.mode) {
      let keep;
      if (reader.mode === 'page') {
        const pages = reader.pagesData || [];
        let before = 0;
        for (let i = 0; i < reader.page; i++) before += (pages[i] ? pages[i].chars : 0);
        keep = Math.min(1, before / Math.max(1, reader.book.chapters[reader.chapter].words));
      } else {
        keep = scrollRatio();
      }
      reader.mode = nextMode;
      reader.prefs.mode = nextMode;
      saveReaderPrefs();
      if (nextMode === 'scroll') loadChapter(reader.chapter, { scroll: keep });
      else loadChapter(reader.chapter, { ratio: keep });
      closeDrawers();
    }
    return;
  }

  const widthEl = e.target.closest('[data-width]');
  if (widthEl) {
    reader.prefs.width = parseInt(widthEl.getAttribute('data-width'), 10);
    saveReaderPrefs();
    applyReaderPrefs(true);
    return;
  }

  if (anyDrawerOpen()) { closeDrawers(); return; }

  const stage = e.target.closest('.r-stage');
  if (stage) {
    if (reader.mode === 'page') {
      const book = document.getElementById('bkBook') || stage;
      const rect = book.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width * 0.32) prevPage();
      else if (x > rect.width * 0.68) nextPage();
      else toggleReaderUI();
    } else {
      toggleReaderUI();
    }
  }
}

function onReaderKey(e) {
  if (!document.body.classList.contains('reading')) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  if (e.key === 'Escape') {
    if (anyDrawerOpen()) closeDrawers();
    else location.hash = '#/shelf';
    return;
  }
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
    e.preventDefault();
    nextPage();
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault();
    prevPage();
  }
}

function isAudioFile(f) {
  return /^audio\//.test(f.type || '') || /\.(mp3|m4a|wav|ogg|flac|aac)$/i.test(f.name || '');
}

function batchSummary(verb, ok, dup, fail) {
  if (!ok && !dup && !fail) return '没有可处理的文件';
  if (!ok && dup && !fail) return '这些文件都已经在库里（跳过 ' + dup + ' 首）';
  const parts = [];
  if (ok) parts.push(verb + ' ' + ok + ' 首');
  if (dup) parts.push('跳过 ' + dup + ' 首重复');
  if (fail) parts.push('失败 ' + fail + ' 首');
  return parts.join('，');
}

function batchUI(id, text, ratio) {
  const el = document.getElementById(id);
  if (!el) return;
  if (text == null) { el.classList.remove('on'); return; }
  el.classList.add('on');
  const bar = el.querySelector('.bp-track i');
  const lb = el.querySelector('span');
  if (bar) bar.style.width = (Math.max(0, Math.min(1, ratio || 0)) * 100).toFixed(1) + '%';
  if (lb) lb.textContent = text;
}

async function readDropFiles(dt) {
  const out = [];
  const items = dt && dt.items ? Array.prototype.slice.call(dt.items) : [];
  const entries = items.map(function (it) {
    return it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
  }).filter(Boolean);

  async function walk(entry, depth) {
    if (!entry || depth > 6) return;
    if (entry.isFile) {
      await new Promise(function (resolve) {
        entry.file(function (f) { if (isAudioFile(f)) out.push(f); resolve(); }, resolve);
      });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      let batch = [];
      do {
        batch = await new Promise(function (resolve) {
          reader.readEntries(resolve, function () { resolve([]); });
        });
        for (let i = 0; i < batch.length; i++) await walk(batch[i], depth + 1);
      } while (batch.length);
    }
  }

  for (let i = 0; i < entries.length; i++) await walk(entries[i], 0);
  if (!out.length) {
    return Array.prototype.slice.call((dt && dt.files) || []).filter(isAudioFile);
  }
  return out;
}

function bindDropZone(zone, handler) {
  if (!zone) return;
  let depth = 0;
  zone.addEventListener('dragenter', function (e) {
    e.preventDefault();
    depth++;
    zone.classList.add('drag');
  });
  zone.addEventListener('dragover', function (e) {
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
  });
  zone.addEventListener('dragleave', function (e) {
    e.preventDefault();
    depth--;
    if (depth <= 0) { depth = 0; zone.classList.remove('drag'); }
  });
  zone.addEventListener('drop', async function (e) {
    e.preventDefault();
    depth = 0;
    zone.classList.remove('drag');
    const files = await readDropFiles(e.dataTransfer);
    if (!files.length) { readerToast('没有识别到音频文件'); return; }
    handler(files);
  });
}

function bindMusicEvents() {
  const input = document.getElementById('musicQuery');
  const seg = document.getElementById('regionSeg');
  if (input) {
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); musicSearch(); }
    });
  }
  if (seg) seg.addEventListener('click', function (e) {
    const b = e.target.closest('[data-src]');
    if (!b) return;
    const src = b.getAttribute('data-src');
    if (input) input.value = '';
    loadSource(src);
  });

  const results = document.getElementById('musicResults');
  if (results) results.addEventListener('click', function (e) {
    const bili = e.target.closest('[data-burl]');
    if (bili) {
      e.preventDefault();
      window.open(bili.getAttribute('data-burl'), '_blank', 'noopener');
      return;
    }
    const star = e.target.closest('[data-fav]');
    if (star) { e.preventDefault(); toggleFavAt(parseInt(star.getAttribute('data-fav'), 10)); return; }
    const row = e.target.closest('[data-i]');
    if (!row) return;
    const i = parseInt(row.getAttribute('data-i'), 10);
    if (musicState.index === i && musicState.current && musicState.current.kind === 'preview') {
      togglePlay();
    } else {
      playPreview(i);
    }
  });

  const favAllBtn = document.getElementById('favPlayAll');
  if (favAllBtn) favAllBtn.addEventListener('click', function () {
    if (!favAll().length) { readerToast('还没有收藏'); return; }
    playFav(0);
  });

  const favList = document.getElementById('favList');
  if (favList) favList.addEventListener('click', function (e) {
    const un = e.target.closest('[data-unfav]');
    if (un) {
      e.preventDefault();
      const f = favAll()[parseInt(un.getAttribute('data-unfav'), 10)];
      if (f) toggleFav(f.title, f.artist, f.url, f.viewUrl);
      return;
    }
    const row = e.target.closest('[data-fid]');
    if (!row) return;
    const i = parseInt(row.getAttribute('data-fid'), 10);
    const f = favAll()[i];
    if (!f) return;
    if (musicState.current && musicState.current.key === f.key) togglePlay();
    else playFav(i);
  });

  const drop = document.getElementById('localDrop');
  const fileInput = document.getElementById('localInput');
  if (drop && fileInput) {
    drop.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () {
      const files = Array.prototype.slice.call(this.files || []);
      this.value = '';
      if (files.length) addLocalTracks(files);
    });
  }

  const localList = document.getElementById('localList');
  if (localList) localList.addEventListener('click', function (e) {
    const sv = e.target.closest('[data-tsave]');
    if (sv) { e.preventDefault(); saveLocalToDevice(sv.getAttribute('data-tsave')); return; }
    const up = e.target.closest('[data-tup]');
    if (up) { e.preventDefault(); uploadLocalToCloud(up.getAttribute('data-tup'), up); return; }
    const del = e.target.closest('[data-tdel]');
    if (del) { e.preventDefault(); delLocalTrack(del.getAttribute('data-tdel')); return; }
    const row = e.target.closest('[data-tid]');
    if (!row) return;
    const id = row.getAttribute('data-tid');
    const t = musicState.local.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    if (musicState.current && musicState.current.id === id) togglePlay();
    else playLocalTrack(t);
  });

  const fixBtn = document.getElementById('cloudHashFix');
  if (fixBtn) fixBtn.addEventListener('click', function () { rebuildCloudHashes(fixBtn); });

  bindDropZone(document.getElementById('localDrop'), function (files) { addLocalTracks(files); });
  bindDropZone(document.getElementById('cloudMusicDrop'), function (files) { cloudUploadTracks(files); });

  const dirBtn = document.getElementById('localDirBtn');
  const dirInput = document.getElementById('localDirInput');
  if (dirBtn && dirInput) {
    if (!('webkitdirectory' in document.createElement('input'))) {
      dirBtn.style.display = 'none';
    } else {
      dirBtn.addEventListener('click', function (e) { e.stopPropagation(); dirInput.click(); });
      dirInput.addEventListener('change', function () {
        const files = Array.prototype.slice.call(this.files || []);
        this.value = '';
        if (files.length) addLocalTracks(files);
      });
    }
  }

  const cDrop = document.getElementById('cloudMusicDrop');
  const cInput = document.getElementById('cloudMusicInput');
  if (cDrop && cInput) {
    cDrop.addEventListener('click', function () { cInput.click(); });
    cInput.addEventListener('change', function () {
      const files = Array.prototype.slice.call(this.files || []);
      this.value = '';
      if (files.length) cloudUploadTracks(files);
    });
  }

  const cList = document.getElementById('cloudMusicList');
  if (cList) cList.addEventListener('click', function (e) {
    const del = e.target.closest('[data-cmdel]');
    if (del) { e.preventDefault(); cloudDeleteTrack(del.getAttribute('data-cmdel')); return; }
    const sv = e.target.closest('[data-cmsave]');
    if (sv) { e.preventDefault(); saveCloudToDevice(sv.getAttribute('data-cmsave')); return; }
    const dl = e.target.closest('[data-cmdl]');
    if (dl) { e.preventDefault(); cloudDownloadTrack(dl.getAttribute('data-cmdl'), dl); return; }
    const row = e.target.closest('[data-cid]');
    if (!row) return;
    const id = row.getAttribute('data-cid');
    const t = musicState.cloud.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    if (musicState.current && musicState.current.id === id) togglePlay();
    else playCloudTrack(t);
  });

}

async function musicSearch() {

    musicState.src = 'hk';

  musicState.query = q;
  renderResHead();
  box.innerHTML = '<div class="music-empty">搜索中…</div>';
  try {

function normHot(it) {
  const links = Array.isArray(it.link) ? it.link : (it.link ? [it.link] : []);
  const enc = links.filter(function (l) { return l.attributes && l.attributes.rel === 'enclosure'; })[0];
  const alt = links.filter(function (l) { return l.attributes && l.attributes.rel === 'alternate'; })[0];
  return {
    trackName: (it['im:name'] && it['im:name'].label) || '',
    artistName: (it['im:artist'] && it['im:artist'].label) || '',
    collectionName: (it['im:collection'] && it['im:collection']['im:name'] && it['im:collection']['im:name'].label) || '',
    previewUrl: enc ? enc.attributes.href : '',
    trackViewUrl: alt ? alt.attributes.href : '',
    trackId: (it.id && it.id.attributes && it.id.attributes['im:id']) || ''
  };
}

async function loadHot() {
  const box = document.getElementById('musicResults');

  box.innerHTML = '<div class="music-empty">正在取 ' + (REGION_NAME[musicState.region] || '') + ' 热门榜…</div>';
  try {
    const res = await fetch('https://itunes.apple.com/' + musicState.region + '/rss/topsongs/limit=10/json');
    const data = await res.json();
    const entries = (data.feed && data.feed.entry) || [];
    musicState.results = entries.map(normHot).filter(function (x) { return x.previewUrl; });
    musicState.index = -1;
    renderTrackList();

    box.innerHTML = '<div class="music-empty">榜单取不到：可能网络访问不了 Apple 的接口。<br>可以先搜索，或播放「我的音乐」里的本地文件。</div>';

}

function fmtView(n) {

  if (n >= 100000000) return (n / 100000000).toFixed(1) + ' 亿播放';

  return n + ' 播放';
}

    kind: 'preview', title: t.trackName, artist: t.artistName,
    h: musicKey(t), url: t.previewUrl, viewUrl: t.trackViewUrl, key: favKey(t.trackName, t.artistName)
  });

async function playStream(url, meta) {
  stopAudio();
  musicState.current = meta;
  showPlayer();
  refreshMusicLists();
  const btn = document.querySelector('#musicResults .track.on .tr-play');
  if (btn) btn.textContent = '加载中';

  let src = url;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('http');
    const blob = await res.blob();
    src = URL.createObjectURL(blob);
    musicState.objectUrl = src;
  } catch (e) {
    /* 直接播，若被 CSP 拦会走 error */
  }

  const audio = new Audio(src);
  audio.preload = 'auto';
  audio.addEventListener('timeupdate', updateBar);
  audio.addEventListener('ended', function () {
    musicState.playing = false;
    updatePlayerBtn();
    refreshMusicLists();
  });
  audio.addEventListener('error', function () {
    musicState.playing = false;
    updatePlayerBtn();
    refreshMusicLists();
  });
  musicState.audio = audio;
  musicState.playing = true;
  attachAnalyser(audio);
  try {
    await audio.play();
  } catch (e) {
    musicState.playing = false;
  }
  updatePlayerBtn();
  showPlayer();
  refreshMusicLists();
}

async function playAudioBlob(blob, meta) {
  stopAudio();
  try {
    const url = URL.createObjectURL(blob);
    musicState.objectUrl = url;
    const audio = new Audio(url);
    audio.addEventListener('timeupdate', updateBar);
    audio.addEventListener('ended', function () {
      musicState.playing = false;
      updatePlayerBtn();
      renderLocalTracks();
      renderCloudMusic();
      advance(1, true);
    });
    musicState.audio = audio;
    musicState.playing = true;
    musicState.current = meta;
    attachAnalyser(audio);
    await audio.play();
    showPlayer();
    renderLocalTracks();
    renderCloudMusic();
  } catch (e) {
    stopAudio();
    updatePlayerBtn();
    if (musicState.current) readerToast('已切到下一首，点播放继续');
  }
}

async function playLocalTrack(t) {
  const name = t.name.replace(/\.[^.]+$/, '');

}

function togglePlay() {
  if (!musicState.audio) return;
